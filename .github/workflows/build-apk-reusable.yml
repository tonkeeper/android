name: Build APK Reusable

on:
  workflow_call:
    inputs:
      gradle-task:
        description: Gradle task used to build the APK
        required: true
        type: string
      artifact-name-prefix:
        description: Prefix for uploaded artifact name
        required: true
        type: string
      apk-path-glob:
        description: Glob path to built APK files
        required: true
        type: string
      mapping-path-glob:
        description: Glob path to R8/ProGuard mapping outputs; uploaded only when files exist
        required: false
        type: string
        default: apps/wallet/instance/main/build/outputs/mapping/**
      signing-mode:
        description: Which keystore to sign with — `debug` or `release`
        required: false
        type: string
        default: debug
      ref:
        description: Git ref to build; empty = triggering ref
        required: false
        type: string
        default: ''
      gradle-cache:
        description: >-
          Use the Gradle build cache, configuration cache and daemon.
          Off keeps the conservative cold-build flags.
        required: false
        type: boolean
        default: false
      artifact-retention-days:
        description: How long to keep the uploaded artifacts
        required: false
        type: number
        default: 90
      inject-version-code:
        description: >-
          Export VERSION_CODE into the build environment. Off leaves the
          build.gradle.kts fallback (1000000000) in place and, more importantly,
          keeps a per-commit value out of the configuration-cache inputs.
        required: false
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: Uploaded artifact name
        value: ${{ jobs.build-apk.outputs.artifact-name }}
      mapping-artifact-name:
        description: Uploaded mapping artifact name; empty when the build is not obfuscated
        value: ${{ jobs.build-apk.outputs.mapping-artifact-name }}
      version-code:
        description: Build version code derived from commit timestamp
        value: ${{ jobs.build-apk.outputs.version-code }}

jobs:
  build-apk:
    name: Build APK
    runs-on: macos-latest-xlarge
    env:
      GRADLE_CACHE_ARGS: ${{ inputs.gradle-cache && '--build-cache --configuration-cache' || '--no-daemon --no-build-cache --no-configuration-cache' }}

    outputs:
      artifact-name: ${{ steps.artifact_name.outputs.artifact_name }}
      mapping-artifact-name: ${{ steps.upload_mapping.outputs.artifact-id && steps.artifact_name.outputs.mapping_artifact_name || '' }}
      version-code: ${{ steps.version_code.outputs.version_code }}

    steps:
      - name: Checkout to git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Get VERSION_CODE from commit timestamp
        id: version_code
        shell: bash
        run: |
          VERSION_CODE="$(git log -1 --format=%ct)"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.inject-version-code }}" = "true" ]; then
            echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle Wrapper
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Without a key the configuration-cache data is not saved or restored.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Create local.properties
        uses: ./.github/actions/local-properties
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          chainkit-user: ${{ secrets.CHAINKIT_GITHUB_USER }}
          chainkit-token: ${{ secrets.CHAINKIT_GITHUB_TOKEN }}

      - name: Decode debug keystore
        if: inputs.signing-mode == 'debug'
        shell: bash
        run: echo "${{ secrets.TONKEEPER_DEBUG_STORE_FILE }}" | base64 --decode > "${{ github.workspace }}/internal.keystore"

      - name: Decode release keystore
        if: inputs.signing-mode == 'release'
        shell: bash
        run: echo "${{ secrets.ANDROID_DIST_SIGNING_KEY }}" | base64 --decode > "${{ github.workspace }}/release.keystore"

      - name: Build APK (debug signing)
        if: inputs.signing-mode == 'debug'
        shell: bash
        run: |
          ./gradlew ${{ inputs.gradle-task }} \
            $GRADLE_CACHE_ARGS \
            -Pandroid.injected.signing.debug.file="${{ github.workspace }}/internal.keystore" \
            -Pandroid.injected.signing.debug.password="${{ secrets.TONKEEPER_DEBUG_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.debug.key.alias="${{ secrets.TONKEEPER_DEBUG_KEY_ALIAS }}" \
            -Pandroid.injected.signing.debug.key.password="${{ secrets.TONKEEPER_DEBUG_KEY_PASSWORD }}"

      - name: Build APK (release signing)
        if: inputs.signing-mode == 'release'
        shell: bash
        run: |
          ./gradlew ${{ inputs.gradle-task }} \
            $GRADLE_CACHE_ARGS \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.TONKEEPER_UPLOAD_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.TONKEEPER_UPLOAD_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.TONKEEPER_UPLOAD_KEY_PASSWORD }}"

      - name: Compose artifact name
        id: artifact_name
        shell: bash
        run: |
          VERSION_CODE="${{ steps.version_code.outputs.version_code }}"
          echo "artifact_name=${{ inputs.artifact-name-prefix }}-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "mapping_artifact_name=${{ inputs.artifact-name-prefix }}-mapping-${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload built APK to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: ${{ inputs.apk-path-glob }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload R8 mapping to artifacts
        id: upload_mapping
        if: inputs.mapping-path-glob != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.mapping_artifact_name }}
          path: ${{ inputs.mapping-path-glob }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

    RechargeMethods:
      type: object
      required:
        - methods
      properties:
        methods:
          type: array
          items:
            type: object
            required:
              - chain
              - asset_id
              - type
              - symbol
              - decimals
              - rate
              - support_gasless
              - support_recharge
            properties:
              chain:
                type: string
                description: the chain the asset is on, as in /gasless/battery/config
                example: "tron/mainnet"
              asset_id:
                type: string
                description: >-
                  the asset, as in /gasless/battery/config: "<chain>/coin" for the chain's native coin,
                  "<chain>/jetton/<master, raw>", "<chain>/trc20/<contract>", "<chain>/erc20/<address>"
                example: "tron/mainnet/trc20/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
              image:
                type: string
                example: "https://example.com/image.png"
              jetton_master:
                type: string
              min_bootstrap_value:
                type: string
                description: >-
                  the least amount accepted, in units of the asset; for the other chains, the least
                  purchase
                example: "10.0"
              type:
                type: string
                enum:
                  - jetton
                  - ton
                  - trc20
                  - erc20
                  - spl
                  - coin
              rate:
                type: string
                description: TON credited for one unit of the asset, after the markup
                example: "10.250"
              charges_rate:
                type: string
                description: >-
                  charges credited for one unit of the asset, after the markup: rate at the price of a
                  charge. Before the network fee of the transfer, which /purchase-battery/estimate takes off.
                example: "3942.3077"
              symbol:
                type: string
                example: "usdt"
              decimals:
                type: integer
                example: 6
              support_gasless:
                type: boolean
                example: true
              support_recharge:
                type: boolean
                example: true
    NetworkFees:
      type: object
      required: [ assets ]

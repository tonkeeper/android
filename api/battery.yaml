      properties:
        typical:
          type: string
          description: What it usually costs.
          example: "118000000000000"
        high:
          type: string
          description: Covers almost every transaction.
          example: "694000000000000"
        safe:
          type: string
          description: High with a 30% margin.
          example: "902200000000000"
    Purchases:
      type: object
      required:

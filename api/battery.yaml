  schemas:
    TronBatteryPurchaseEstimate:
      type: object
      required:
        - funds_receiver
        - usdt_contract
        - amount
        - min_amount
        - markup_percent
        - gross_charges
        - resources_charges
        - charges
      properties:
        funds_receiver:
          type: string
          description: the TRON address the USDT goes to
        usdt_contract:
          type: string
          example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        amount:
          type: string
          description: USDT, in whole units
        min_amount:
          type: string
        markup_percent:
          type: string
        promo_bonus_percent:
          type: string
        gross_charges:
          type: integer
          description: charges the USDT buys, promo bonus included
        resources_charges:
          type: integer
          description: charges taken for the energy and bandwidth of the transfer
        charges:
          type: integer
          description: what the balance grows by
        energy:
          type: integer
        bandwidth:
          type: integer
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'
        expires_at:
          type: string
          format: date-time
          description: the operation is to be sent by then
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: error description
    Status:
      type: object
      required:
        - pending_transactions
        - busy_wallets
      properties:
        pending_transactions:
          type: array
          items:
            type: object
            required:
              - id
            properties:
              id:
                type: string
        busy_wallets:
          type: array
          description: >-
            The user's wallets a message to which /message refuses now (err-gasless-pending-messages):
            a message of theirs is accepted and has not landed, or a transaction of theirs is still
            running its trace. A wallet is busy from the moment /message accepts a message. Send the
            next message to a wallet once it is no longer listed here.
          items:
            type: object
            required:
              - address
              - since
            properties:
              address:
                type: string
                description: raw address
                example: "0:945c7be88b0d0c8250cbf42cbffa9137cecc4a98e3581fafa4413cf2dfe2c25d"
              since:
                type: string
                format: date-time
    EnterpriseWalletConfig:
      type: object
      required:
        - excess_account
      properties:
        excess_account:
          type: string
          description: when building a message to transfer an NFT or Jetton, use this address to send excess funds back to Battery Service.
          example: 0:da6b1b6663a0e4d18cc8574ccd9db5296e367dd9324706f3bbd9eb1cd2caf0bf

    RelayerSendingEstimation:

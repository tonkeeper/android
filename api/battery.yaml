    GaslessEstimation:
      type: object
      required:
        - commission
      properties:
        commission:
          type: string

    GaslessCommissionJettonTransfer:
      type: object
      required:
        - destination
        - amount
      properties:
        destination:
          type: string
          description: Destination of commission jetton transfer (usually relayer)
        amount:
          type: string
          description: Commission amount in smallest jetton units (nano-jettons)
    PromoUsed:
      type: object
      required:
        - promo_used

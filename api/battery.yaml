  /restricted/users/{user_id}/merge:
    post:
      operationId: mergeUsers
      description: >-
        Merges a public-key user into the wallet-id user of the same wallet: the whole balance, the
        purchases (TON, iOS, Android, TRON, promo codes), the sent messages of every chain, the linked
        TON addresses and the public key move over, so a TonConnect sign-in with that key lands on the wallet-id user from then on. The
        public-key user's row stays, with neither a key nor a balance. Other pods may keep signing the
        key in as the old user for up to 15 minutes (their cache); anything credited to it meanwhile is
        merged by calling this again. Purchases with a refund stay where they are. Refused when the
        addresses of the public-key user -- those it bought for, promo campaigns made out to, linked,
        and the wallets of its key -- and the wallet-id user's wallet (as multichain lists it) have
        none in common, unless the pair was merged before, when another wallet-id user with one of those addresses was
        created later (the merge goes into the newest one), or while the public-key user has a message or a refund in flight.
        Everything is applied in one transaction; dry_run checks and reports without changing anything.
      parameters:
        - $ref: '#/components/parameters/adminToken'
        - name: user_id
          in: path
          description: The public-key user to merge.
          schema:
            type: integer
            format: int64
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ to_user_id, reason ]
              properties:
                to_user_id:
                  type: integer
                  format: int64
                  description: The wallet-id user to merge into.
                reason:
                  type: string
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: the merge, done or as it would be done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMerge'
        'default':
          $ref: '#/components/responses/Error'

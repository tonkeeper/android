openapi: 3.0.2
info:
  title: Custodial-Battery REST API.
  version: 0.0.1
  description: REST API for Custodial Battery which provides gas to different networks to help execute transactions.
  contact:
    name: Support
    email: support@tonkeeper.com
servers:
  - url: "https://battery.tonkeeper.com"
  - url: "https://testnet-battery.tonkeeper.com"
paths:
  /tonconnect/payload:
    get:
      description: Get a payload for further token receipt
      operationId: getTonConnectPayload
      tags:
        - Connect
      responses:
        '200':
          description: payload
          content:
            application/json:
              schema:
                type: object
                required:
                  - payload
                properties:
                  payload:
                    type: string
                    example: "84jHVNLQmZsAAAAAZB0Zryi2wqVJI-KaKNXOvCijEi46YyYzkaSHyJrMPBMOkVZa"
        'default':
          $ref: '#/components/responses/Error'
  /tonconnect/proof:
    post:
      description: Account verification and token issuance
      operationId: tonConnectProof
      tags:
        - Wallet
      requestBody:
        $ref: "#/components/requestBodies/TonConnectProof"
      responses:
        '200':
          description: auth token
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    example: "NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3..."
        'default':
          $ref: '#/components/responses/Error'
  /status:
    get:
      description: This method returns information about the current status of Battery Service.
      operationId: getStatus
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/battery/config:
    get:
      description: >-
        What the gasless 2.0 flow serves: the chains, the payload types each of them accepts, and
        the assets that can pay the relayer there. "battery/mainnet" is the user's charges ("battery" is accepted too).
      operationId: gaslessBatteryConfig
      tags:
        - Gasless
      responses:
        '200':
          description: The chains and assets served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2Config'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/estimate:
    post:
      description: >-
        Prices one payload in every asset that can pay the relayer on its chain, and says which of
        them the sender can afford.
      operationId: gaslessEstimate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: >-
            JWT token from Pro service. On TRON a Pro subscription's free transfers pay instead of
            charges, as on /tron/estimate and /tron/send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2EstimateRequest'
      responses:
        '200':
          description: One estimation per asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2EstimateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/emulate:
    post:
      description: >-
        Builds the operation to sign from unsigned payloads and the asset chosen to pay the relayer,
        and emulates it. The operation is kept until expires_at and /gasless/send checks the
        signatures against it.
      operationId: gaslessEmulate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: >-
            JWT token from Pro service. On TRON a Pro subscription's free transfers pay instead of
            charges, as on /tron/estimate and /tron/send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2EmulateRequest'
      responses:
        '200':
          description: The operation to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2EmulateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/send:
    post:
      description: >-
        Takes the signed payloads of an emulated operation, checks them against it one to one, and
        broadcasts. A battery purchase from /purchase-battery/emulate is sent here as well:
        the balance grows once its transfer succeeds on chain.
      operationId: gaslessSend
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: >-
            JWT token from Pro service. On TRON a Pro subscription's free transfers pay instead of
            charges, as on /tron/estimate and /tron/send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2SendRequest'
      responses:
        '200':
          description: The operation was broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2SendResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /config:
    get:
      description: This method returns information about Battery Service.
      operationId: getConfig
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        'default':
          $ref: '#/components/responses/Error'
  /network-fees:
    get:
      description: >-
        What a swap and a perps deposit of an asset cost when the wallet pays the gas itself in the
        chain's native coin, for the native coin of every chain /gasless/battery/config serves and
        every asset it lists on its own chain (not battery charges, nor TON listed under TRON as a
        way to pay), and for BTC. It is the fee spent, not
        the balance a transaction needs up front (an EVM gas limit at the max fee, TON attached to a
        jetton transfer, rent for a new Solana token account). The gas an operation takes is fixed,
        from our users' transactions; on EVM chains it is priced at the network's current gas price, on
        Bitcoin at the fee rate our users' wallets pay now.
      operationId: getNetworkFees
      responses:
        '200':
          description: One entry per asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFees'
        'default':
          $ref: '#/components/responses/Error'
  /promo-used:
    get:
      operationId: getPromoUsed
      parameters:
        - name: promo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoUsed'
        'default':
          $ref: '#/components/responses/Error'
  /battery-charged:
    get:
      description: This method returns information about a user's balance.
      operationId: getBatteryCharged
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryCharged'
        'default':
          $ref: '#/components/responses/Error'
  /balance:
    get:
      description: This method returns information about a user's balance.
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/balanceUnits'
        - $ref: '#/components/parameters/region'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        'default':
          $ref: '#/components/responses/Error'
  /wallet/migrate:
    post:
      description: >-
        Moves the battery of a TON wallet's old public-key user -- the one X-TonConnect-Auth signs
        for -- to the new wallet-id user. Only a positive balance moves; a negative one stays with
        the old user, as does its purchase history. One-way and once: a second request answers 409.
        The new user's purchases show it as one "migration" of the charges moved, from
        `from_address`: the TON wallet migrated, which has to be one of the old key's wallets.
        `proof` shows the old key agrees to this destination: a hex ed25519 signature, by the old
        wallet's key, over LP("keeper.battery.migrate.v1") | LP(X-Wallet-ID) | LP(old public key),
        where LP(x) is one length byte followed by x and the public key is its 32 raw bytes.
      operationId: migrateBattery
      tags:
        - Wallet
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ proof, from_address ]
              properties:
                proof:
                  type: string
                  pattern: '^[0-9a-fA-F]{128}$'
                  description: hex of the 64-byte ed25519 signature described above
                from_address:
                  type: string
                  description: the TON wallet the battery is moved from, raw or user-friendly
      responses:
        '200':
          description: The battery was migrated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryMigration'
        'default':
          $ref: '#/components/responses/Error'
  /wallet/emulate:
    post:
      description: Emulate sending message to blockchain
      operationId: emulateMessageToWallet
      tags:
        - Emulation
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: enable_validation
          in: query
          schema:
            type: boolean
            default: false
          required: false
      requestBody:
        $ref: "#/components/requestBodies/Boc"
      responses:
        '200':
          description: emulated message
          headers:
            Allowed-By-Battery:
              required: true
              schema:
                type: boolean
                example: "true"
            Supported-By-Battery:
              required: true
              schema:
                type: boolean
                example: "true"
            Reject-Reason:
              schema:
                type: string
                example: "message is too large"
            X-Battery-Protocol-Name:
              schema:
                type: string
            Excess:
              required: true
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /message:
    post:
      description: Send message to blockchain
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/promo'
      requestBody:
        $ref: "#/components/requestBodies/BocWithProof"
      responses:
        '200':
          description: "success"
          headers:
            X-Battery-Protocol-Name:
              schema:
                type: string
            X-Battery-Relayer-Message-Hash:
              description: >-
                Hex hash of the external message the relayer sent for this request: the one that
                carries a W5 wallet's signed message, or the top-up of another wallet. Absent when the
                relayer has not sent it yet.
              schema:
                type: string
        'default':
          $ref: '#/components/responses/Error'
  /estimate:
    post:
      description: >-
        Estimate what an operation will cost, on any chain. The request body is picked by its
        "chain" field, and each chain takes the values its own estimator needs.
      operationId: estimate
      tags:
        - Multichain
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: The estimate, shaped by the chain it was asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        'default':
          $ref: '#/components/responses/Error'
  /send:
    post:
      description: >-
        Send an operation, on any chain. The request body is picked by its "chain" field, and each
        chain takes the values its own relayer needs.
      operationId: send
      tags:
        - Multichain
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - $ref: '#/components/parameters/promo'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '200':
          description: The result, shaped by the chain it was sent on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/config:
    get:
      operationId: getTronConfig
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                type: object
                required:
                  - safety_margin_percent
                properties:
                  safety_margin_percent:
                    type: string
                    example: "1.5"
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/estimate:
    get:
      description: Estimate cost of sending a tx in Tron network
      operationId: tronEstimate
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
        - name: energy
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000000
            minimum: 0
        - name: bandwidth
          in: query
          required: false
          schema:
            type: integer
            maximum: 2000
            minimum: 0
        - name: wallet
          in: query
          required: true
          schema:
            type: string
        - name: enable_validation
          in: query
          required: false
          description: Enable balance validation for battery charges
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimatedTronTx'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/send:
    post:
      description: send TRON tx
      operationId: tronSend
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
        - name: user_public_key
          in: query
          required: false
          description: User public key for commission payments (required when instant_fee_tx is provided)
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/TronTx"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentTronTx'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/transactions:
    get:
      operationId: getTronTransactions
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/maxTimestamp'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TronTransactionsList'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/available-transfers:
    get:
      description: Get number of available TRON free transfers for Pro users
      operationId: getTronAvailableTransfers
      parameters:
        - name: X-Pro-Auth
          in: header
          required: true
          schema:
            type: string
          description: JWT token from Pro service (Bearer token)
      responses:
        '200':
          description: Available transfers information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TronAvailableTransfers'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/itrx-io-callback:
    post:
      description: receive callback from itrx.io
      operationId: itrxIoCallback
      parameters:
        - $ref: '#/components/parameters/itrxSignature'
        - $ref: '#/components/parameters/itrxTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/android:
    post:
      description: verify an in-app purchase
      operationId: androidBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/AndroidBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AndroidBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/ios/app-store-notification:
    post:
      operationId: appStoreNotification
      requestBody:
        $ref: "#/components/requestBodies/appStoreNotification"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appStoreResponse'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/ios:
    post:
      description: verify an in-app purchase
      operationId: iosBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/iOSBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iOSBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/promo-code:
    post:
      description: charge battery with promo code
      operationId: promoCodeBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/promoCodeBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promoCodeBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/estimate:
    post:
      description: |
        What /purchase-battery/emulate would answer, without building or keeping the operation: the
        same checks and the same figures -- the network fee and the charges the purchase adds -- for
        a client to show while the amount is typed in. Nothing is to be signed or sent from it.
      operationId: purchaseBatteryEstimate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseBatteryEmulateRequest'
      responses:
        '200':
          description: The purchase's figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseBatteryEstimateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/emulate:
    post:
      description: |
        Quote a battery purchase paid in crypto on a chain other than TON, and build the operation to
        sign, in the shape of /gasless/emulate (docs/generic payload). `asset_id` is one of
        /recharge-methods?multichain=true outside TON, on `chain_id`. The operation is a USDT TRC-20
        transfer as a "prebuild" payload on TRON, a sponsored batch as an "eip7821/hermes/delegate"
        payload on an EVM chain (after an "eip7702/authorization" one for an account never
        delegated), and a "prebuild" payload on Solana. The battery pays the transfer's network fee
        -- TRON energy and bandwidth, EVM gas, the Solana fee -- and `fee` is what it takes off the
        purchase, in charges: `charges` is what the balance grows by; /purchase-battery/estimate gives
        the same figures without building anything. Sign the operation as any other
        and send it to /gasless/send before `expires_at`; it checks the signatures against it.
      operationId: purchaseBatteryEmulate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseBatteryEmulateRequest'
      responses:
        '200':
          description: The operation to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseBatteryEmulateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':

                required:
                  - jetton_master
                  - symbol
                  - value
                properties:
                  jetton_master:
                    type: string
                  symbol:
                    type: string
                    example: "USD₮"
                  value:
                    type: string
                    description: "transfer cost in TON"
                    example: "0.002"
    PackageItem:
      type: object
      required:
        - name
        - image
        - charges
      properties:
        name:
          type: string
          enum: 
            - large
            - medium
            - small
            - other

  /purchase-battery/solana/emulate:
    post:
      deprecated: true
      summary: superseded by /purchase-battery/emulate, the same for every chain, sent to /gasless/send
      description: |
        Quote a battery purchase paid on Solana in USDT, USDC or SOL, and the operation to sign
        (docs/generic payload): one "prebuild" payload on sol/mainnet, `meta.data` the transfer of
        `amount` from `from` to the purchases wallet with the relay as the fee payer, base64, for a

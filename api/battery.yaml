        '200':
          description: the purchase to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvmBatteryPurchaseQuote'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/evm:
    post:
      deprecated: true

      description: >-
        Pairs of a public-key user and a wallet-id user tied to the same address since `since`: both
        have a TON purchase for it, or the public-key user redeemed a promo campaign made out to it
        (a campaign credits the user of the wallet's public key). With several wallet-id users for one public-key user, the one
        created last is returned. Each pair is a candidate for /restricted/users/{user_id}/merge,
        which checks the address against multichain before it moves anything.
      parameters:
        - $ref: '#/components/parameters/adminToken'

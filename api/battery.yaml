  /transaction:
    get:
      description: >-
        Return how many battery charges a transaction consumed. Public: it exposes only the charge
        cost of a transaction the caller already knows the hash of.
      operationId: getTransaction
      tags:
        - Multichain
      parameters:
        - name: chain
          in: query
          required: true
          description: >-
            tron, ton, or an EVM network the relay serves: eth, bsc, arb, base, polygon.
          schema:
            type: string
            enum: [ tron, ton, eth, bsc, arb, base, polygon ]
        - name: hash
          in: query
          required: true
          description: >-
            transaction hash. For TRON this is the txid. For TON it is either the on-chain
            transaction hash or the hash of the external message the wallet signed; both hex
            and base64 are accepted. For an EVM network it is the hash /send returned, 0x-prefixed
            hex.
          schema:
            type: string
            example: 6c4e6d3a2b1f0e9d8c7b6a5948372615043f2e1d0c9b8a7968574635241302f1
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: [ chain, hash, charges ]
                properties:
                  chain:
                    type: string
                    enum: [ tron, ton, eth, bsc, arb, base, polygon ]
                  hash:
                    type: string
                  charges:
                    type: integer
                    description: >-
                      battery charges consumed by the transaction. On an EVM network it is what was
                      held for it while pending, and 0 for a gasless transaction paid in a token.
                  is_pending:
                    type: boolean
                  is_failed:
                    type: boolean
                  timestamp:
                    type: integer
                    format: int64
        'default':
          $ref: '#/components/responses/Error'
components:
  parameters:
    enterpriseAccessToken:
      in: header
      name: X-Enterprise-Auth
      schema:
        type: string
        example: NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
      required: true
    itrxSignature:
      in: header
      name: SIGNATURE
      schema:
        type: string
      required: true
    itrxTimestamp:
      in: header
      name: TIMESTAMP
      schema:
        type: string
      required: true
    token:
      in: header
      name: X-TonConnect-Auth
      schema:
        type: string
        example: NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
      required: true
    optionalToken:
      in: header
      name: X-TonConnect-Auth
      schema:
        type: string
        example: NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
      required: false
    walletId:
      in: header
      name: X-Wallet-ID
      required: false
      description: >-
        Tonkeeper WalletID identifying the wallet, format 2 only: base32 lowercase 36-char, which
        carries its own format and kind and is the one X-Wallet-Authorization can be checked
        against. The earlier hex64 and base32 32-char spellings are no longer accepted — a proof is
        verified by recovering the signing key from it, which those derivations cannot do, so an id
        that cannot be proven cannot be trusted to name a wallet.
        When it comes with a valid access token in Authorization, the request is
        authenticated by the wallet id; otherwise X-TonConnect-Auth is used as before.
        The wallet id alone identifies the user; the public key is not sent by
        the client, it is taken from the message the request carries.
      schema:
        type: string
        pattern: '^[a-z2-7]{36}$'
        example: "aia4kzm6zmtrdhv3iqy3knmnjaxoqy54migq"
    walletToken:
      in: header
      name: Authorization
      required: false
      description: >-
        Bearer token for WalletID-based requests, "Bearer <token>". A keeper-issued access token,
        verified against the published keys. A request that has X-Wallet-ID with a token that does
        not verify is rejected with 401 unless it also carries X-TonConnect-Auth.
        The token is issued to a device and says nothing about which wallet it speaks for, so on
        its own it does not authenticate the X-Wallet-ID beside it — that is what
        X-Wallet-Authorization is for.
      schema:
        type: string
        example: Bearer NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
    walletAuth:
      in: header
      name: X-Wallet-Authorization
      required: false
      description: >-
        Proof that the wallet owns the access token in Authorization, base64url of a 65-byte
        recoverable secp256k1 signature (R | S | V) over
        LP("keeper.wallet.auth.v1") | LP(blake2b256(access_token)), padding optional.
        It carries no operation of its own and is what guards the replies that would otherwise
        reveal which addresses sit behind a wallet_id.
        Mandatory, on every endpoint, whenever the request authenticates by a format 2 wallet_id:
        the access token belongs to a device and says nothing about which wallet it speaks for, so
        without this the wallet_id is unauthenticated. A request that names one and cannot prove it
        is answered with 401.
        Marked optional here because it is not always applicable, not because it can be skipped:
        callers authenticating by X-TonConnect-Auth or an enterprise token have no wallet_id to
        prove and never send it.
        It is bound to the access token, so it lives exactly as long as that token and has to be
        signed again after a device refresh.
      schema:
        type: string
        example: "MCr-AZmLXTXN5MxMMpzx3k3XHQYxn3qE967viec3RQd-rCdDXZ3HHPj9addvd2QzJTxN1LOe0imcQ8MOqdSYpgA"
    promo:
      in: header
      name: X-Promo
      required: false
      description: >-
        Promo code the client wants applied. For now it is only accepted, nothing
        is redeemed by it.
      schema:
        type: string
        example: "HAMSTER"
    optionalEnterpriseAccessToken:
      in: header
      name: X-Enterprise-Auth
      schema:
        type: string
        example: NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
      required: false
      description: Enterprise access token; use with Tron battery billing for enterprise accounts
    adminToken:
      in: query
      name: token
      schema:
        type: string
      required: true
    jettonMasterParameter:
      in: path
      name: jetton_master
      required: true
      schema:
        type: string
    purchaseId:
      in: query
      name: id
      required: true
      schema:
        type: integer
    limitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 1000
        maximum: 1000
    offsetQuery:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
    maxTimestamp:
      in: query
      name: max_timestamp
      required: false
      schema:
        type: integer
        format: int64
    i18n:
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
        example: "ru-RU,ru;q=0.5"
        default: "en"
    balanceUnits:
      in: query
      name: units
      schema:
        type: string
        default: "usd"
        enum:
          - usd
          - ton
    region:
      in: query
      name: region
      required: false
      schema:
        type: string
        description: "User's region for analytics purposes"
  requestBodies:
    TonConnectProof:
      description: "Data that is expected from TON Connect"
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - address
              - proof
            properties:
              address:
                type: string
                example: "0:97146a46acc2654y27947f14c4a4b14273e954f78bc017790b41208b0043200b"
              proof:
                type: object
                required:
                  - timestamp
                  - domain
                  - signature
                  - payload
                properties:
                  timestamp:
                    type: integer
                    format: int64
                    example: "1678275313"
                  domain:
                    type: object
                    required:
                      - value
                    properties:
                      length_bytes:
                        type: integer
                        format: int32
                      value:
                        type: string
                  signature:
                    type: string
                  payload:
                    type: string
                    example: "84jHVNLQmZsAAAAAZB0Zryi2wqVJI-KaKNXOvCijEi46YyYzkaSHyJrMPBMOkVZa"
                  state_init:
                    type: string
    EnterpriseSendingBoc:
      description: bag-of-cells serialized to base64
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - boc
              - wallet_public_key
            properties:
              boc:
                type: string
                example: te6ccgECBQEAARUAAkWIAWTtae+KgtbrX26Bep8JSq8lFLfGOoyGR/xwdjfvpvEaHg
              wallet_public_key:
                type: string

    TronTx:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - wallet
            properties:
              tx:
                type: string
              energy:
                type: integer
                minimum: 0
                maximum: 1000000
              bandwidth:
                type: integer
                minimum: 0
                maximum: 2000
              wallet:
                type: string
              instant_fee_tx:
                type: string
                description: "base64 encoded payment transaction in the TON network"
              proof:
                description: >-
                  Not enforced yet: the value is accepted and validated when present, and a request
                  without it is still served. Signature made with the wallet's root key over
                  LP("keeper.battery.send.v1") | LP(wallet_id) | LP(chain) | LP(blake2b256(digest)),
                  hex-encoded, exactly as on /message. chain is "tron" for this endpoint.
                  Unlike TON, where the boc alone fixes the cost, the charges spent here also depend
                  on the fields travelling beside the tx, so the digest covers all of them:
                  blake2b256(LP(tx) | LP(energy) | LP(bandwidth) | LP(instant_fee_tx)), where every
                  field is its exact request value and an omitted one is the empty string. energy
                  and bandwidth are their decimal representations.
                  Recoverable secp256k1 signature over blake2b-256 of that message: 65 bytes laid
                  out R | S | V in the EVM ordering, 130 hex. The key is not sent — it is recovered
                  from the signature, and the wallet_id derived from it has to equal the one the
                  request came with. Requires a format 2 wallet_id.
                type: string
                minLength: 130
                maxLength: 130
                pattern: '^[a-f0-9]{130}$'
    Boc:
      description: bag-of-cells serialized to base64
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - boc
            properties:
              boc:
                type: string
                example: te6ccgECBQEAARUAAkWIAWTtae+KgtbrX26Bep8JSq8lFLfGOoyGR/xwdjfvpvEaHg

    BocWithProof:
      description: bag-of-cells serialized to base64, with a proof of the wallet's consent
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - boc
            properties:
              boc:
                type: string
                example: te6ccgECBQEAARUAAkWIAWTtae+KgtbrX26Bep8JSq8lFLfGOoyGR/xwdjfvpvEaHg
              proof:
                description: >-
                  Signature made with the wallet's root key over
                  LP("keeper.battery.send.v1") | LP(wallet_id) | LP(chain) | LP(blake2b256(boc)),
                  hex-encoded. LP(x) is a single length byte followed by x, applied to every field
                  including the digest. chain is "ton" for this endpoint. The digest covers the boc
                  as sent, before it is decoded.
                  Recoverable secp256k1 signature over blake2b-256 of that message: 65 bytes laid
                  out R | S | V in the EVM ordering, 130 hex. The key is not sent — it is recovered
                  from the signature, and the wallet_id derived from it has to equal the one the
                  request came with. Requires a format 2 wallet_id.
                type: string
                minLength: 130
                maxLength: 130
                pattern: '^[a-f0-9]{130}$'
                example: "3a7f1c9e00000000000000000000000000000000000000000000000000000000d204a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"


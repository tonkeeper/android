        - $ref: '#/components/parameters/adminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - amount
              properties:
                chain:
                  type: string
                  description: EVM chain of the relay to top up
                  example: bsc
                amount:
                  type: string
                  description: Amount in TON (not nano) to swap
                confirm:
                  type: boolean
                  description: Create the swap and send the TON; otherwise only quote
                  default: false
                currency:
                  type: string
                  description: Changelly ticker to receive, overriding the chain's default (eth, bnbbsc, etharb, ethbase)
      responses:
        '200':
          description: "the quote, or the created swap"
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /restricted/solana-relay-topup:
    post:
      operationId: solanaRelayTopup
      description: |
        Swaps TON from the main relayer into SOL through Changelly, paid out to one of the battery's
        Solana wallets: the relay, the fee payer of gasless transactions (the default), the purchases
        wallet, or the fee wallet. Without confirm it only quotes; with confirm it creates the swap and
        sends the TON. The relayer keeps at least 2000 TON.
      parameters:
        - $ref: '#/components/parameters/adminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: Amount in TON (not nano) to swap
                confirm:
                  type: boolean
                  description: Create the swap and send the TON; otherwise only quote
                  default: false
                currency:
                  type: string
                  description: Changelly ticker to receive, overriding sol
                to:
                  type: string
                  description: >-
                    the wallet paid: relay (SOLANA_RELAY_PRIVATE_KEY's), purchases
                    (SOLANA_PURCHASES_WALLET_ADDRESS) or fee (SOLANA_FEE_RECIPIENT); only these, so the
                    admin token cannot send the relayer's TON anywhere else
                  enum: [ relay, purchases, fee ]
                  default: relay
      responses:
        '200':
          description: "the quote, or the created swap"
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /restricted/evm-fee-wallet-topup:
    post:
      operationId: evmFeeWalletTopup
      description: |
        Sends the native coin of an EVM chain from the relay wallet to one of our wallets that pays
        gas of its own: the fee wallet (EVM_FEE_RECIPIENT), for the daily settlement's swaps and
        transfers, or the purchases wallet (EVM_PURCHASES_WALLET_ADDRESS), for refunds and the
        purchases settlement. Without confirm it only shows both balances; with confirm it sends.
      parameters:
        - $ref: '#/components/parameters/adminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - amount
              properties:
                chain:
                  type: string
                  description: EVM chain key
                  example: eth
                amount:
                  type: string
                  description: Amount of the chain's native coin, in whole units (ETH, not wei)
                  example: "0.003"
                wallet:
                  type: string
                  enum: [ fee, purchases ]
                  default: fee
                  description: The wallet to top up
                confirm:
                  type: boolean
                  description: Send; otherwise only show the balances
                  default: false
      responses:
        '200':
          description: "the balances, and the transaction when sent"
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'

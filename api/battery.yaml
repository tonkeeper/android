        off what the purchase adds: `charges` is what the balance grows by. Send the signed operation
        to /purchase-battery/solana before `expires_at`: the transaction carries a recent blockhash and
        lapses with it, in about a minute.
      operationId: solanaBatteryPurchaseEmulate
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'

              properties:
                token:
                  type: string
                  description: USDT, USDC or SOL
                  example: USDC
                amount:
                  type: string
                  description: in whole units of the token
                  example: "10"
                from:
                  type: string
                  description: the Solana account the payment is sent from, base58
                promo:
                  type: string
      responses:
        '200':
          description: the purchase to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaBatteryPurchaseQuote'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/solana:
    post:
      deprecated: true
      summary: superseded by /gasless/send, which takes the operation of /purchase-battery/emulate
      description: |
        Charge the battery on Solana: send the operation from /purchase-battery/solana/emulate signed,
        its payload as "prebuild/signed" with `meta.data` the transaction with the user's signature in
        its slot, base64. The relay adds its own and broadcasts it, and the balance grows once the

            schema:
              type: object
              required: [ chain, token, amount, from ]
              properties:
                chain:
                  type: string
                  description: EVM chain key
                  example: base
                token:
                  type: string
                  description: USDT or USDC
                  example: USDC
                amount:
                  type: string
                  description: in whole tokens
                  example: "10"
                from:
                  type: string
                  description: the EVM account the tokens are sent from
                promo:
                  type: string

        Takes the public key off a wallet-id user, so the public-key user of the same wallet can be
        merged into it (the merge refuses a wallet-id user holding another key). A one-off: only the
        users in clearPublicKeyUsers are accepted. The key it held is returned, to put it back by hand.
      parameters:

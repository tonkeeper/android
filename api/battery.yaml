      description: >-
        Merges the users of one address: the public-key user with TON purchases for it goes into the
        wallet-id user with TON purchases for it created last, as /restricted/users/{user_id}/merge
        does, with the same checks. Refused when the address has no such pair, or more than one
        public-key user. dry_run checks and reports without changing anything.
      parameters:
        - $ref: '#/components/parameters/adminToken'

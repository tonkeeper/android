                type: string
              min_bootstrap_value:
                type: string
                example: "10.0"
              type:
                type: string
                enum:
                  - jetton
                  - ton
              rate:
                type: string
                example: "10.250"
              symbol:
                type: string
                example: "usdt"
              decimals:
                type: integer
                example: 6
              support_gasless:
                type: boolean
                example: true
              support_recharge:
                type: boolean
                example: true
    Purchases:
      type: object
      required:
        - purchases
        - total_purchases
      properties:
        total_purchases:
          type: integer
          example: 1
        purchases:
          type: array
          items:
            type: object
            required:
              - user_purchase_id
              - purchase_id
              - type
              - charges
              - datetime
            properties:
              promo:
                type: string
              for_account_id:
                type: string
              user_purchase_id:
                type: integer
                deprecated: true
                example: 2
              purchase_id:
                type: integer
                example: 2
              type:
                type: string
                example: "android"
                enum:
                  - android
                  - ios
                  - promo-code
                  - crypto
                  - gift
                  - on-the-way-gift
              amount:
                description: "Amount describes the amount paid by the user for this purchase when we know it. For crypto purchases it is always set."
                type: string
                example: "10.250"
              charges:
                type: integer
                example: 1200
              currency:
                description: "Currency is set when we know it. For crypto purchases it is always set."
                type: string
                example: "USDT"
              datetime:
                type: string
                example: "2006-01-02T15:04:05Z07:00"
              refund_information:
                type: object
                required:
                  - pending_refund
                  - fully_refunded
                  - partially_refunded
                properties:
                  fully_refunded:
                    type: boolean
                  partially_refunded:
                    type: boolean
                  pending_refund:
                    type: boolean
                  refunded:
                    type: object
                    required:
                      - amount
                      - charges
                    properties:
                      amount:
                        type: string
                        example: "10.250"
                      charges:
                        type: integer
                        example: 1200
                  refundable:
                    type: object
                    required:
                      - amount
                      - charges
                    properties:
                      amount:
                        type: string
                        example: "10.250"
                      charges:
                        type: integer
                        example: 1200
    Chain:
      type: string
      enum: [ ton, tron, eth ]
      description: >-
        Which chain an operation runs on, and which shape the body around it takes. "eth" covers
        the EVM family; the particular network is named by evm_chain inside the body.

    EstimateRequest:
      oneOf:
        - $ref: '#/components/schemas/TonEstimateRequest'
        - $ref: '#/components/schemas/TronEstimateRequest'
        - $ref: '#/components/schemas/EvmEstimateRequest'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonEstimateRequest'
          tron: '#/components/schemas/TronEstimateRequest'
          eth: '#/components/schemas/EvmEstimateRequest'

    SendRequest:
      oneOf:
        - $ref: '#/components/schemas/TonSendRequest'
        - $ref: '#/components/schemas/TronSendRequest'
        - $ref: '#/components/schemas/EvmSendRequest'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonSendRequest'
          tron: '#/components/schemas/TronSendRequest'
          eth: '#/components/schemas/EvmSendRequest'

    # Gasless 2.0 (docs/generic payload). Payload and signed-payload "meta" depend on chain_id and
    # type, so they are free-form objects here and checked in code.
    GaslessV2Fee:
      type: object
      required: [ type, asset_id, data ]
      properties:
        type:
          type: string
          enum: [ value ]
        asset_id:
          type: string
          example: battery/mainnet
        data:
          type: object
          required: [ amount ]
          properties:
            amount:
              type: string
              description: In the asset's smallest units; charges for "battery/mainnet".

    GaslessV2Payload:
      type: object
      required: [ id, type, chain_id, version, meta ]
      properties:
        id:
          type: string
        type:
          type: string
          description: main | prebuild | batch | eip7702/authorization | eip7821/hermes/delegate | solana/message
        chain_id:
          type: string
          example: ton/mainnet
        version:
          type: integer
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        meta:
          type: object
          additionalProperties: true

    GaslessV2Operation:
      x-operation: true
      type: object
      required: [ id, type, payloads ]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: transfer | swap | call | message | auth | stake | unstake
        payloads:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2SignedPayload:
      type: object
      required: [ type, chain_id, payload_id, meta ]
      properties:
        type:
          type: string
          description: signed | eip7702/authorization/signed | eip7821/hermes/delegate/signed (eip7821/hermes/1/signed is accepted too) | solana/message/signed
        chain_id:
          type: string
        payload_id:
          type: string
        meta:
          type: object
          additionalProperties: true

    GaslessV2SignedOperation:
      type: object
      required: [ id, payloads ]
      properties:
        id:
          type: string
          format: uuid
        payloads:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2SignedPayload'

    GaslessV2Asset:
      type: object
      required: [ id, name, symbol, decimals ]
      properties:
        id:
          type: string
          example: ton/mainnet/jetton/0:b113a994b5024a16719f69139328eb759596c38a25f59028b146fecdc3621dfe
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        image:
          type: string
        chain:
          type: string
          nullable: true
          description: null for battery, which is not chain-scoped

    GaslessV2ErrorBody:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          description: >-
            unsupported_chain | unsupported_asset | unsupported_payload | insufficient_funds |
            emulation_failed | emulation_expired | payload_mismatch | invalid_signature |
            broadcast_failed | operation_not_found | already_sent | bad_request | unauthorized |
            not_implemented | internal_error
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    GaslessV2Chain:
      type: object
      required: [ chain_id, payload_types, assets ]
      properties:
        chain_id:
          type: string
        payload_types:
          type: array
          items:
            type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Asset'

    GaslessV2Config:
      type: object
      required: [ chains ]
      properties:
        chains:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Chain'

    GaslessV2Estimation:
      type: object
      required: [ asset, available ]
      properties:
        asset:
          $ref: '#/components/schemas/GaslessV2Asset'
        available:
          type: boolean
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        error:
          $ref: '#/components/schemas/GaslessV2ErrorBody'

    GaslessV2EstimateRequest:
      type: object
      required: [ chain_id, sender_address, payload ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        payload:
          $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2EstimateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, expires_at, estimations ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        estimations:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Estimation'

    GaslessV2EmulateRequest:
      type: object
      required: [ chain_id, sender_address, type, gasless_asset, payloads ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        type:
          type: string
          description: The operation type, echoed back in operation.type.
        gasless_asset:
          type: string
          example: battery/mainnet
        payloads:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2EmulateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, expires_at, asset_id, fee, operation ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        asset_id:
          type: string
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        account:
          $ref: '#/components/schemas/EvmAccountState'
        gas:
          $ref: '#/components/schemas/EvmGas'
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'

    GaslessV2SendRequest:
      type: object
      required: [ operation ]
      properties:
        operation:
          $ref: '#/components/schemas/GaslessV2SignedOperation'

    GaslessV2SendResponse:
      type: object
      required: [ operation_id, status ]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ ok, failed ]
        tx_hash:
          type: string
          description: |
            The transaction that was sent. EVM: the transaction hash, 0x-prefixed. TON: the
            normalized hash of the external message, hex.

    TonPurchaseReassignment:
      type: object
      required: [ purchase_id, target_account_id, from_user_id, to_user_id, balance_increase, from_balance, to_balance, dry_run ]
      properties:
        purchase_id:
          type: integer
          format: int64
        target_account_id:
          type: string
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        balance_increase:
          type: string
          description: What the purchase added, in the units of the balance.
        from_balance:
          type: string
          description: The public-key user's balance after the move.
        to_balance:
          type: string
          description: The wallet-id user's balance after the move.
        dry_run:
          type: boolean

    # The variants below leave `chain` out of their own properties on purpose. ogen writes the
    # discriminator itself before a variant's fields, so a variant that also declares it put the key
    # in the response twice: {"chain":"eth","chain":"eth",...}.
    EstimateResponse:
      oneOf:
        - $ref: '#/components/schemas/TonEstimateResponse'
        - $ref: '#/components/schemas/TronEstimateResponse'
        - $ref: '#/components/schemas/EvmEstimateResponse'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonEstimateResponse'
          tron: '#/components/schemas/TronEstimateResponse'
          eth: '#/components/schemas/EvmEstimateResponse'

    # The variants below leave `chain` out of their own properties on purpose. ogen writes the
    # discriminator itself before a variant's fields, so a variant that also declares it put the key
    # in the response twice: {"chain":"eth","chain":"eth",...}.
    SendResponse:
      oneOf:
        - $ref: '#/components/schemas/TonSendResponse'
        - $ref: '#/components/schemas/TronSendResponse'
        - $ref: '#/components/schemas/EvmSendResponse'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonSendResponse'
          tron: '#/components/schemas/TronSendResponse'
          eth: '#/components/schemas/EvmSendResponse'

    TonEstimateRequest:
      type: object
      required: [ chain, boc ]
      properties:
        chain:
          type: string
          enum: [ ton ]
        boc:
          type: string
          description: bag-of-cells serialized to base64
          example: te6ccgECBQEAARUAAkWIAWTtae+KgtbrX26Bep8JSq8lFLfGOoyGR/xwdjfvpvEaHg
        enable_validation:
          type: boolean
          default: false
          description: Refuse the estimate when the balance would not cover it.

    TonEstimateResponse:
      type: object
      required: [ allowed_by_battery, supported_by_battery, excess ]
      properties:
        allowed_by_battery:
          type: boolean
        supported_by_battery:
          type: boolean
        reject_reason:
          type: string
        excess:
          type: integer
          format: int64
        protocol_name:
          type: string
        emulation:
          type: object
          additionalProperties: true
          description: The emulated event, as /wallet/emulate returns it.

    TonSendRequest:
      type: object
      required: [ chain, boc ]
      properties:
        chain:
          type: string
          enum: [ ton ]
        boc:
          type: string
          description: bag-of-cells serialized to base64
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            The wallet's consent to spend charges, exactly as on /message: a recoverable secp256k1
            signature over LP("keeper.battery.send.v1") | LP(wallet_id) | LP(chain) |
            LP(blake2b256(boc)).

    TonSendResponse:
      type: object
      properties:
        protocol_name:
          type: string

    TronEstimateRequest:
      type: object
      required: [ chain, wallet ]
      properties:
        chain:
          type: string
          enum: [ tron ]
        wallet:
          type: string
        energy:
          type: integer
          minimum: 0
          maximum: 1000000
        bandwidth:
          type: integer
          minimum: 0
          maximum: 2000
        enable_validation:
          type: boolean
          default: false
          description: Enable balance validation for battery charges

    TronEstimateResponse:
      type: object
      required: [ estimate ]
      properties:
        estimate:
          $ref: '#/components/schemas/EstimatedTronTx'

    TronSendRequest:
      type: object
      required: [ chain, wallet ]
      properties:
        chain:
          type: string
          enum: [ tron ]
        wallet:
          type: string
        tx:
          type: string
        energy:
          type: integer
          minimum: 0
          maximum: 1000000
        bandwidth:
          type: integer
          minimum: 0
          maximum: 2000
        instant_fee_tx:
          type: string
          description: base64 encoded payment transaction in the TON network
        user_public_key:
          type: string
          description: >-
            User public key for commission payments, required when instant_fee_tx is provided.
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            Not enforced yet. The wallet's consent to spend charges, exactly as on /v0/tron/send:
            a recoverable secp256k1 signature over LP("keeper.battery.send.v1") | LP(wallet_id) |
            LP(chain) | LP(blake2b256(LP(tx) | LP(energy) | LP(bandwidth) | LP(instant_fee_tx))),
            with chain "tron". The digest covers the cost-bearing fields, not just the tx.

    TronSendResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string

    EvmChain:
      type: string
      enum: [ eth, bsc, arb, base, sepolia, local ]
      description: >-
        Which EVM network the operation runs on. "sepolia" and "local" are test networks — the
        public Ethereum testnet and a hardhat dev chain — and exist so the flow can be exercised end
        to end without spending real gas. A deployment only serves the networks named in EVM_CHAINS,
        and production names neither.

    EvmCall:
      type: object
      description: One call the user wants executed.
      required: [ to ]
      properties:
        to:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        value:
          type: string
          description: Wei, decimal or 0x-hex; defaults to 0.
        data:
          type: string
          pattern: '^0x([0-9a-fA-F]{2})*$'
          description: Calldata; defaults to 0x.

    EvmEstimateRequest:
      type: object
      description: >-
        Quote an EVM operation. The answer carries the batch(es) to sign and a uuid to echo back to
        /send. Quotes are short-lived: expires_at is when the signature deadline runs out.
      required: [ chain, evm_chain, type, from, payloads ]
      properties:
        chain:
          type: string
          enum: [ eth ]
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        type:
          type: string
          enum: [ battery, gasless ]
          description: >-
            battery pays the gas from the user's charges; gasless takes an ERC20 fee named by asset.
        path:
          type: string
          enum: [ direct, delegate ]
          default: direct
          description: gasless delivery mechanism; ignored for battery.
        asset:
          type: string
          description: >-
            gasless only, "<chain>/<network>/erc20/<tokenAddress>"; must be an accepted fee token.
          example: eth/mainnet/erc20/0xdAC17F958D2ee523a2206206994597C13D831ec7
        from:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: The delegated EOA the batch runs on.
        payloads:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvmCall'

    EvmEstimateResponse:
      type: object
      required: [ evm_chain, uuid, expires_at, type, account, gas, sign ]
      properties:
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        uuid:
          type: string
          format: uuid
          description: Echo this to /send together with the signed artifacts.
        expires_at:
          type: integer
          format: int64
          description: Unix seconds. Past this the quote is refused and has to be asked for again.
        type:
          type: string
          enum: [ battery, gasless ]
        path:
          type: string
          enum: [ direct, delegate ]
          description: gasless only.
        charges:
          type: integer
          format: int64
          description: >-
            battery only: what /send will debit. Absent for gasless, which is paid on-chain in the
            fee token and moves no charges.
        fee:
          $ref: '#/components/schemas/EvmFee'
        fee_options:
          type: array
          description: >-
            gasless only: every accepted fee token priced for this operation, from the same
            emulation, so a client can offer the choice without asking again.
          items:
            $ref: '#/components/schemas/EvmFee'
        account:
          $ref: '#/components/schemas/EvmAccountState'
        gas:
          $ref: '#/components/schemas/EvmGas'
        sign:
          type: object
          description: >-
            What the wallet has to sign, keyed by role. battery and gasless-delegate quote a "user"
            batch, gasless-delegate also a "fee" one, gasless-direct a single "combined" batch. Send
            back exactly the roles named here.
          additionalProperties:
            $ref: '#/components/schemas/EvmSignable'

    EvmSignable:
      type: object
      required: [ typed_data, digest ]
      properties:
        typed_data:
          type: object
          additionalProperties: true
          description: EIP-712 typed data to sign, echoed back to /send unchanged.
        digest:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          description: The EIP-712 digest of typed_data, for clients that prefer to check it.

    EvmFee:
      type: object
      required: [ asset, amount, amount_formatted, symbol, decimals ]
      properties:
        asset:
          type: string
          description: '"<chain>/<network>/erc20/<tokenAddress>", the form /estimate accepts back.'
          example: eth/mainnet/erc20/0xdAC17F958D2ee523a2206206994597C13D831ec7
        amount:
          type: string
          description: Base units, decimal.
        amount_formatted:
          type: string
          description: Human-readable amount, decimals applied.
        symbol:
          type: string
        decimals:
          type: integer

    EvmAccountState:
      type: object
      required: [ address, delegated, requires_authorization ]
      properties:
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        delegated:
          type: boolean
          description: Whether the account already delegates to the relay's Hermes implementation.
        delegated_to:
          type: string
          description: The implementation it currently delegates to, if any.
        requires_authorization:
          type: boolean
          description: >-
            When true, /send needs a signed EIP-7702 authorization alongside the batch. Sign the
            template in authorization.
        authorization:
          $ref: '#/components/schemas/EvmAuthorizationTemplate'

    EvmAuthorizationTemplate:
      type: object
      description: The EIP-7702 authorization to sign when the account is not delegated yet.
      required: [ chain_id, address, nonce ]
      properties:
        chain_id:
          type: integer
          format: int64
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        nonce:
          type: integer
          format: int64

    EvmGas:
      type: object
      required: [ estimated, charged, gas_price_wei ]
      properties:
        estimated:
          type: string
          description: Gas the emulation measured.
        charged:
          type: string
          description: Gas the quote is priced on, the estimate plus the fee buffer.
        authorization_gas:
          type: string
          description: Extra gas for the EIP-7702 authorization, when one is needed.
        gas_price_wei:
          type: string
        source:
          type: string
          enum: [ estimateGas, gasMeter, heuristic ]
          description: >-
            Where the gas figure came from. "estimateGas" is the node pricing the whole transaction
            and "gasMeter" is a measurement inside eth_call — both are real. "heuristic" is a
            constant: the emulation could not be run, so the number is a guess and the quote should
            be treated as indicative rather than binding.
        gas_price_source:
          type: string
          enum: [ chain, config ]
          description: >-
            "config" means the node could not be reached and the quote fell back to a constant.
        fee_native_wei:
          type: string
          description: charged gas at the quoted price, in wei.

    EvmSendRequest:
      type: object
      description: >-
        Echoes the signed artifacts matching the quote's path: gasless direct sends combined,
        gasless delegate sends fee and user, battery sends user.
      required: [ chain, uuid ]
      properties:
        chain:
          type: string
          enum: [ eth ]
        uuid:
          type: string
          format: uuid
          description: Identifies the quote returned by /estimate.
        combined:
          $ref: '#/components/schemas/EvmSignedBatch'
        fee:
          $ref: '#/components/schemas/EvmSignedBatch'
        user:
          $ref: '#/components/schemas/EvmSignedBatch'
        authorization:
          $ref: '#/components/schemas/EvmSignedAuthorization'
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            Not enforced until clients have shipped it: when present it is verified, when absent the
            send proceeds. The wallet's consent to spend charges, in the same shape as on the other chains: a
            recoverable secp256k1 signature over LP("keeper.battery.send.v1") | LP(wallet_id) |
            LP(chain) | LP(blake2b256(uuid)), hex-encoded, 65 bytes laid out R | S | V.
            chain here is "eth:<evm_chain>", not the bare "eth" of the chain field — the network
            has to be inside the signature, or a proof made for one EVM network replays on another.
            The digest is over the quote uuid alone: the quote already pins the cost and the calls,
            so consenting to the uuid is consenting to what it priced. Requires a format 2
            wallet_id.

    EvmSignedBatch:
      type: object
      description: An echoed artifact plus its signature.
      required: [ typed_data, signature ]
      properties:
        typed_data:
          type: object
          additionalProperties: true
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: 65-byte ECDSA signature of the artifact's EIP-712 digest by the user.

    EvmSignedAuthorization:
      type: object
      description: Signed EIP-7702 authorization.
      required: [ chain_id, address, nonce, y_parity, r, s ]
      properties:
        chain_id:
          type: string
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        nonce:
          type: string
        y_parity:
          type: integer
          enum: [ 0, 1 ]
        r:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        s:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'

    EvmSendResponse:
      type: object
      required: [ evm_chain, tx_hash, mode ]
      properties:
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        tx_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        mode:
          type: string
          enum: [ direct, proxy ]
          description: >-
            direct = a call straight to the user's account; proxy = the relay self-call used by
            gasless delegate.
        authorization_included:
          type: boolean
          description: True when the transaction carried the EIP-7702 authorization.
        charged:
          type: boolean
          description: >-
            Whether the ledger recorded the send. False with a tx_hash present means the transaction
            is on chain but its ledger row could not be written: a reconciliation problem, and not a
            reason to send again.
        charges:
          type: integer
          format: int64
          description: battery only, charges debited.

    EstimatedTronTx:
      type: object
      required:
        - energy_charges
        - bandwidth_charges
        - activation_charges
        - total_charges
        - instant_fee
      properties:
        energy_charges:
          type: integer
        bandwidth_charges:
          type: integer
        activation_charges:
          type: integer
        total_charges:
          type: integer
        instant_fee:
          type: object
          required:
            - fee_address
            - accepted_assets
          properties:
            fee_address:
              type: string
            accepted_assets:
              type: array
              items:
                type: object
                required:
                  - type
                  - amount_nano
                  - name
                  - decimals
                properties:
                  type:
                    type: string
                    enum:
                      - jetton
                      - ton
                  name:
                    type: string
                  jetton_master_id:
                    type: string
                  amount_nano:
                    type: string
                    example: "10.250"
                  decimals:
                    type: integer
    SentTronTx:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    TronTransactionsList:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            type: object
            required:
              - txid
              - timestamp
              - from_account
              - to_account
              - amount
              - is_pending
              - is_failed
              - battery_charges
            properties:
              txid:
                type: string
              from_account:
                type: string
              to_account:
                type: string
              amount:
                type: string
              is_pending:
                type: boolean
              is_failed:
                type: boolean
              battery_charges:
                type: integer
              timestamp:
                type: integer
                format: int64
              trongrid_result:
                type: integer
              fee_type:
                type: string
                description: Type of fee used for this transaction (battery, ton, etc.)
              fee_ton_nano:
                type: integer
                description: Fee amount in TON nano units
              is_free_pro:
                type: boolean
                description: Whether this transaction was made using free pro transfers
    TronAvailableTransfers:
      type: object
      required:
        - available_transfers
        - type
      properties:
        available_transfers:
          type: integer
          description: Number of available free TRON transfers
          example: 3
        type:
          type: string
          description: Availability type. 'inactive' if source is telegram.
          example: inactive
        next_reset_date:
          type: integer
          format: int64
          description: Unix timestamp of next free transfers reset date (either next month after last reset or next charge date, whichever is closer)
          example: 1678275313
    AndroidBatteryPurchaseStatus:
      type: object
      required:
        - purchases
      properties:
        purchases:
          type: array
          items:
            type: object
            required:
              - product_id
              - token
              - success
            properties:
              product_id:
                type: string
                example: "1000000790000000"
              token:
                type: string
                example: "1000000790000000"
              success:
                type: boolean
                example: true
              error:
                type: object
                required:
                  - msg
                  - code
                properties:
                  msg:
                    type: string
                    example: "Temporary error. Try again later."
                  code:
                    type: string
                    example: "invalid-product-id"
                    enum:
                      - invalid-product-id
                      - user-not-found
                      - purchase-is-already-used
                      - temporary-error
                      - unknown

    appStoreResponse:
      type: object
    iOSBatteryPurchaseStatus:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            type: object
            required:
              - transaction_id
              - success
            properties:
              transaction_id:
                type: string
                example: "1000000790000000"
              success:
                type: boolean
                example: true
              error:
                type: object
                required:
                  - msg
                  - code
                properties:
                  msg:
                    type: string
                    example: "Temporary error. Try again later."
                  code:
                    type: string
                    example: "invalid-bundle-id"
                    enum:
                      - invalid-bundle-id
                      - invalid-product-id
                      - user-not-found
                      - purchase-is-already-used
                      - temporary-error
                      - unknown
    promoCodeBatteryPurchaseStatus:
      type: object
      required:
        - success
        - balance_change
      properties:
        balance_change:
          type: string
          example: "10.250"
        success:
          type: boolean
          example: true
        error:
          type: object
          required:
            - msg
            - code
          properties:
            msg:
              type: string
              example: "Temporary error. Try again later."
            code:
              type: string
              example: "promo-code-not-found"
              enum:
                - promo-code-not-found
                - promo-exceeded-attempts
                - temporary-error
    Transactions:
      type: object
      required:
        - transactions
        - total_transactions
      properties:
        total_transactions:
          type: integer
          example: 1
        next_offset:
          type: integer
          description: if set, then there are more transactions to be loaded. Use this value as offset parameter in the next request.
          example: 10
        transactions:
          type: array
          items:
            type: object
            required:
              - id
              - paid_amount
              - status
              - created_at
            properties:
              id:
                type: string
              paid_amount:
                type: string
                description: represents the amount of money paid by the user for this transaction.
                example: "10.250"
              status:
                type: string
                example: "10.250"
                enum:
                  - pending
                  - completed
                  - failed
              created_at:
                type: string
                example: "2006-01-02T15:04:05Z07:00"
  responses:
    GaslessV2Error:
      description: >-
        An error in the gasless 2.0 format. Declared under 4XX only, but server-side failures (5xx)
        come in the same shape: ogen 1.1 cannot map one response to both ranges.
      content:
        application/json:
          schema:
            type: object
            required: [ error ]
            properties:
              error:
                $ref: '#/components/schemas/GaslessV2ErrorBody'
    Error:
      description: Some error during request processing
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
              error-key:
                type: string
              error-details:
                type: string

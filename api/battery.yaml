          description: The asset, as in /gasless/battery/config.
          example: eth/mainnet/erc20/0xdac17f958d2ee523a2206206994597c13d831ec7
        fee_asset_id:
          type: string
          description: The native coin the fee is paid in.
          example: eth/mainnet/coin
        fee_decimals:
          type: integer
          description: Decimals of the native coin.
          example: 18
        swap:
          $ref: '#/components/schemas/NetworkFeeAmounts'
        perps:
          $ref: '#/components/schemas/NetworkFeeAmounts'
    NetworkFeeAmounts:
      type: object
      description: Amounts of the native coin, in its smallest units.

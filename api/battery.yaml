openapi: 3.0.2
info:
  title: Custodial-Battery REST API.
  version: 0.0.1
  description: REST API for Custodial Battery which provides gas to different networks to help execute transactions.
  contact:
    name: Support
    email: support@tonkeeper.com
servers:
  - url: "https://battery.tonkeeper.com"
  - url: "https://testnet-battery.tonkeeper.com"
paths:
  /tonconnect/payload:
    get:
      description: Get a payload for further token receipt
      operationId: getTonConnectPayload
      tags:
        - Connect
      responses:
        '200':
          description: payload
          content:
            application/json:
              schema:
                type: object
                required:
                  - payload
                properties:
                  payload:
                    type: string
                    example: "84jHVNLQmZsAAAAAZB0Zryi2wqVJI-KaKNXOvCijEi46YyYzkaSHyJrMPBMOkVZa"
        'default':
          $ref: '#/components/responses/Error'
  /tonconnect/proof:
    post:
      description: Account verification and token issuance
      operationId: tonConnectProof
      tags:
        - Wallet
      requestBody:
        $ref: "#/components/requestBodies/TonConnectProof"
      responses:
        '200':
          description: auth token
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    example: "NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3..."
        'default':
          $ref: '#/components/responses/Error'
  /status:
    get:
      description: This method returns information about the current status of Battery Service.
      operationId: getStatus
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/battery/config:
    get:
      description: >-
        What the gasless 2.0 flow serves: the chains, the payload types each of them accepts, and
        the assets that can pay the relayer there. "battery/mainnet" is the user's charges ("battery" is accepted too).
      operationId: gaslessBatteryConfig
      tags:
        - Gasless
      responses:
        '200':
          description: The chains and assets served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2Config'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/estimate:
    post:
      description: >-
        Prices one payload in every asset that can pay the relayer on its chain, and says which of
        them the sender can afford.
      operationId: gaslessEstimate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2EstimateRequest'
      responses:
        '200':
          description: One estimation per asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2EstimateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/emulate:
    post:
      description: >-
        Builds the operation to sign from unsigned payloads and the asset chosen to pay the relayer,
        and emulates it. The operation is kept until expires_at and /gasless/send checks the
        signatures against it.
      operationId: gaslessEmulate
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2EmulateRequest'
      responses:
        '200':
          description: The operation to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2EmulateResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/send:
    post:
      description: >-
        Takes the signed payloads of an emulated operation, checks them against it one to one, and
        broadcasts.
      operationId: gaslessSend
      tags:
        - Gasless
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessV2SendRequest'
      responses:
        '200':
          description: The operation was broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessV2SendResponse'
        '4XX':
          $ref: '#/components/responses/GaslessV2Error'
        'default':
          $ref: '#/components/responses/Error'
  /config:
    get:
      description: This method returns information about Battery Service.
      operationId: getConfig
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        'default':
          $ref: '#/components/responses/Error'
  /promo-used:
    get:
      operationId: getPromoUsed
      parameters:
        - name: promo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoUsed'
        'default':
          $ref: '#/components/responses/Error'
  /battery-charged:
    get:
      description: This method returns information about a user's balance.
      operationId: getBatteryCharged
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryCharged'
        'default':
          $ref: '#/components/responses/Error'
  /balance:
    get:
      description: This method returns information about a user's balance.
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/balanceUnits'
        - $ref: '#/components/parameters/region'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        'default':
          $ref: '#/components/responses/Error'
  /wallet/emulate:
    post:
      description: Emulate sending message to blockchain
      operationId: emulateMessageToWallet
      tags:
        - Emulation
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: enable_validation
          in: query
          schema:
            type: boolean
            default: false
          required: false
      requestBody:
        $ref: "#/components/requestBodies/Boc"
      responses:
        '200':
          description: emulated message
          headers:
            Allowed-By-Battery:
              required: true
              schema:
                type: boolean
                example: "true"
            Supported-By-Battery:
              required: true
              schema:
                type: boolean
                example: "true"
            Reject-Reason:
              schema:
                type: string
                example: "message is too large"
            X-Battery-Protocol-Name:
              schema:
                type: string
            Excess:
              required: true
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /message:
    post:
      description: Send message to blockchain
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/promo'
      requestBody:
        $ref: "#/components/requestBodies/BocWithProof"
      responses:
        '200':
          description: "success"
          headers:
            X-Battery-Protocol-Name:
              schema:
                type: string
        'default':
          $ref: '#/components/responses/Error'
  /estimate:
    post:
      description: >-
        Estimate what an operation will cost, on any chain. The request body is picked by its
        "chain" field, and each chain takes the values its own estimator needs.
      operationId: estimate
      tags:
        - Multichain
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: The estimate, shaped by the chain it was asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        'default':
          $ref: '#/components/responses/Error'
  /send:
    post:
      description: >-
        Send an operation, on any chain. The request body is picked by its "chain" field, and each
        chain takes the values its own relayer needs.
      operationId: send
      tags:
        - Multichain
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - $ref: '#/components/parameters/promo'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '200':
          description: The result, shaped by the chain it was sent on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/config:
    get:
      operationId: getTronConfig
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                type: object
                required:
                  - safety_margin_percent
                properties:
                  safety_margin_percent:
                    type: string
                    example: "1.5"
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/estimate:
    get:
      description: Estimate cost of sending a tx in Tron network
      operationId: tronEstimate
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
        - name: energy
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000000
            minimum: 0
        - name: bandwidth
          in: query
          required: false
          schema:
            type: integer
            maximum: 2000
            minimum: 0
        - name: wallet
          in: query
          required: true
          schema:
            type: string
        - name: enable_validation
          in: query
          required: false
          description: Enable balance validation for battery charges
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimatedTronTx'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/send:
    post:
      description: send TRON tx
      operationId: tronSend
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/optionalEnterpriseAccessToken'
        - name: X-Pro-Auth
          in: header
          required: false
          schema:
            type: string
          description: JWT token from Pro service for free charges verification
        - name: user_public_key
          in: query
          required: false
          description: User public key for commission payments (required when instant_fee_tx is provided)
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/TronTx"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentTronTx'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/transactions:
    get:
      operationId: getTronTransactions
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/maxTimestamp'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TronTransactionsList'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/available-transfers:
    get:
      description: Get number of available TRON free transfers for Pro users
      operationId: getTronAvailableTransfers
      parameters:
        - name: X-Pro-Auth
          in: header
          required: true
          schema:
            type: string
          description: JWT token from Pro service (Bearer token)
      responses:
        '200':
          description: Available transfers information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TronAvailableTransfers'
        'default':
          $ref: '#/components/responses/Error'
  /v0/tron/itrx-io-callback:
    post:
      description: receive callback from itrx.io
      operationId: itrxIoCallback
      parameters:
        - $ref: '#/components/parameters/itrxSignature'
        - $ref: '#/components/parameters/itrxTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                additionalProperties: true
                example: { }
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/android:
    post:
      description: verify an in-app purchase
      operationId: androidBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/AndroidBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AndroidBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/ios/app-store-notification:
    post:
      operationId: appStoreNotification
      requestBody:
        $ref: "#/components/requestBodies/appStoreNotification"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appStoreResponse'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/ios:
    post:
      description: verify an in-app purchase
      operationId: iosBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/iOSBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iOSBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/promo-code:
    post:
      description: charge battery with promo code
      operationId: promoCodeBatteryPurchase
      parameters:
        - $ref: '#/components/parameters/i18n'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/promoCodeBatteryPurchase"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promoCodeBatteryPurchaseStatus'
        'default':
          $ref: '#/components/responses/Error'
  /purchase-battery/verify-purchase-promo:
    get:
      operationId: verifyPurchasePromo
      parameters:
        - name: promo
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: "all good"
          content:
            application/json:
              schema:
                type: object
                required:
                  - bonus_charges
                properties:
                  bonus_charges:
                    type: string
                    example: "10.250"
        'default':
          $ref: '#/components/responses/Error'
  /recharge-methods:
    get:
      description: This method returns on-chain recharge methods.
      operationId: getRechargeMethods
      parameters:
        - name: include_recharge_only
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeMethods'
        'default':
          $ref: '#/components/responses/Error'
  /request-refund:
    post:
      operationId: requestRefund
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
      requestBody:
        $ref: "#/components/requestBodies/requestRefund"
      responses:
        '200':
          description: success
        'default':
          $ref: '#/components/responses/Error'
  /purchases:
    get:
      description: This method returns a list of purchases made by a specific user.
      operationId: getPurchases
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/offsetQuery'
        - name: include_gifts_on_the_way
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchases'
        'default':
          $ref: '#/components/responses/Error'
  /transactions:
    get:
      description: This method returns a list of transactions made by a specific user.
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/offsetQuery'
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions'
        'default':
          $ref: '#/components/responses/Error'
  /gasless/estimate-cost/{jetton_master}:
    post:
      operationId: estimateGaslessCost
      parameters:
        - $ref: '#/components/parameters/jettonMasterParameter'
        - $ref: '#/components/parameters/optionalToken'
        - $ref: '#/components/parameters/walletId'
        - $ref: '#/components/parameters/walletToken'
        - $ref: '#/components/parameters/walletAuth'
        - name: wallet_address
          in: query
          schema:
            type: string
          required: false
        - name: wallet_public_key
          in: query
          schema:
            type: string
          required: false
        - name: enable_validation
          in: query
          schema:
            type: boolean
            default: false
          required: false
      requestBody:
        $ref: "#/components/requestBodies/gaslessEstimateCost"
      responses:
        '200':
          description: TBD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessEstimation'
        'default':
          $ref: '#/components/responses/Error'

  /gasless/estimate/jetton-transfer:
    post:
      operationId: EstimateGaslessJettonTransfer
      summary: Estimate gasless commission for a jetton transfer by its parameters
      requestBody:
        $ref: "#/components/requestBodies/gaslessEstimateJettonTransfer"
      responses:
        '200':
          description: Gasless commission transfer parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GaslessCommissionJettonTransfer'
        'default':
          $ref: '#/components/responses/Error'
  /restricted/promo-campaign:
    post:
      operationId: createPromoCampaign
      parameters:
        - $ref: '#/components/parameters/adminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - participants
                - name
              properties:
                name:
                  type: string
                participants:
                  type: array
                  items:
                    type: object
                    required:
                      - address
                      - amount
                    properties:
                      address:
                        type: string
                      amount:
                        type: string
                        description: amount in TON
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required:
                  - participants
                properties:
                  participants:
                    type: array
                    items:
                      type: object
                      required:
                        - address
                      properties:
                        address:
                          type: string
                        balance_increased:
                          type: string
                        error:
                          type: string
        'default':
          $ref: '#/components/responses/Error'
  /restricted/promo-campaign-by-user:
    post:
      operationId: createPromoCampaignByUser
      parameters:
        - $ref: '#/components/parameters/adminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - participants
                - name
              properties:
                name:
                  type: string
                participants:
                  type: array
                  items:
                    type: object
                    required:
                      - user_id
                      - amount
                    properties:
                      user_id:
                        type: integer
                        format: int64
                      amount:
                        type: string
                        description: amount in TON
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required:
                  - participants
                properties:
                  participants:
                    type: array
                    items:
                      type: object
                      required:
                        - user_id
                      properties:
                        user_id:
                          type: integer
                          format: int64

        (docs/generic payload). The battery builds the transfer of `amount` from `from` to the
        purchases wallet as a battery-sponsored batch: `operation` has an "eip7821/hermes/delegate"
        payload, preceded by an "eip7702/authorization" one for an account never delegated, as

                        example: 1200
    Chain:
      type: string
      enum: [ ton, tron, eth ]
      description: >-
        Which chain an operation runs on, and which shape the body around it takes. "eth" covers
        the EVM family; the particular network is named by evm_chain inside the body.

    EstimateRequest:
      oneOf:
        - $ref: '#/components/schemas/TonEstimateRequest'
        - $ref: '#/components/schemas/TronEstimateRequest'
        - $ref: '#/components/schemas/EvmEstimateRequest'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonEstimateRequest'
          tron: '#/components/schemas/TronEstimateRequest'
          eth: '#/components/schemas/EvmEstimateRequest'

    SendRequest:
      oneOf:
        - $ref: '#/components/schemas/TonSendRequest'
        - $ref: '#/components/schemas/TronSendRequest'
        - $ref: '#/components/schemas/EvmSendRequest'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonSendRequest'
          tron: '#/components/schemas/TronSendRequest'
          eth: '#/components/schemas/EvmSendRequest'

    # Gasless 2.0 (docs/generic payload). Payload and signed-payload "meta" depend on chain_id and
    # type, so they are free-form objects here and checked in code.
    GaslessV2Fee:
      type: object
      description: >-
        The battery answers "value" only. "gas" and "eip1559" are the generic payload's network fees,
        which other services' quotes (tk-perps /funding/quote) put on a payload a client passes on
        here as it is. The battery ignores the fee of any payload it is sent.
      required: [ type, asset_id, data ]
      properties:
        type:
          type: string
          enum: [ value, gas, eip1559 ]
        asset_id:
          type: string
          example: battery/mainnet
        data:
          type: object
          properties:
            amount:
              type: string
              description: >-
                "value": in the asset's smallest units; charges for "battery/mainnet". Always set in
                what the battery answers.
            limit:
              type: string
              description: '"gas", "eip1559": the gas limit.'
            price:
              type: string
              description: '"gas": the gas price, in wei.'
            max_fee_per_gas:
              type: string
              description: '"eip1559": the max fee per gas, in wei.'
            max_priority_fee_per_gas:
              type: string
              description: '"eip1559": the max priority fee per gas, in wei.'

    GaslessV2Payload:
      type: object
      required: [ id, type, chain_id, version, meta ]
      properties:
        id:
          type: string
        type:
          type: string
          description: "main | prebuild (TRON, Solana) | batch | eip7702/authorization | eip7821/hermes/delegate. On TRON a main (to: the token's contract, data: the transfer(address,uint256) call, memo: hex, optional) is built into the prebuild to sign. A TON payload to sign says in meta.format how: ext_msg or int_msg"
        chain_id:
          type: string
          example: ton/mainnet
        version:
          type: integer
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        meta:
          type: object
          additionalProperties: true

    GaslessV2Operation:
      x-operation: true
      type: object
      required: [ id, type, payloads ]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: transfer | swap | call | message | auth | stake | unstake
        payloads:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2SignedPayload:
      type: object
      required: [ type, chain_id, payload_id, meta ]
      properties:
        type:
          type: string
          description: "the payload type + /signed: prebuild/signed (TRON, Solana; signed is accepted too) | eip7702/authorization/signed | eip7821/hermes/delegate/signed (eip7821/hermes/1/signed is accepted too); main/signed and batch/signed (TON; signed is accepted too)"
        chain_id:
          type: string
        payload_id:
          type: string
        meta:
          type: object
          additionalProperties: true

    GaslessV2SignedOperation:
      type: object
      required: [ id, payloads ]
      properties:
        id:
          type: string
          format: uuid
        payloads:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2SignedPayload'

    GaslessV2Asset:
      type: object
      required: [ id, name, symbol, decimals ]
      properties:
        id:
          type: string
          example: ton/mainnet/jetton/0:b113a994b5024a16719f69139328eb759596c38a25f59028b146fecdc3621dfe
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        image:
          type: string

    GaslessV2ErrorBody:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          description: >-
            unsupported_chain | unsupported_asset | unsupported_payload | insufficient_funds |
            emulation_failed | route_not_sponsorable | emulation_expired | payload_mismatch |
            invalid_signature | broadcast_failed | operation_not_found | already_sent | bad_request |
            unauthorized | not_implemented | internal_error. route_not_sponsorable: the payload calls a
            contract that only accepts transactions the wallet sends and pays for itself (it checks
            tx.origin), so neither the battery nor a gasless fee can pay for it; the client should ask
            for another route or offer to pay in the native coin.
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    GaslessV2Chain:
      type: object
      required: [ chain_id, payload_types, assets ]
      properties:
        chain_id:
          type: string
        payload_types:
          type: array
          description: The payload types /gasless/estimate and /gasless/emulate take on this chain.
          items:
            type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Asset'

    GaslessV2Config:
      type: object
      required: [ chains ]
      properties:
        chains:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Chain'

    GaslessV2Estimation:
      type: object
      required: [ asset, available ]
      properties:
        asset:
          $ref: '#/components/schemas/GaslessV2Asset'
        available:
          type: boolean
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        error:
          $ref: '#/components/schemas/GaslessV2ErrorBody'

    GaslessV2EstimateRequest:
      type: object
      required: [ chain_id, sender_address, payload ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        sender_public_key:
          type: string
          description: >-
            TON only: the wallet's public key, hex. Needed only while the wallet is not deployed yet;
            a deployed wallet's key is read from the chain.
        payload:
          $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2EstimateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, expires_at, estimations ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        estimations:
          type: array
          items:
            $ref: '#/components/schemas/GaslessV2Estimation'

    GaslessV2EmulateRequest:
      type: object
      required: [ chain_id, sender_address, type, gasless_asset, payloads ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        sender_public_key:
          type: string
          description: >-
            TON only: the wallet's public key, hex. Needed only while the wallet is not deployed yet;
            a deployed wallet's key is read from the chain.
        type:
          type: string
          description: The operation type, echoed back in operation.type.
        gasless_asset:
          type: string
          example: battery/mainnet
        payloads:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GaslessV2Payload'

    GaslessV2EmulateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, expires_at, asset_id, fee, operation ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        asset_id:
          type: string
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        account:
          $ref: '#/components/schemas/EvmAccountState'
        gas:
          $ref: '#/components/schemas/EvmGas'
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'

    GaslessV2SendRequest:
      type: object
      required: [ operation ]
      properties:
        operation:
          $ref: '#/components/schemas/GaslessV2SignedOperation'

    GaslessV2SendResponse:
      type: object
      required: [ operation_id, status ]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ ok, failed ]
        tx_hash:
          type: string
          description: |
            The transaction that was sent. EVM: the transaction hash, 0x-prefixed. TON: the
            normalized hash of the external message, hex.

    ManualIndex:
      type: object
      required: [ name, table, statement, state ]
      properties:
        name:
          type: string
        table:
          type: string
        statement:
          type: string
        state:
          type: string
          enum: [ missing, building, valid, invalid ]
        phase:
          type: string
          description: The phase of the build, while it is building.
        progress:
          type: number
          description: The share of the blocks of the current phase done, while it is building.
        error:
          type: string
          description: Why the last build started by this instance failed.
    UserMergeRecord:
      type: object
      required: [ id, from_user_id, to_user_id, from_balance_before, to_balance_before, moved_balance, to_balance_after,
                  moved_purchases, kept_purchases, moved_accounts, moved_messages, moved_purchase_ids, kept_purchase_ids, moved_account_ids,
                  created_at, from_balance_now, to_balance_now, from_has_public_key_now, to_public_key_now ]
      properties:
        id:
          type: integer
          format: int64
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        from_balance_before:
          type: string
        to_balance_before:
          type: string
        moved_balance:
          type: string
        to_balance_after:
          type: string
        moved_purchases:
          type: integer
        kept_purchases:
          type: integer
        moved_accounts:
          type: integer
        moved_messages:
          type: integer
        moved_purchase_ids:
          type: array
          items:
            type: string
          description: "kind:id of each purchase that moved: ton:123, ios:<transaction id>, ..."
        kept_purchase_ids:
          type: array
          items:
            type: string
        moved_account_ids:
          type: array
          items:
            type: string
        moved_public_key:
          type: string
          description: the public key that moved, hex; absent when the user had none left
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        from_balance_now:
          type: string
          description: the merged user's balance now; 0 unless something was credited to it since
        to_balance_now:
          type: string
        from_has_public_key_now:
          type: boolean
          description: false once the key has moved
        to_public_key_now:
          type: string
          description: the user merged into's public key now, hex; empty when it has none
    UserMergeCandidate:
      type: object
      required: [ from_user_id, to_user_id, to_wallet_id, account_id, from_balance, wallet_users ]
      properties:
        from_user_id:
          type: integer
          format: int64
          description: The public-key user.
        to_user_id:
          type: integer
          format: int64
          description: The wallet-id user.
        to_wallet_id:
          type: string
        account_id:
          type: string
          description: The address both bought for.
        from_balance:
          type: string
        wallet_users:
          type: integer
          description: >-
            How many wallet-id users share an address with the public-key user; to_user_id is the
            one created last, the one to merge into.
    UserMerge:
      type: object
      required: [ from_user_id, to_user_id, shared_accounts, moved_balance, to_balance, moved_purchases, kept_purchases, moved_accounts, moved_messages, moved_public_key, already_merged, dry_run ]
      properties:
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        shared_accounts:
          type: array
          items:
            type: string
          description: Addresses the public-key user bought for that multichain lists in the wallet-id user's wallet.
        moved_balance:
          type: string
          description: The public-key user's balance, which moves over whole.
        to_balance:
          type: string
          description: The wallet-id user's balance after the merge.
        moved_purchases:
          type: integer
        kept_purchases:
          type: integer
          description: TON purchases with a refund, which stay with the public-key user.
        moved_accounts:
          type: integer
          description: Linked TON addresses that now point to the wallet-id user.
        moved_messages:
          type: integer
          description: Sent messages, of every chain, that now belong to the wallet-id user.
        already_merged:
          type: boolean
          description: The pair was merged before; this merge takes what reached the public-key user since.
        moved_public_key:
          type: boolean
          description: The public-key user still had its key, and it moves to the wallet-id user.
        moved_purchase_ids:
          type: array
          items:
            type: string
          description: "The purchases that move, as kind:id: ton:123, ios:<transaction id>, android, tron, evm, promo."
        kept_purchase_ids:
          type: array
          items:
            type: string
        moved_account_ids:
          type: array
          items:
            type: string
          description: The raw TON addresses whose link moves.
        dry_run:
          type: boolean
    BatteryMigration:
      type: object
      required: [ moved, moved_charges, balance ]
      properties:
        moved:
          type: string
          description: The balance moved, in the units of the balance (TON).
        moved_charges:
          type: integer
          format: int64
        balance:
          type: string
          description: The wallet-id user's balance after the migration, in TON.

    TonPurchaseReassignment:
      type: object
      required: [ purchase_id, target_account_id, from_user_id, to_user_id, balance_increase, from_balance, to_balance, dry_run ]
      properties:
        purchase_id:
          type: integer
          format: int64
        target_account_id:
          type: string
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        balance_increase:
          type: string
          description: What the purchase added, in the units of the balance.
        from_balance:
          type: string
          description: The public-key user's balance after the move.
        to_balance:
          type: string
          description: The wallet-id user's balance after the move.
        dry_run:
          type: boolean

    # The variants below leave `chain` out of their own properties on purpose. ogen writes the
    # discriminator itself before a variant's fields, so a variant that also declares it put the key
    # in the response twice: {"chain":"eth","chain":"eth",...}.
    EstimateResponse:
      oneOf:
        - $ref: '#/components/schemas/TonEstimateResponse'
        - $ref: '#/components/schemas/TronEstimateResponse'
        - $ref: '#/components/schemas/EvmEstimateResponse'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonEstimateResponse'
          tron: '#/components/schemas/TronEstimateResponse'
          eth: '#/components/schemas/EvmEstimateResponse'

    # The variants below leave `chain` out of their own properties on purpose. ogen writes the
    # discriminator itself before a variant's fields, so a variant that also declares it put the key
    # in the response twice: {"chain":"eth","chain":"eth",...}.
    SendResponse:
      oneOf:
        - $ref: '#/components/schemas/TonSendResponse'
        - $ref: '#/components/schemas/TronSendResponse'
        - $ref: '#/components/schemas/EvmSendResponse'
      discriminator:
        propertyName: chain
        mapping:
          ton: '#/components/schemas/TonSendResponse'
          tron: '#/components/schemas/TronSendResponse'
          eth: '#/components/schemas/EvmSendResponse'

    TonEstimateRequest:
      type: object
      required: [ chain, boc ]
      properties:
        chain:
          type: string
          enum: [ ton ]
        boc:
          type: string
          description: bag-of-cells serialized to base64
          example: te6ccgECBQEAARUAAkWIAWTtae+KgtbrX26Bep8JSq8lFLfGOoyGR/xwdjfvpvEaHg
        enable_validation:
          type: boolean
          default: false
          description: Refuse the estimate when the balance would not cover it.

    TonEstimateResponse:
      type: object
      required: [ allowed_by_battery, supported_by_battery, excess ]
      properties:
        allowed_by_battery:
          type: boolean
        supported_by_battery:
          type: boolean
        reject_reason:
          type: string
        excess:
          type: integer
          format: int64
        protocol_name:
          type: string
        emulation:
          type: object
          additionalProperties: true
          description: The emulated event, as /wallet/emulate returns it.

    TonSendRequest:
      type: object
      required: [ chain, boc ]
      properties:
        chain:
          type: string
          enum: [ ton ]
        boc:
          type: string
          description: bag-of-cells serialized to base64
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            The wallet's consent to spend charges, exactly as on /message: a recoverable secp256k1
            signature over LP("keeper.battery.send.v1") | LP(wallet_id) | LP(chain) |
            LP(blake2b256(boc)).

    TonSendResponse:
      type: object
      properties:
        protocol_name:
          type: string

    TronEstimateRequest:
      type: object
      required: [ chain, wallet ]
      properties:
        chain:
          type: string
          enum: [ tron ]
        wallet:
          type: string
        energy:
          type: integer
          minimum: 0
          maximum: 1000000
        bandwidth:
          type: integer
          minimum: 0
          maximum: 2000
        enable_validation:
          type: boolean
          default: false
          description: Enable balance validation for battery charges

    TronEstimateResponse:
      type: object
      required: [ estimate ]
      properties:
        estimate:
          $ref: '#/components/schemas/EstimatedTronTx'

    TronSendRequest:
      type: object
      required: [ chain, wallet ]
      properties:
        chain:
          type: string
          enum: [ tron ]
        wallet:
          type: string
        tx:
          type: string
        energy:
          type: integer
          minimum: 0
          maximum: 1000000
        bandwidth:
          type: integer
          minimum: 0
          maximum: 2000
        instant_fee_tx:
          type: string
          description: base64 encoded payment transaction in the TON network
        user_public_key:
          type: string
          description: >-
            User public key for commission payments, required when instant_fee_tx is provided.
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            Not enforced yet. The wallet's consent to spend charges, exactly as on /v0/tron/send:
            a recoverable secp256k1 signature over LP("keeper.battery.send.v1") | LP(wallet_id) |
            LP(chain) | LP(blake2b256(LP(tx) | LP(energy) | LP(bandwidth) | LP(instant_fee_tx))),
            with chain "tron". The digest covers the cost-bearing fields, not just the tx.

    TronSendResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string

    EvmChain:
      type: string
      enum: [ eth, bsc, arb, base, sepolia, local ]
      description: >-
        Which EVM network the operation runs on. "sepolia" and "local" are test networks — the
        public Ethereum testnet and a hardhat dev chain — and exist so the flow can be exercised end
        to end without spending real gas. A deployment only serves the networks named in EVM_CHAINS,
        and production names neither.

    EvmCall:
      type: object
      description: One call the user wants executed.
      required: [ to ]
      properties:
        to:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        value:
          type: string
          description: Wei, decimal or 0x-hex; defaults to 0.
        data:
          type: string
          pattern: '^0x([0-9a-fA-F]{2})*$'
          description: Calldata; defaults to 0x.

    EvmEstimateRequest:
      type: object
      description: >-
        Quote an EVM operation. The answer carries the batch(es) to sign and a uuid to echo back to
        /send. Quotes are short-lived: expires_at is when the signature deadline runs out.
      required: [ chain, evm_chain, type, from, payloads ]
      properties:
        chain:
          type: string
          enum: [ eth ]
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        type:
          type: string
          enum: [ battery, gasless ]
          description: >-
            battery pays the gas from the user's charges; gasless takes an ERC20 fee named by asset.
        path:
          type: string
          enum: [ direct, delegate ]
          default: direct
          description: gasless delivery mechanism; ignored for battery.
        asset:
          type: string
          description: >-
            gasless only, "<chain>/<network>/erc20/<tokenAddress>"; must be an accepted fee token.
          example: eth/mainnet/erc20/0xdAC17F958D2ee523a2206206994597C13D831ec7
        from:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: The delegated EOA the batch runs on.
        payloads:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvmCall'

    EvmEstimateResponse:
      type: object
      required: [ evm_chain, uuid, expires_at, type, account, gas, sign ]
      properties:
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        uuid:
          type: string
          format: uuid
          description: Echo this to /send together with the signed artifacts.
        expires_at:
          type: integer
          format: int64
          description: Unix seconds. Past this the quote is refused and has to be asked for again.
        type:
          type: string
          enum: [ battery, gasless ]
        path:
          type: string
          enum: [ direct, delegate ]
          description: gasless only.
        charges:
          type: integer
          format: int64
          description: >-
            battery only: what /send will debit. Absent for gasless, which is paid on-chain in the
            fee token and moves no charges.
        fee:
          $ref: '#/components/schemas/EvmFee'
        fee_options:
          type: array
          description: >-
            gasless only: every accepted fee token priced for this operation, from the same
            emulation, so a client can offer the choice without asking again.
          items:
            $ref: '#/components/schemas/EvmFee'
        account:
          $ref: '#/components/schemas/EvmAccountState'
        gas:
          $ref: '#/components/schemas/EvmGas'
        sign:
          type: object
          description: >-
            What the wallet has to sign, keyed by role. battery and gasless-delegate quote a "user"
            batch, gasless-delegate also a "fee" one, gasless-direct a single "combined" batch. Send
            back exactly the roles named here.
          additionalProperties:
            $ref: '#/components/schemas/EvmSignable'

    EvmSignable:
      type: object
      required: [ typed_data, digest ]
      properties:
        typed_data:
          type: object
          additionalProperties: true
          description: EIP-712 typed data to sign, echoed back to /send unchanged.
        digest:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          description: The EIP-712 digest of typed_data, for clients that prefer to check it.

    EvmFee:
      type: object
      required: [ asset, amount, amount_formatted, symbol, decimals ]
      properties:
        asset:
          type: string
          description: '"<chain>/<network>/erc20/<tokenAddress>", the form /estimate accepts back.'
          example: eth/mainnet/erc20/0xdAC17F958D2ee523a2206206994597C13D831ec7
        amount:
          type: string
          description: Base units, decimal.
        amount_formatted:
          type: string
          description: Human-readable amount, decimals applied.
        symbol:
          type: string
        decimals:
          type: integer

    EvmAccountState:
      type: object
      required: [ address, delegated, requires_authorization ]
      properties:
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        delegated:
          type: boolean
          description: Whether the account already delegates to the relay's Hermes implementation.
        delegated_to:
          type: string
          description: The implementation it currently delegates to, if any.
        requires_authorization:
          type: boolean
          description: >-
            When true, /send needs a signed EIP-7702 authorization alongside the batch. Sign the
            template in authorization.
        authorization:
          $ref: '#/components/schemas/EvmAuthorizationTemplate'

    EvmAuthorizationTemplate:
      type: object
      description: The EIP-7702 authorization to sign when the account is not delegated yet.
      required: [ chain_id, address, nonce ]
      properties:
        chain_id:
          type: integer
          format: int64
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        nonce:
          type: integer
          format: int64

    EvmGas:
      type: object
      required: [ estimated, charged, gas_price_wei ]
      properties:
        estimated:
          type: string
          description: Gas the emulation measured.
        charged:
          type: string
          description: Gas the quote is priced on, the estimate plus the fee buffer.
        authorization_gas:
          type: string
          description: Extra gas for the EIP-7702 authorization, when one is needed.
        gas_price_wei:
          type: string
        source:
          type: string
          enum: [ estimateGas, gasMeter, heuristic ]
          description: >-
            Where the gas figure came from. "estimateGas" is the node pricing the whole transaction
            and "gasMeter" is a measurement inside eth_call — both are real. "heuristic" is a
            constant: the emulation could not be run, so the number is a guess and the quote should
            be treated as indicative rather than binding.
        gas_price_source:
          type: string
          enum: [ chain, config ]
          description: >-
            "config" means the node could not be reached and the quote fell back to a constant.
        fee_native_wei:
          type: string
          description: charged gas at the quoted price, in wei.

    PurchaseBatteryEmulateRequest:
      type: object
      required: [ chain_id, sender_address, asset_id, amount ]
      properties:
        chain_id:
          type: string
          example: base/mainnet
        sender_address:
          type: string
          description: the account the payment is sent from, on chain_id
        asset_id:
          type: string
          description: the asset paid in, as /recharge-methods lists it
          example: base/mainnet/erc20/0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        amount:
          type: string
          description: in the asset's smallest units
          example: "10000000"
        promo:
          type: string
    PurchaseBatteryEstimateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, asset_id, amount, fee, gross_charges, charges, funds_receiver ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        asset_id:
          type: string
        amount:
          type: string
          description: in the asset's smallest units
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        gross_charges:
          type: integer
          format: int64
          description: what the purchase adds before the fee
        charges:
          type: integer
          format: int64
          description: what the balance grows by, gross_charges less the fee
        funds_receiver:
          type: string
          description: the purchases wallet the payment goes to
        promo_bonus_percent:
          type: string
          description: the promo's bonus, when a valid promo was given
    PurchaseBatteryEmulateResponse:
      type: object
      required: [ chain_id, sender_address, created_at, expires_at, asset_id, amount, fee, gross_charges, charges, funds_receiver, operation ]
      properties:
        chain_id:
          type: string
        sender_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        asset_id:
          type: string
        amount:
          type: string
          description: in the asset's smallest units
        fee:
          $ref: '#/components/schemas/GaslessV2Fee'
        gross_charges:
          type: integer
          format: int64
          description: what the purchase adds before the fee
        charges:
          type: integer
          format: int64
          description: what the balance grows by, gross_charges less the fee
        funds_receiver:
          type: string
          description: the purchases wallet the payment goes to
        promo_bonus_percent:
          type: string
          description: the promo's bonus, when a valid promo was given
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'

    EvmBatteryPurchaseQuote:
      type: object
      required: [ quote, chain, funds_receiver, token, token_address, amount, min_amount, markup_percent, gross_charges, gas_charges, charges, operation, expires_at ]
      properties:
        quote:
          $ref: '#/components/schemas/EvmEstimateResponse'
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'
        expires_at:
          type: string
          format: date-time
          description: the operation is to be sent by then
        chain:
          type: string
        funds_receiver:
          type: string
          description: the purchases wallet the transfer goes to
        token:
          type: string
        token_address:
          type: string
        amount:
          type: string
        min_amount:
          type: string
          description: the least purchase, in dollars
        markup_percent:
          type: string
        gross_charges:
          type: integer
          format: int64
          description: what the purchase adds before its gas
        gas_charges:
          type: integer
          format: int64
          description: the gas of the transfer, taken off; settled from the receipt
        charges:
          type: integer
          format: int64
          description: what the balance grows by, gross_charges less gas_charges

    SolanaBatteryPurchaseQuote:
      type: object
      required: [ id, transaction, funds_receiver, token, token_mint, amount, min_amount, markup_percent, gross_charges, gas_charges, charges, fee_lamports, last_valid_block_height, expires_at, operation ]
      properties:
        id:
          type: string
          format: uuid
          description: the operation's id
        operation:
          $ref: '#/components/schemas/GaslessV2Operation'
        transaction:
          type: string
          description: >-
            the transaction to sign, base64 wire format, its two signature slots empty: the relay's
            first, the sender's second
        funds_receiver:
          type: string
          description: the purchases wallet the payment goes to
        token:
          type: string
        token_mint:
          type: string
          description: the token's mint, or SOL for the native coin
        amount:
          type: string
        min_amount:
          type: string
          description: the least purchase, in dollars
        markup_percent:
          type: string
        gross_charges:
          type: integer
          format: int64
          description: what the purchase adds before its network fee
        gas_charges:
          type: integer
          format: int64
          description: the network fee the relay pays for the transaction, taken off
        charges:
          type: integer
          format: int64
          description: what the balance grows by, gross_charges less gas_charges
        fee_lamports:
          type: integer
          format: int64
        last_valid_block_height:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time

    EvmSendRequest:
      type: object
      description: >-
        Echoes the signed artifacts matching the quote's path: gasless direct sends combined,
        gasless delegate sends fee and user, battery sends user.
      required: [ chain, uuid ]
      properties:
        chain:
          type: string
          enum: [ eth ]
        uuid:
          type: string
          format: uuid
          description: Identifies the quote returned by /estimate.
        combined:
          $ref: '#/components/schemas/EvmSignedBatch'
        fee:
          $ref: '#/components/schemas/EvmSignedBatch'
        user:
          $ref: '#/components/schemas/EvmSignedBatch'
        authorization:
          $ref: '#/components/schemas/EvmSignedAuthorization'
        proof:
          type: string
          minLength: 130
          maxLength: 130
          pattern: '^[a-f0-9]{130}$'
          description: >-
            Not enforced until clients have shipped it: when present it is verified, when absent the
            send proceeds. The wallet's consent to spend charges, in the same shape as on the other chains: a
            recoverable secp256k1 signature over LP("keeper.battery.send.v1") | LP(wallet_id) |
            LP(chain) | LP(blake2b256(uuid)), hex-encoded, 65 bytes laid out R | S | V.
            chain here is "eth:<evm_chain>", not the bare "eth" of the chain field — the network
            has to be inside the signature, or a proof made for one EVM network replays on another.
            The digest is over the quote uuid alone: the quote already pins the cost and the calls,
            so consenting to the uuid is consenting to what it priced. Requires a format 2
            wallet_id.

    EvmSignedBatch:
      type: object
      description: An echoed artifact plus its signature.
      required: [ typed_data, signature ]
      properties:
        typed_data:
          type: object
          additionalProperties: true
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: 65-byte ECDSA signature of the artifact's EIP-712 digest by the user.

    EvmSignedAuthorization:
      type: object
      description: Signed EIP-7702 authorization.
      required: [ chain_id, address, nonce, y_parity, r, s ]
      properties:
        chain_id:
          type: string
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        nonce:
          type: string
        y_parity:
          type: integer
          enum: [ 0, 1 ]
        r:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        s:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'

    EvmSendResponse:
      type: object
      required: [ evm_chain, tx_hash, mode ]
      properties:
        evm_chain:
          $ref: '#/components/schemas/EvmChain'
        tx_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        mode:
          type: string
          enum: [ direct, proxy ]
          description: >-
            direct = a call straight to the user's account; proxy = the relay self-call used by
            gasless delegate.
        authorization_included:
          type: boolean
          description: True when the transaction carried the EIP-7702 authorization.
        charged:
          type: boolean
          description: >-
            Whether the ledger recorded the send. False with a tx_hash present means the transaction
            is on chain but its ledger row could not be written: a reconciliation problem, and not a
            reason to send again.
        charges:
          type: integer
          format: int64
          description: battery only, charges debited.

    EstimatedTronTx:
      type: object
      required:
        - energy_charges
        - bandwidth_charges
        - activation_charges
        - total_charges
        - instant_fee
      properties:
        energy_charges:
          type: integer
        bandwidth_charges:
          type: integer
        activation_charges:
          type: integer
        total_charges:
          type: integer
        instant_fee:
          type: object
          required:
            - fee_address
            - accepted_assets
          properties:
            fee_address:
              type: string
            accepted_assets:
              type: array
              items:
                type: object
                required:
                  - type
                  - amount_nano
                  - name
                  - decimals
                properties:
                  type:
                    type: string
                    enum:
                      - jetton
                      - ton
                  name:
                    type: string
                  jetton_master_id:
                    type: string
                  amount_nano:
                    type: string
                    example: "10.250"
                  decimals:
                    type: integer
    SentTronTx:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    TronTransactionsList:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            type: object
            required:
              - txid
              - timestamp
              - from_account
              - to_account
              - amount
              - is_pending
              - is_failed
              - battery_charges
            properties:
              txid:
                type: string
              from_account:
                type: string
              to_account:
                type: string
              amount:
                type: string
              is_pending:
                type: boolean
              is_failed:
                type: boolean
              battery_charges:
                type: integer
              timestamp:
                type: integer
                format: int64
              trongrid_result:
                type: integer
              fee_type:
                type: string
                description: Type of fee used for this transaction (battery, ton, etc.)
              fee_ton_nano:
                type: integer
                description: Fee amount in TON nano units
              is_free_pro:
                type: boolean
                description: Whether this transaction was made using free pro transfers
    TronAvailableTransfers:
      type: object
      required:
        - available_transfers
        - type
      properties:
        available_transfers:
          type: integer
          description: Number of available free TRON transfers
          example: 3
        type:
          type: string
          description: Availability type. 'inactive' if source is telegram.
          example: inactive
        next_reset_date:
          type: integer
          format: int64
          description: Unix timestamp of next free transfers reset date (either next month after last reset or next charge date, whichever is closer)
          example: 1678275313
    AndroidBatteryPurchaseStatus:
      type: object
      required:
        - purchases
      properties:
        purchases:
          type: array
          items:
            type: object
            required:
              - product_id
              - token
              - success
            properties:
              product_id:
                type: string
                example: "1000000790000000"
              token:
                type: string
                example: "1000000790000000"
              success:
                type: boolean
                example: true
              error:
                type: object
                required:
                  - msg
                  - code
                properties:
                  msg:
                    type: string
                    example: "Temporary error. Try again later."
                  code:
                    type: string
                    example: "invalid-product-id"
                    enum:
                      - invalid-product-id
                      - user-not-found
                      - purchase-is-already-used
                      - temporary-error
                      - unknown

    appStoreResponse:
      type: object
    iOSBatteryPurchaseStatus:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            type: object
            required:
              - transaction_id
              - success
            properties:
              transaction_id:
                type: string
                example: "1000000790000000"
              success:
                type: boolean
                example: true
              error:
                type: object
                required:
                  - msg
                  - code
                properties:
                  msg:
                    type: string
                    example: "Temporary error. Try again later."
                  code:
                    type: string
                    example: "invalid-bundle-id"
                    enum:
                      - invalid-bundle-id
                      - invalid-product-id
                      - user-not-found
                      - purchase-is-already-used
                      - temporary-error
                      - unknown
    promoCodeBatteryPurchaseStatus:
      type: object
      required:
        - success
        - balance_change
      properties:
        balance_change:
          type: string
          example: "10.250"
        success:
          type: boolean
          example: true
        error:
          type: object
          required:
            - msg
            - code
          properties:
            msg:
              type: string
              example: "Temporary error. Try again later."
            code:
              type: string
              example: "promo-code-not-found"
              enum:
                - promo-code-not-found
                - promo-exceeded-attempts
                - temporary-error
    Transactions:
      type: object
      required:
        - transactions
        - total_transactions
      properties:
        total_transactions:
          type: integer
          example: 1
        next_offset:
          type: integer
          description: if set, then there are more transactions to be loaded. Use this value as offset parameter in the next request.
          example: 10
        transactions:
          type: array
          items:
            type: object
            required:
              - id
              - paid_amount
              - status
              - created_at
            properties:
              id:
                type: string
              paid_amount:
                type: string
                description: represents the amount of money paid by the user for this transaction.
                example: "10.250"
              status:
                type: string
                example: "10.250"
                enum:
                  - pending
                  - completed
                  - failed
              created_at:
                type: string
                example: "2006-01-02T15:04:05Z07:00"
  responses:
    GaslessV2Error:
      description: >-
        An error in the gasless 2.0 format. Declared under 4XX only, but server-side failures (5xx)
        come in the same shape: ogen 1.1 cannot map one response to both ranges.
      content:
        application/json:
          schema:
            type: object
            required: [ error ]
            properties:
              error:
                $ref: '#/components/schemas/GaslessV2ErrorBody'
    Error:
      description: Some error during request processing
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
              error-key:
                type: string
              error-details:
                type: string

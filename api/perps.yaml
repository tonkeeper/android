openapi: 3.0.3
info:
  title: tk-perps API
  version: 1.0.0
  description: An aggregating BFF proxy sitting between self-custody TonKeeper clients and the Lighter
    perpetuals exchange. It serves screen-shaped read responses so the client can render a full screen
    in a single round-trip.
servers:
- url: https://{host}/tk-perps/public-api/v1
  variables:
    host:
      default: api.example.com
tags:
- name: account
  description: Trading account state and lifecycle.
- name: screens
  description: Aggregated screen-shaped read responses.
- name: activity
  description: Chronological account activity feed.
- name: transactions
  description: Transactions the client signs itself — what it needs to sign one, and reporting what it submitted.
- name: funding
  description: Funding a perps account — deposits and their progress.
- name: positions
  description: The caller's positions, one resource per venue and market.
- name: orders
  description: The caller's orders — what is resting on the book, and what became of one.
- name: portfolio
  description: Balance, positions and open orders in a single read.
- name: orderbook
  description: Order book depth, truncated to what a given notional consumes.
- name: integrator
  description: Partner attribution — what the client signs into its transactions so fees accrue here.
paths:
  /account:
    get:
      tags:
      - account
      operationId: getAccount
      summary: Get the caller's Lighter main account
      description: 'Resolves the caller''s Lighter main account by the L1 (Ethereum) address bound to
        the wallet and returns a snapshot: account index, balances, and whether an L2 signing key is
        registered. The two are independent: status is Lighter''s own account status, while has_l2_key
        is read from the account''s API keys. One user maps to exactly one Lighter main account.

        has_ro_token is not Lighter''s answer but ours: it says whether this service holds a usable
        read-only token for the account, which is what every private read here runs on.

        This is also what a client polls while it waits for an account to exist: the index is
        resolved against Lighter live for as long as the binding has none, so not_registered turns
        into an account as soon as there is one. A wallet with no binding at all is answered
        not_registered too, and stays so until POST /account/bind records one -- a deposit made
        outside this service tells us nothing by itself.'
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: Account snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/bind:
    post:
      tags:
      - account
      operationId: bindAccount
      summary: Bind the caller's wallet to its L1 address
      description: >-
        Records which L1 (Ethereum) address a wallet owns, and the Lighter account that address holds
        when there is one. It is the only endpoint whose whole job is that binding; everywhere else it
        is a side effect of a write that needed it anyway.

        A caller whose Lighter account was funded outside this service has no other way in. Every read
        here answers from the binding, so until one exists its account is invisible to us, and so is
        every event Lighter reports about it. A caller about to make its first deposit calls this
        first: POST /funding/deposit records only against a bound address and does not bind. Calling it
        again later records the account index once there is one.

        The address is never taken from the caller. It is recovered from the signature, and afterwards
        read back from what that recovered, so deadline and signature are read only while the wallet
        has proved nothing. Send them anyway: whether they are needed depends on what this service has
        recorded, which the caller cannot know, and by the time a refusal came back the vault would be
        locked again. This is what keeps the passcode prompt to once per wallet.

        The account index is Lighter's to say, and it is asked for on every call. A wallet whose
        account does not exist yet is bound to its address alone and answered not_registered, which is
        not a failure but where every wallet starts: poll GET /account and continue as soon as
        account_index is set. It is filled in by whichever write learns it first, this one included.

        Not knowing is not the same as not having, so when Lighter cannot say what the address owns
        the request is refused with 503 and nothing is recorded -- a not_registered on a timeout would
        report a state this service never established. The reads answer the same way. A retry reuses
        the same signature, so the refusal costs no second prompt.

        A 503 says nothing was learned, never that something was undone. The binding is written before
        the account is read, so a refusal can arrive with the row already recorded -- and the answer is
        to call again rather than to report a failed registration. The repeat is free: the address is
        read back from the row, so no signature is needed for it, and re-binding what is recorded
        writes nothing.

        The answer names l1_address either way, and that is worth reading: the address was recovered
        from a signature rather than sent, so a wallet bound to one it did not expect would otherwise
        find out only when a later proof, signed over the address it believes in, is refused.

        A binding never moves, and there is nothing here with which to redirect it: a bound wallet is
        served the address it recorded whatever it signs now, so re-binding is accepted and changes
        nothing, which is the ordinary case.

        A 409 therefore reports a collision with another wallet rather than a caller changing its
        mind: l1_address_taken when that address is already held elsewhere, lighter_account_taken when
        the account behind it is. The usual cause is one wallet re-imported under a new wallet_id,
        while the old id still holds the row; somebody has to remove it, which is not something this
        endpoint can do. wallet_already_bound is the third and is all but unreachable -- it needs two
        first binds for one wallet to race each other, or Lighter to name a different account for an
        address it has already placed.

        A proof made over some other address is not a conflict but a refused proof, 401: it was signed
        for a statement this service is not making. Read l1_address in the answer above, or from
        GET /account, to see which address that is.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindAccountRequest'
      responses:
        '200':
          description: The binding as it now stands, with the account when there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transactions:
    post:
      tags:
      - transactions
      operationId: reportTransactions
      summary: Report transactions the caller submitted to Lighter
      description: >-
        Records transactions the caller has already submitted to Lighter so they can be
        forwarded to the Argus event stream. This service neither signs nor sends them:
        the client signs locally, submits to Lighter directly, and reports the result here.

        Only transactions Lighter accepted belong in the body — one that never reached the
        venue did not happen and must not be reported.

        Report everything the action took, in submission order. Types the event stream does not
        consume yet are accepted and ignored, so the caller never has to filter: today only
        ORDER_CREATE is forwarded, and a leverage change reported alongside it is simply dropped.

        A 202 means recorded, not delivered: forwarding is asynchronous.

        Repeating a report is safe but not free. A repeat that arrives before the event has
        been forwarded is dropped; one that arrives after produces a second event carrying
        the same event_id. Delivery is therefore at-least-once and consumers must deduplicate
        on event_id, which is the transaction hash.
      # The account is not named here any more: it is the one the wallet's proved address owns. The
      # Lighter token is gone with it -- holding a credential for an account proved nothing that the
      # address does not prove better.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTransactionsRequest'
      responses:
        '202':
          description: Recorded for forwarding.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transactions/send:
    post:
      tags:
      - transactions
      operationId: sendTransactions
      summary: Relay signed transactions to Lighter
      description: >-
        Submits transactions the client has already signed. This service does not sign: the trading
        key never leaves the device, and the signature inside each payload is the whole authorization
        Lighter checks. What is added here is that the payload has to name the account the caller's
        proved address owns, and that an accepted order is reported to the event stream without the
        client having to report it.

        One request, one submission, in order. One transaction goes to Lighter's single endpoint and
        several to its batch one, which does not accept every type — a leverage or margin change has
        to be the only entry in the request, and Lighter says so itself if it is not.

        What may be sent is Lighter's to decide, not this service's: nothing is filtered by type here.
        A refusal comes back as details.reason in this API's own vocabulary, never as the venue's code.

        Accepted means accepted by Lighter, not executed. An order can still be cancelled at matching,
        by slippage or by its own time in force, and that outcome arrives over the event stream.

        Not idempotent. A repeat carries the same nonce and is refused by Lighter, so a retry has to be
        signed again against a fresh nonce.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTransactionsRequest'
      responses:
        '200':
          description: Lighter accepted the batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTransactionsResponse'
        '400':
          description: >-
            The request was refused, by this service or by Lighter, and details.reason says what to do
            about it: resign_required — read the nonce again and sign a fresh transaction;
            order_gone — the order is no longer active, read the state instead of repeating;
            batch_not_accepted — split the request; invalid_transaction — the signed payload is wrong
            and repeating it will not help; insufficient_funds — the account has too little free margin
            or balance for it, the same transaction can pass once funds are added or a position is
            closed; integrator_not_approved — the order carries an integrator fee this account has
            not approved, or the approval expired: send ApproveIntegrator with the values from
            GET /integrator, then sign the order again; lighter_rejected — the venue refused it for a
            reason this service cannot yet name. Plus the request-shaped ones: empty_batch,
            malformed_tx_info, foreign_account, integrator_fee_mismatch.

            integrator_fee_mismatch means a transaction that can produce a fill (14 CreateOrder, 17
            ModifyOrder, 28 CreateGroupedOrders) does not carry exactly the partner attribution this
            service serves: read GET /integrator and sign in all three values as given. Any other
            rate is refused, below the served one as well as above it. The account depends on the
            User-Agent, see GET /integrator.

            A refused submission never reached a block; a retry has to be signed again against a fresh
            nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Nothing was sent. details.reason: no_lighter_account — the proved address owns no Lighter
            account; no_ro_token — the batch holds an order (14 CreateOrder or 28 CreateGroupedOrders) and either this service or
            Argus holds no live read-only token for the account (has_ro_token is false): issue one with POST /account/ro-token/issue and send
            again. Cancels and leverage changes do not need the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >-
            Either Lighter did not answer, or it declined to serve the request at all — a 5xx, a
            timeout, a rate limit, or anything else that judges nothing about the payload. The
            transaction may or may not have landed; read the account before signing the same nonce
            again.

            Also answered when relaying is switched off because this service has nowhere to report an
            accepted order to. Nothing was sent in that case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions/next-nonce:
    get:
      tags:
      - transactions
      operationId: getNextNonce
      summary: The nonce the caller's next Lighter transaction must carry
      description: >-
        Lighter counts transactions per API key slot, and a signed transaction names the nonce it was
        signed for. Reading one consumes nothing: the same slot answers the same number until a
        transaction of its own is accepted.

        The account comes back with it because the signed payload has to name that too, so signing
        needs no second call.

        Slots are independent counters. Signing in parallel takes one slot per stream — two
        transactions signed for the same nonce cannot both be accepted.
      parameters:
      - name: api_key_index
        in: query
        required: true
        description: >-
          The API key slot the transaction will be signed with. 255 is Lighter's "all keys" sentinel,
          which no transaction can be signed with, and is refused here rather than upstream.
        schema:
          type: integer
          minimum: 0
          maximum: 254
          example: 3
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The next nonce for this account and slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextNonce'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /integrator:
    get:
      tags:
      - integrator
      operationId: getIntegrator
      summary: Partner-attribution values the caller signs into its Lighter transactions
      description: >-
        What the client copies, unchanged, into the transactions it signs. Two of them consume these
        values: an order takes integrator_account_index and the two fees, while ApproveIntegrator --
        signed once, before the first order that carries a fee -- takes the account index and the four
        maximums, with an expiry of now plus approval_ttl_ms.

        Fees are millionths of a fill's notional, Lighter's own unit, so 900 is 9 basis points. A zero
        account index means attribution is off and the client signs no integrator fields at all; that
        is also the answer while this service has no integrator account configured.

        Answered per wallet, and meant to be read before signing rather than kept for the session: the
        rate is this service's to set and may one day differ between callers.

        The account depends on the app. It is read from the User-Agent, the OS in its brackets:
        "Keeper/26.10.2 (iOS; 27.0; iPhone)" is iOS, "Tonkeeper/26.10.1 (Android; 16; Pixel 9)" is
        Android, anything else is the third account. An app without its own account gets the third one
        too. POST /transactions/send checks orders against the same account, so both calls must carry
        the same User-Agent.

        Spot maximums are always zero. This service trades perpetuals, and approving a spot maximum
        would grant a permission nothing here uses.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The attribution to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/ro-token:
    post:
      tags:
      - account
      operationId: saveRoToken
      summary: Store the caller's Lighter read-only token (deprecated)
      deprecated: true
      description: >-
        Deprecated. Use POST /account/ro-token/issue, which mints the token here instead of taking one
        the client minted. Kept until clients have moved; it is not otherwise being changed.

        Two things are worse on this path, and neither can be fixed while the token arrives ready-made.
        A token minted at Lighter and not submitted here is a live read-only credential nobody knows
        about, and the two calls it takes can always come apart. And Lighter names a token by an id
        this endpoint never sees, so nothing stored through it can ever be revoked -- superseding it
        marks it unused here while it stays alive at the venue.

        Persists the caller's Lighter read-only token, encrypted at rest via Vault Transit, and binds
        the wallet to the Lighter account that token belongs to. The token value travels in the
        X-Lighter-Auth header; the body carries a signature proving the caller holds the L1 key the
        account is registered under.

        The token is also tried against Lighter before it is stored: one it does not honour for that
        account is refused here rather than kept and discovered later, when only the background
        reconciliation would notice.

        The account index is not taken from the caller. It is read out of the token and accepted only
        when it is the account this wallet's L1 address owns, which Lighter is the one to say. That
        address comes from what the wallet proved earlier -- POST /account/bind, usually -- so a
        signature is needed here only when it has proved nothing yet. Once bound, a wallet keeps its
        address and account: a proof naming another, or one another wallet holds, answers 409.
      # Both are required here: the device token says who is calling, and the Lighter token is what
      # gets stored. Unlike the read endpoints, neither is optional.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
        lighterAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoTokenRequest'
      responses:
        '204':
          description: Token stored (encrypted at rest).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/ro-token/issue:
    post:
      tags:
      - account
      operationId: issueRoToken
      summary: Mint the caller's Lighter read-only token and store it
      description: >-
        Mints a read-only token at Lighter for the caller's account, stores it encrypted at rest via
        Vault Transit, and returns it. It replaces the two steps a client used to take -- minting at
        Lighter itself, then registering the result here -- with one, so a token cannot be minted and
        then never registered.

        What the caller supplies is lighter_auth: the short-lived credential its Lighter L2 key
        produced locally. It is a bearer credential and not a signature over this request, so it
        authorises anything Lighter accepts it for until it expires, and it is passed straight through
        without being stored or logged. The L2 private key itself never travels.

        The account is not named by the caller. It is the one the address bound with POST
        /account/bind owns, which is also what the token is minted against. This call does not bind: a
        wallet that has bound no address is answered 409 address_not_bound. A wallet with no Lighter
        account yet -- one whose first deposit has not been credited -- has nothing to mint for and is
        answered 409 no_lighter_account.

        No signature and no operation proof. lighter_auth is what authorises the mint. The account it
        names is checked against the bound one before Lighter is asked: another account answers 409
        account_mismatch, and a value that is not a Lighter auth token answers 400
        invalid_lighter_auth.

        The token's expiry and its reach are this service's to set, not the caller's, and are
        therefore absent from the body: it is minted long-lived, because the private reads this
        service makes on the caller's behalf run on it and nothing renews it, and scoped to the main
        account, because a wallet maps to exactly one.

        Minting supersedes whatever token the account had. Superseded tokens are revoked at Lighter on
        a best-effort basis, in this request and only here: revoking takes the same short-lived
        authorization the mint did, so once this request ends nothing can revoke them any more.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRoTokenRequest'
      responses:
        '200':
          description: Token minted and stored (encrypted at rest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedRoToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/tier:
    get:
      tags:
      - account
      operationId: getAccountTier
      summary: The caller's Lighter account tier
      description: >-
        Read live from Lighter, never stored here, so a switch made outside this service shows up
        too. Not part of GET /account, which clients poll: every read is one more Lighter call.

        Lighter answers the tier only with a read-only token, and this service uses the one it
        stored for the wallet. A wallet with no usable token is answered 400
        readonly_token_unavailable: issue one with POST /account/ro-token/issue. A wallet with no
        Lighter account yet is answered 409 no_lighter_account.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The account's tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - account
      operationId: changeAccountTier
      summary: Switch the caller's Lighter account to another tier
      description: >-
        Relays Lighter's changeAccountTier for the caller's account. The tier sets the account's fees,
        latency and rate limits; Lighter's own docs list them (standard, premium, plus).

        What authorises the change is lighter_auth: the short-lived credential the caller's L2 key
        produced locally. It is passed straight through and never stored or logged. The account is
        not named by the caller: it is the one the wallet's proved address owns, so a wallet with no
        Lighter account yet is answered 409.

        Which tiers exist and when a switch is allowed is Lighter's to decide, not this service's:
        new_tier is not checked here. Lighter allows a downgrade once every 24 hours, and a refusal
        comes back as 400 tier_change_refused.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAccountTierRequest'
      responses:
        '204':
          description: Lighter accepted the change.
        '400':
          description: >-
            The request was refused, by this service or by Lighter. details.reason:
            lighter_auth_required, new_tier_required — a field is missing; tier_change_refused —
            Lighter refused the change: a dead authorization, an unknown tier, or a downgrade inside
            its 24-hour window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /positions:
    get:
      tags:
      - positions
      operationId: listOpenPositions
      summary: The caller's open positions
      description: >-
        Every position the wallet currently holds, one per venue and market, with the numbers a
        position card renders. Only open ones: Lighter keeps a row for every market an account has
        ever traded, and on a long-lived account the closed rows outnumber the open ones many times
        over, so a zero size is filtered here rather than on the client.

        Built from public reads -- the account snapshot Lighter serves by index, and the cached
        markets snapshot for mark prices -- so no read-only token is involved. Take-profit and
        stop-loss legs are not here: they are open orders, which do need one.

        Neither paginated nor filtered on purpose. One position per market caps the list at the
        number of active markets, and the upstream snapshot is unpaginated anyway, so a cursor would
        add failure modes without bounding anything.

        A wallet with no account yet, and an account with nothing open, both get an empty list
        rather than an error: that is what a client renders before the first position.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The caller's open positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /positions/{id}:
    get:
      tags:
      - positions
      operationId: getOpenPosition
      summary: One open position with its auto-close legs
      description: >-
        The same position the list carries, plus the take-profit and stop-loss legs attached to it.
        The legs are open orders on the market, so reading them needs the wallet's Lighter read-only
        token; this service uses the one the wallet stored through /account/ro-token rather than
        asking the caller for it again.

        auto_close_known says whether the legs were read at all. Without it a null auto_close would
        mean both "there are none" and "we could not look", and a client would offer to create a
        take-profit over one that already exists. It is false when the wallet has stored no token,
        when the stored one has expired, and when the token could not be decrypted.

        The id comes from the list and is opaque. A market the wallet holds nothing open in is a 404,
        including one whose position has just closed -- Lighter keeps a zero-size row for it, and a
        zero-size row is not a position.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: id
        in: path
        required: true
        description: Position id as the list reported it, e.g. `lighter:1`.
        schema:
          type: string
        example: lighter:1
      responses:
        '200':
          description: The position and its auto-close legs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /positions/{id}/state:
    get:
      tags:
      - positions
      operationId: getPositionState
      summary: What became of a market's position, and of the order just sent
      description: >-
        Answers the question a client has right after submitting an order: did anything happen. It
        reads this service's own record and nothing else, so it is cheap to poll -- no Lighter call,
        no read-only token, no markets snapshot.

        Two things are answered. `open` is the position the market holds now, and `last_closed` is
        the one that ended most recently; a client that closed a position needs the second, because
        an absent position alone cannot tell "it closed" from "there never was one". Both are
        episodes: one life of a position, from the fill that opened it to the fill that closed it.
        Lighter keeps only the current size, so a closed position leaves no trace there at all --
        `/positions/{id}` answers 404 for a market whose position closed a minute ago.

        `orders` is what the venue said about the orders carrying `client_order_index`, and it is
        empty until an order event arrives. An empty list therefore means "nothing heard yet", which
        is the state to keep polling on; a client knows it submitted, so this service does not
        repeat that back. Several entries are a legitimate answer: nothing makes that number unique,
        and a client that reused it is told about every order rather than being handed a guess.
        Without the parameter the list is empty and only the position halves are answered.

        A market this wallet has never traded is `open: null`, `last_closed: null`, `orders: []` --
        not a 404. The question "what is the state" always has an answer, and "nothing" is one.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: id
        in: path
        required: true
        description: >-
          Position id as the list reports it, e.g. `lighter:1`. Only the market it names is read
          here; the episode is addressed by its own id inside the response.
        schema:
          type: string
        example: lighter:1
      - name: client_order_index
        in: query
        required: false
        description: >-
          The number the caller chose for its order when it signed it. Optional, and the only way to
          be told what became of one particular order: it is inside the signed payload, so this
          service reads it and never assigns one. Zero is refused rather than looked up -- it is
          what an order carries when nobody chose a number, so it addresses nothing.
        schema:
          type: integer
          format: int64
        example: 1756280400123
      responses:
        '200':
          description: The market's position state, and the orders the number names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /portfolio:
    get:
      tags:
      - portfolio
      operationId: getPortfolio
      summary: Balance, open positions and open orders
      description: >-
        Everything the portfolio section renders in one read: the account balance, every open
        position with the numbers a position card needs, and the orders resting on the book.
        Replaces /screens/portfolio, which carries a thinner position and no orders at all.

        Balance and positions come from the account snapshot Lighter serves by index, and mark
        prices from the cached markets snapshot; neither needs a token. open_orders does, and this
        service uses the read-only token it stored for the wallet rather than asking the caller.

        A wallet with no usable read-only token is answered 400 readonly_token_unavailable rather
        than served a portfolio without its orders: the answer is to issue one through
        /account/ro-token/issue, and a half-filled screen would hide that. Not retryable, and apart
        from the 503 an outage gets.

        Take-profit and stop-loss legs are not here. They belong to a position and are served with
        it by /positions/{id}.

        A wallet with no account yet gets empty sections rather than an error.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The caller's balance, positions and open orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders:
    get:
      tags:
      - orders
      operationId: listOpenOrders
      summary: The caller's open orders
      description: >-
        Every order resting on the book across all markets. An unfilled order is not a position --
        it holds no entry price, no PnL and no liquidation price -- so it appears here and never in
        /positions.

        Take-profit and stop-loss legs are filtered out: they are attached to a position and are
        served with it by /positions/{id}, and listing them here would show the same leg twice.

        Reading orders needs the wallet's stored read-only token, so unlike /positions this
        endpoint depends on Vault. A wallet with no usable one is answered 400
        readonly_token_unavailable: the fix is to issue a token through /account/ro-token/issue,
        which no retry does. A genuine upstream failure is still a 503.

        Neither paginated nor filtered: an account's resting orders are bounded by what it can
        afford to place.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: The caller's open orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrdersPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{id}:
    get:
      tags:
      - orders
      operationId: getOrder
      summary: One order, resting or finished, with its fills
      description: >-
        The order the id names, wherever it is now. Resting orders are read from the book; one that
        has left it -- filled, cancelled or expired -- is looked up in the account's order history,
        which is walked page by page because the venue offers no lookup by order id. `resting` says
        which of the two answered.

        The history walk is bounded. An order older than the walk reaches is a 404, which is
        therefore "not found within the window this endpoint looks at" rather than a claim that it
        never existed.

        `fills` is the execution broken down into trades, which the order itself does not carry --
        it holds only the filled totals. That lookup is walked and bounded like the one above, so
        fills_known is false both when it failed and when the cap cut it short with pages still to
        come. Only under a true flag does an empty list mean the order has not traded.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: id
        in: path
        required: true
        description: Order id as the list reports it, e.g. `lighter:281474976712112`.
        schema:
          type: string
        example: lighter:281474976712112
      responses:
        '200':
          description: The order, and the trades it produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /screens/trading:
    get:
      tags:
      - screens
      operationId: getTradingScreen
      summary: Trading screen bootstrap
      description: 'Single-call bootstrap for the trading screen: contract metadata for the market, the
        caller''s current position, open orders, balance, and the action flags that drive UI affordances.
        Live orderbook and candles are delivered out-of-band over the Hermes WebSocket and are NOT part
        of this payload.

        The market data is public; the private sections are the wallet''s, and the caller carries no
        credential for them: the read-only token comes from this service''s own store.

        A wallet whose address owns no Lighter account yet, or one Lighter would not name an account
        for, gets the market and empty private sections throughout. A wallet with an account but no
        usable stored token is answered 400 readonly_token_unavailable: the balance nets what the
        resting orders reserve, and without the orders it would offer margin they already hold. A
        failure reading the account or its orders is a 503.'
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: market
        in: query
        required: true
        description: Lighter market index of the contract to load.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Trading screen payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingScreen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /screens/portfolio:
    get:
      tags:
      - screens
      operationId: getPortfolioScreen
      summary: Portfolio screen (deprecated)
      deprecated: true
      description: >-
        Superseded by /portfolio, which carries a fuller position -- with id, mark price, margin,
        equity and ROI -- the open orders this one has no room for, and a balance net of what those
        orders reserve. Frozen: it keeps answering exactly as it does today and gains nothing
        further, so its available and transferable balances still include that reserve.

        Returns equity, available, and transferable balances together with all open positions
        derived from a single account snapshot, so the portfolio screen renders in one call.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      responses:
        '200':
          description: Portfolio screen payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioScreen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orderbook/truncated:
    get:
      tags:
      - orderbook
      operationId: getTruncatedOrderBook
      summary: Order book truncated to a notional
      description: >-
        The near side of one market's book, cut off at the level where the accumulated cost covers
        the notional asked about, the fee included. The book is biblios' -- this endpoint forwards to
        it and reshapes nothing, so every number is the string that service printed.

        Which side comes back follows side: a buy consumes asks, a sell consumes bids, and the other
        array is absent rather than empty. truncated is false when the whole book did not cover the
        notional, which is the answer that says the depth is not there.

        The data is public, and the wallet headers are still required: the same pair as every other
        read, so a client that calls one calls this.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: market
        in: query
        required: true
        description: Lighter market index of the contract to load.
        schema:
          type: integer
          format: int32
          example: 1
      - name: side
        in: query
        required: true
        description: The side the caller would trade. buy reads asks, sell reads bids.
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: fee_rate
        in: query
        required: true
        description: >-
          The taker fee as a fraction, in [0;1) -- "0.0005" is five basis points. Plain decimal only:
          exponent notation is refused, and at most eight decimal places.
        schema:
          type: string
          pattern: ^0(\.[0-9]{1,8})?$
          example: '0.0005'
      - name: notional
        in: query
        required: true
        description: >-
          The quote amount the truncation has to cover, fee included. A plain decimal with at most
          eight decimal places, and greater than zero, so "0" and "0.00" are refused while "0.50" is fine.
        schema:
          type: string
          pattern: ^(?!0+(\.0+)?$)(0|[1-9][0-9]{0,17})(\.[0-9]{1,8})?$
          example: '2500'
      responses:
        '200':
          description: The truncated book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruncatedOrderBook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /activity:
    get:
      tags:
      - activity
      operationId: getActivity
      summary: Account activity timeline
      description: Merged, cursor-paginated timeline of fills, deposits, and withdrawals. Funding is not
        an item of its own -- the fill that closes a position carries the position's total funding in
        its funding field. Uses an opaque keyset cursor and returns last_sort_ts so the client can detect ranking shifts
        between polls. Deposits appear from the moment they are registered, as items of type deposit
        with status pending; the one Lighter reports once the money lands is the same item under the
        same id, with a new status, so the client updates a row rather than replacing it. A deposit
        that is never confirmed leaves the feed when it is closed, and its outcome is then only on
        /funding/deposit/{deposit_id}.

        The feed belongs to the wallet, and the caller carries no credential for it -- everything
        Lighter holds is read with the token this service keeps. Without a usable one -- or for a wallet
        whose address owns no Lighter account yet, or one Lighter will not name an account for right now
        -- the page carries only this service's own record of the wallet's deposits, which is what a
        first deposit has instead of an account. A wallet that has proved no address gets an empty page
        rather than an error, and so does an outage this service can still read its own rows through.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: type
        in: query
        required: false
        description: Filter the timeline to a single activity type. funding is deprecated and answers an
          empty page, since funding is no longer an item of its own.
        schema:
          type: string
          enum:
          - fill
          - funding
          - deposit
          - withdrawal
          - liquidation
          - tp_executed
          - sl_executed
          example: fill
      - name: market
        in: query
        required: false
        description: Restrict the timeline to a single Lighter market index.
        schema:
          type: integer
          example: 1
      - $ref: '#/components/parameters/CursorQuery'
      - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Cursor-paginated activity page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/deposit:
    post:
      tags:
      - funding
      operationId: openDeposit
      summary: Record a deposit
      description: >-
        Records that this address has deposited, so its progress can be followed and it can appear
        in history while it is still on its way. Nothing is registered with Lighter here: the
        deposit call on Ethereum already names its recipient, and Lighter keeps only what arrived,
        not what was intended.

        Nothing about the deposit depends on this call: there is no address to be told and no
        expectation to register, so a deposit never recorded is still credited, it just cannot be
        shown as pending or pushed about.

        Several deposits can be recorded at once, and funds arrive whether or not a record is
        waiting for them. What decides whether a call creates a record or returns an existing one is
        operation_id: the same one returns the same deposit, a new one creates another.

        The address is never taken from the caller. It is the one the wallet bound with POST
        /account/bind, so a deposit cannot be recorded against somebody else's address. This call does
        not bind: a wallet that has bound no address yet is refused with 409 address_not_bound, so call
        /account/bind before the first deposit. It answers not_registered for an address with no
        Lighter account yet, which is still a binding and all this call needs. There is no account index
        here either: the first deposit is what creates the account, and the index is filled in once the
        money lands.

        No signature and no operation proof: the wallet auth token is the whole authorization, as on
        POST /transactions/send. Recording a deposit moves no money and binds nothing, and a record
        that names no real transfer is closed unfunded by the checker.

        While a deposit creating the address's Lighter account and registering its key is on its way (see
        change_pub_key on POST /funding/quote), recording any other deposit for the address is refused
        with 409 account_creation_pending until that one closes. A repeat of a deposit already recorded
        is not another one and gets its record back as always. The quote answers the same 409 early, but
        a quote made before the creating deposit was recorded is only stopped here -- so record before
        broadcasting, as below, and do not broadcast a deposit this call refused.

        An address may have only a few deposits pending at once. Past that, recording another one is
        refused with 409 too_many_pending_deposits until one of them closes. A repeat of a deposit already
        recorded passes, as above. Do not broadcast a deposit this call refused.

        A deposit is named by one of two handles, and at least one is required. A direct deposit sends
        l1_tx_hash, the gateway call the wallet signs itself. A deposit paid from another chain sends
        execution_id from its quote, before the source transaction is broadcast and in the same unlock:
        the Ethereum hash appears only once the aggregator delivers, and this service looks it up
        itself. Nothing here depends on the source transaction, so re-signing it (a replacement, a new
        blockhash) changes nothing here.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDepositRequest'
      responses:
        '200':
          description: The deposit recorded, or the one this operation_id already named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/deposit/{deposit_id}:
    get:
      tags:
      - funding
      operationId: getDeposit
      summary: Read a recorded deposit
      description: >-
        Returns what is known about a deposit: whether it has been credited, for how much when it has,
        and the Lighter account it created once there is one.

        This is the gate of the registration flow, and the only reader of it in this API. A first deposit
        is what creates the account, so a client records the deposit, polls this, and continues as soon
        as account_index is set. There is no deposit-details screen.

        The moment itself is Lighter's to report, and this endpoint asks it: a record with no
        account_index is answered by resolving the address against Lighter live, rather than from what
        the next scheduled check will write. A client with its own Lighter integration can therefore
        learn the same thing without this call, one hop earlier. What is only here is the deposit while
        it is still on its way: the pending row, the amount that was declared -- Lighter keeps only what
        arrived, so "expected N, got M" can be answered from nowhere else -- and the verdict when it
        never lands.

        Answered to the wallet the deposit belongs to. The deposit_id was the whole authorisation once,
        and is not any more: an id leaks — into a log, a crash report, an analytics event — and it can
        also be asked for, since recording the same transaction again returns the deposit that already
        exists, id included. A deposit of another wallet answers 404 rather than 403, because telling
        those apart would confirm that the id exists.

        Everything in this response stays public by construction all the same — the amounts are in the
        Ethereum transaction and the account index follows from the address — and it must stay that
        way. Anything private added here would be published to whoever watches the chain.

        account_index is answered live for as long as the record has none, since that is the field a
        client is waiting on. The credit is not: it comes from this service's own record, written by the
        deposit's next scheduled check, so polling faster than that schedule learns nothing about the
        amount. Once it reports anything but pending the answer no longer changes, so there is nothing
        to gain by asking again.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: deposit_id
        in: path
        required: true
        description: The id returned when the deposit was recorded.
        schema:
          type: string
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
      responses:
        '200':
          description: The deposit as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/quote:
    post:
      tags:
      - funding
      operationId: quoteDeposit
      summary: Quote a deposit from another asset
      description: >-
        Prices a top-up of the caller's Lighter account paid with an asset on another chain, and returns
        what the client has to sign to make it happen. Nothing moves here: the quote is an offer, and
        the payloads are the client's to sign and broadcast from its own wallet.

        The money always lands as USDC on Ethereum, because that is where Lighter's gateway is, and the
        deposit into the gateway is part of the same cross-chain action: the aggregator delivers the USDC
        and calls the gateway with it, naming destination_address as the account to credit. The client
        therefore signs only on the source chain.

        The pricing is swaps-backend's (`POST /v2/crosschain/quotes` with `destination_target: lighter`):
        it asks the aggregator, sizes the deposit into the budget and checks the payloads against the
        quote. This service checks what only it knows -- whose account the deposit credits -- and hands
        the rest on.

        source_amount is a budget, not a price: the payloads returned never ask for more than it, and the
        deposit is sized to what that amount buys after the aggregator's fees, which is why output.amount
        and output.min_amount are equal -- the deposit is exact, and the slippage the quote allowed for
        was on the source side. The whole of source_amount is rarely spent to the last unit.

        A source asset that is already USDC on Ethereum needs no aggregator: the payloads are then the
        approval and the gateway call for the client's own Ethereum key, provider is `direct`, and
        there is nothing to track.

        Native USDC on Arbitrum, Base or Polygon goes through Lighter's bridge (fun.xyz) instead, provider
        `funxyz`: the one payload is a plain `transfer` of the whole source_amount to the destination's
        deposit address on that chain, which the bridge credits to the perps account as it is -- no fee,
        no swap, output.amount equal to source_amount. The address is the destination's own and the same
        on every deposit. tracking follows it as any other, by matching the transfer the bridge sees
        there: same chain, same amount, after the quote. The bridge takes no less than 5 USDC for an
        account it creates and 3 USDC for one that exists; a smaller amount, a key to register
        (change_pub_key on an account Lighter does not know), or a bridge that does not answer is quoted
        through the aggregator as before.

        USDC on Ethereum goes through the bridge too, but only to top up an account Lighter already
        knows, with at least 5 USDC: one transfer instead of the approval and the gateway call. The
        deposit that creates the account, a smaller amount, or an account Lighter did not answer for stay
        `direct`, as does any quote when the bridge does not answer.

        What to sign comes back as one operation: an id, the kind of operation it is, and the payloads
        in signing order. Each payload says its type and its chain, and the pair decides which meta it
        carries -- `main` on ton/mainnet is a TonConnect message, `main` on an EVM chain a
        transaction. A token source puts the approval first, as a payload of its own.

        A Bitcoin source is quoted only from an address that already holds source_amount: the aggregator
        builds the transaction out of the sender's own outputs, so it reads the balance before it prices.
        An address with too little, or none, answers 400 with reason insufficient_balance -- more funds
        or a smaller amount fixes it, a retry does not. Other sources are priced without looking at the
        balance, which the wallet checks when it signs.

        A source_amount that buys less than the 1 USDC the gateway accepts, once the aggregator's fees and
        the destination gas are paid, is 400 with details.reason amount_too_low. The floor moves with
        those fees -- on a cross-chain route it is mostly Ethereum gas -- so details says it where it
        can, both in US dollars as a decimal string with two places (e.g. "2.53"):

        - details.min_usd_amount: the smallest source_amount quoted now, valued in dollars, rounded up,
          with headroom for the price and the gas to move within a quote's life -- that much of
          source_asset, at the client's own rate, is quoted when asked again. Raised by registering a
          key (change_pub_key), whose call costs gas too. A source that is already USDC on Ethereum
          has the gateway's own floor, "1.00".
        - details.expected_amount: what source_amount would have deposited, in dollars, rounded down;
          "0.00" when it does not even cover the fixed costs.

        Either is left out when it could not be priced -- the aggregator refused the amount and then did
        not answer for the minimum -- and the reason stands without it.

        The quote is good for the seconds expires_at says. The aggregator revalidates at fill time, so a
        stale one is refunded rather than filled at a worse price -- ask again instead of signing an old
        one.

        The wallet's L1 address is destination_address, and the two must agree once the wallet has proved
        one: a quote for somebody else's account is refused. A wallet that has proved nothing yet -- the
        first deposit is what creates the account -- is quoted for the address it names, and binds it with
        POST /account/bind before it records the deposit.

        The deposit can also register the account's signing key in the same action, change_pub_key --
        including the first deposit, the one that creates the account. While such a deposit is on its
        way -- its quote named the caller's own account for an address Lighter knew no account of, and
        the client recorded it with POST /funding/deposit -- every other deposit to that address is
        refused with 409 account_creation_pending, whatever it pays with, until that one closes: credited,
        failed, refunded or expired, as GET /funding/deposit/{deposit_id} reports it. A quote that was
        never recorded holds nothing. Whether a quote with change_pub_key creates the account is asked of
        Lighter; when it does not answer, that quote is 503 and worth retrying, rather than guessed at.
        Every other quote asks too, for account_uninitialized only: alongside the aggregator rather than
        before it, and without waiting -- the flag is left out when Lighter fails or answers late, and
        the quote is not held up for it. Neither asks when the account is already known -- the wallet's
        binding names it, or change_pub_key named it by index -- and the flag is then false.

        A deposit the aggregator fills that registers the key takes two signatures of the owner's, and
        what they are over -- the owner's nonces, a deadline -- is this service's to read. So it is two
        calls. The first carries change_pub_key and no `operation`: the answer is a preview -- `preview: true` -- priced as the deposit will be, with no `tracking`, whose
        `operation` is the signatures to make -- an `eip7702/authorization` payload and an
        `eip7821/hermes/delegate` payload (EIP-712
        typed data), with the owner's own values in them. The client shows the preview, signs both with
        the key behind destination_address, and asks again with the same request plus the signed
        operation in `operation`, in the shared Response Signed Payloads format: the preview's
        operation id, and per payload its type with `/signed`, its chain_id, version and id as
        `payload_id`, and `meta.data` -- {y_parity, r, s} for the authorization, the 65-byte signature
        for the Execute. Nothing else is echoed: the nonces are read from the chain again, and the
        signatures have to recover to destination_address over them. Return each payload_id exactly
        as given. That answer is the quote to send:
        re-priced, since the aggregator's quote is bound to the signed calls and is a new one, and within
        source_amount as always. The preview's deadline leaves half an hour for the second call.

        A source on Ethereum (eth/mainnet, any asset but USDC) is the one exception: there is no fill.
        The aggregator swaps in the sender's own transaction and runs the deposit and the call into the
        owner's address from inside it, so that transaction is what delegates the address. The preview's
        operation is then the `eip7821/hermes/delegate` payload alone and comes back signed alone; the
        quote to send delegates in its payment -- a token's approval and payment folded into one EIP-7702
        batch with its own `meta.authorization`, or a single payment, ETH's or a token's whose allowance
        is there already, carrying `meta.authorization` for the wallet to sign into it as a type-4
        transaction. sender_address must be destination_address there, or it is 400
        change_pub_key_sender_not_destination.

      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositQuoteRequest'
      responses:
        '200':
          description: The quote and the payloads to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/withdraw/quote:
    post:
      tags:
      - funding
      operationId: quoteWithdraw
      summary: Quote a withdrawal into another asset
      description: >-
        Prices taking USDC out of the caller's Lighter account and delivering it to a wallet as another
        asset, on another chain, and returns what the client has to sign. Nothing moves here: the quote
        is an offer.

        Nothing leaves Lighter to L1 either, so there is no withdrawal delay, no claim and no gas. The
        aggregator takes Lighter itself as the origin: the one payload is a Lighter transfer of the
        account's USDC collateral into the aggregator's own account on Lighter, and the aggregator pays
        out destination_asset to recipient_address on its chain. The account is the one the wallet's
        proved L1 address owns, which the request does not name.

        The client signs the transfer as a Lighter transfer (tx type 12) from its account, with the
        account's API key and -- the receiving account being another owner's -- the owner's L1 key over
        Lighter's transfer message, and sends it through POST /transactions/send. The fill is followed by
        tracking.execution_id on GET /funding/status/{execution_id}, as a deposit's is.

        amount is a budget, as a deposit's source_amount is: the transfer and Lighter's fee on it never
        come to more, and what the budget buys after both and the aggregator's fees is output.amount,
        with output.min_amount the floor under it.

        A wallet whose address owns no Lighter account answers 409 no_lighter_account. An amount too
        small to transfer once the fees are paid answers 400 amount_too_low; a destination asset that is
        not quoted, unsupported_destination_asset; a recipient that is not an address on its chain,
        invalid_recipient_address.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawQuoteRequest'
      responses:
        '200':
          description: The quote and the transfer to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/status/{execution_id}:
    get:
      tags:
      - funding
      operationId: getFundingStatus
      summary: Follow a quoted deposit through the aggregator
      description: >-
        Reports where a cross-chain deposit is, by the execution_id its quote returned: whether the
        aggregator has seen the source transaction, filled on Ethereum, failed, or refunded. The
        execution lives at swaps-backend, which follows the fill by the id the aggregator quoted it
        under, so nothing has to be submitted there first: the wallet broadcasts on its own and polls.

        This is how a client that paid from another chain learns the Ethereum transaction hash: the
        aggregator's fill is the transaction that called the gateway, so once status is success the
        first entry of tx_hashes. POST /funding/deposit does not need it: a deposit recorded by
        execution_id is followed through this same execution server-side.

        Poll while status is pending. success, failure and refund are final. unknown means the
        aggregator has no such execution, which is also what an expired, never-broadcast quote looks
        like.

        A `funxyz` quote's execution is followed at Lighter's bridge: pending until the bridge has seen
        the transfer and credited it, then success. There is no fill on Ethereum, so no tx_hashes; the
        transfer is in in_tx_hashes once seen. A transfer the bridge has not seen 30 minutes after the
        quote is unknown, and so is an id no quote handed out.
      security:
      - deviceJWT: []
        walletAuth: []
        xWalletId: []
      parameters:
      - name: execution_id
        in: path
        required: true
        description: The tracking.execution_id a quote returned.
        schema:
          type: string
          maxLength: 128
          example: 'a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b'
      responses:
        '200':
          description: Where the deposit is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    deviceJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Device access token minted by keeper-auth. Names the device, not the wallet: which of the
        device's wallets a request concerns comes from X-Wallet-ID, paired with it by
        X-Wallet-Authorization, which is signed by that wallet's own key over this very token.

        No endpoint asks multichain-backend today whether the device is still active and its sessions
        have not been reset. That is the only way to notice a revocation before the token expires, so a
        revocation stays invisible for the token's remaining life (15 minutes plus skew). The price is
        deliberate: nothing here fails when multichain-backend does. Consequently 403 and 401
        device_inactive / token_revoked are declared across the operations but never produced. Handle
        them anyway -- an endpoint starting to ask is not a change of contract.
    walletAuth:
      type: apiKey
      in: header
      name: X-Wallet-Authorization
      x-wallet-auth: true
      description: >-
        Proof that the wallet owns the access token in Authorization: base64url of a 65-byte
        recoverable secp256k1 signature (R | S | V) over
        LP("keeper.wallet.auth.v1") | LP(blake2b256(access_token)), padding optional. The same header
        custodial-battery takes, so a client that signs one signs both.

        It carries no operation of its own. What it answers is "is this wallet the caller's": the id is
        recomputed from the key recovered out of the signature, so a wallet nobody holds the key to
        cannot be named at all, and a stolen access token does not help — it is not the wallet's key.
        On the writes, which do not introspect, this is the whole answer.

        Required. A format 2 wallet_id is what can produce one, and perps is a multichain-wallet
        product, so the older derivations are out of scope rather than exempt. It is bound to the access
        token, so it lives exactly as long as that token and is signed again after a device refresh.

        Absent answers 401 wallet_auth_required, whether the header is missing or empty, and that is apart
        from wallet_auth_invalid: one says you did not sign the session, the other that the signature does
        not match it.
    xWalletId:
      type: apiKey
      in: header
      name: X-Wallet-ID
      x-client-parameter: true
      x-wallet-id: true
      description: >-
        Tonkeeper wallet_id the request is about, in the form the WalletID schema describes (format
        2, base32 of 36 characters). The access token names the device, and a device carries up to two
        hundred wallets, so which one a request concerns is something only the client knows.

        Required, and never taken on trust where an endpoint acts on it. On the writes it is checked
        against X-Wallet-Authorization: the id is recomputed from the key recovered out of that
        signature and must come out equal, so naming a wallet you hold no key to fails as 401
        wallet_auth_invalid. It is inside every operation proof as well, which is what stops one being
        moved to another wallet. A blank header is 400.

        The reads check it the same way, and take the Lighter account from it rather than from a header:
        the account a request acts on is the one the wallet's proved address owns, so no caller can read a
        balance, an address or a position by naming an index. A wallet that has proved no address yet, or
        whose address owns no Lighter account, is served the public parts and empty private ones.

        Not knowing is not the same as not having: when Lighter cannot say which account an address owns,
        /account and /screens/portfolio answer 503 rather than report an account state they did not
        establish. /screens/trading and /activity degrade instead, because each has an answer that does
        not depend on the account -- the market data for one, this service's own deposit records for the
        other -- and their private halves already come back empty on an upstream failure.
    lighterAuth:
      type: apiKey
      in: header
      name: X-Lighter-Auth
      x-client-parameter: true
      description: >-
        Lighter read-only token, in its `ro:{account}:{single|all}:{expiry}:{hex}` form. Lighter mints
        it (createToken or its front-end) and shows it once; its expiry is chosen at creation, between
        a day and ten years, which is why expires_at travels with it when it is stored here. Not to be
        confused with Lighter's other credential of the same shape in spirit: the token the SDK signs
        locally is capped at 8 hours and is not what this header carries.

        Only needed on endpoints that read the caller's private Lighter data (open orders, fills with
        realized PnL, funding payments, deposit/withdraw history). Without it those private sections
        are omitted/empty rather than producing a hard error.

        Storing one (POST /account/ro-token) refuses anything without the `ro:` prefix: the other
        kind expires within hours, and a stored one would work for a while and then take the
        background reconciliation blind with it.
  parameters:
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor returned as next_cursor by a previous page.
      schema:
        type: string
        example: eyJvZmZzZXQiOjIwfQ==
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  schemas:
    WalletID:
      type: string
      description: >-
        A commitment to the wallet's root key, so the id cannot be claimed without the key it was
        derived from. Format 2 only: base32 of 36 characters, the derivation that carries its own
        version and kind and the only one a key can be recovered against.

        Three derivations are in circulation, and the older two (64 hex characters, base32 of 32) are
        rejected here rather than supported: every endpoint needs X-Wallet-Authorization, whose check
        recomputes the id from the key recovered out of the signature, and that cannot be done for an
        id whose derivation does not allow it. Such an id
        answers 400 with reason wallet_auth_unsupported_wallet_id, not 401 -- no signature can make it
        verify, so it is the id that is wrong and not the proof. Perps is a multichain-wallet product,
        so every caller has a format 2 id.
      minLength: 36
      maxLength: 36
      pattern: '^[a-z2-7]{36}$'
      example: aiay32vhbx3wgqvssxk2jvp2ec65fyry2lja
    BindAccountRequest:
      type: object
      description: >-
        The proof of the address to bind and this wallet's consent to being bound to it. Nothing else
        is here: the account is not the caller's to name, and the address is not the caller's to
        claim.
      required:
      - proof
      properties:
        deadline:
          type: integer
          format: int64
          description: >-
            Unix seconds, signed inside the EIP-712 message. Not checked against the clock: a device
            clock running behind would otherwise refuse every bind, and the signature binds nothing
            without the operation proof. Travels with signature: one without the other is a 400.
          example: 1755600000
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: >-
            EIP-712 signature over LinkWallet(string walletId,uint64 deadline), under domain
            {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65
            bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.

            Read only while the wallet has proved no L1 address yet; missing when it is needed answers
            400 address_proof_required.
          example: '0x4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c'
        proof:
          type: string
          pattern: '^[0-9a-fA-F]{130}$'
          description: >-
            The wallet's consent to this binding, signed with its own root key: hex of a 65-byte
            recoverable secp256k1 signature (R | S | V) over
            LP("perps.account.bind.v1") | LP(wallet_id) | LP(l1_address), in the same length-prefixed
            framing the other writes use. l1_address is lowercase with its 0x and is named here and
            nowhere in the body.

            The signature above shows that somebody holds the key to an address; this shows that this
            wallet meant to be bound to it, which is what makes the binding irreversible. Required,
            and absent answers 401 operation_proof_required.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    ChangeAccountTierRequest:
      type: object
      description: >-
        The tier to switch to and the Lighter authorization to switch with. The account is not here:
        it is the one the wallet's proved address owns.
      required:
      - lighter_auth
      - new_tier
      properties:
        lighter_auth:
          type: string
          description: >-
            The short-lived Lighter authorization the caller's L2 key produced locally. Carried in the
            body rather than a header, as in POST /account/ro-token/issue. Passed through to Lighter
            and never stored.
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        new_tier:
          type: string
          description: The tier to switch to, in Lighter's own words. Passed through unchanged.
          example: premium
    IssueRoTokenRequest:
      type: object
      description: >-
        What it takes to have a read-only token minted: the Lighter authorization to mint it with.
        The account, the label, the expiry and the reach are not here -- none of them is the caller's
        to choose.
      required:
      - lighter_auth
      properties:
        lighter_auth:
          type: string
          description: >-
            The short-lived Lighter authorization the caller's L2 key produced locally, typically good
            for ten minutes, in Lighter's form {deadline}:{account_index}:{api_key_index}:{signature}.
            Its account_index has to be the bound account's. Carried in the body rather than a header
            so it is never confused with this API's own authorization, which is a different credential
            answering a different question. Passed through to Lighter and never stored.
          example: '1760000000:738887:3:87bd4a1a59787c4c46cd5badac7a2fb2ecd779c892fbb00a3ff15874b2a1020912d49b9a5c6b616aab71384e9b4800898468b7eca96bed5958b9962379a40c7fdf6b6d6071265da5a737645c7ce43522'
    IssuedRoToken:
      type: object
      description: The minted token and what was recorded about it.
      required:
      - token
      - token_id
      - account_index
      - issued_at
      - expires_at
      properties:
        token:
          type: string
          description: >-
            The read-only token itself, "ro:{account}:{scope}:{expiry}:{secret}". A credential: hold
            it as one. This service keeps its own encrypted copy, so a client that has no direct use
            for it can discard it.
          example: 'ro:738887:single:1946678400:8f3c1d...'
        token_id:
          type: integer
          format: int64
          description: >-
            Lighter's id for the token, and the only handle its revocation takes. Keep it if you
            intend to revoke the token yourself later.
          example: 41207
        name:
          type: string
          description: >-
            The label the token was minted and stored under. Chosen here rather than by the caller:
            a fixed prefix and a short digest of the wallet, so one wallet's row can be told from
            another's in Lighter's own list of tokens. The same wallet is relabelled the same way
            every time it reissues.
          example: Tonkeeper 3f8a1c2d
        account_index:
          type: integer
          format: int64
          description: The Lighter account the token belongs to, which is the one this wallet's address owns.
          example: 738887
        issued_at:
          type: string
          format: date-time
          description: When this service minted the token.
          example: '2026-09-09T10:00:00Z'
        expires_at:
          type: string
          format: date-time
          description: >-
            When the token stops working, as the token itself states it rather than as it was asked
            for. Far ahead by design; nothing renews it.
          example: '2031-09-08T10:00:00Z'
    SaveRoTokenRequest:
      type: object
      description: >-
        What travels with a Lighter read-only token: a label to remember it by, this wallet's consent to
        storing it, and the proof of its L1 address when it has none recorded yet. The token itself is in
        the X-Lighter-Auth header, and its account index and expiry are read out of it rather than
        declared here.
      required:
      - issued_at
      - proof
      properties:
        name:
          type: string
          description: Optional client-supplied label for the token.
          example: mobile-app
        issued_at:
          type: string
          format: date-time
          description: >-
            When the client says the token was issued. Recorded and forwarded to Argus, whose event
            schema carries the field; nothing here depends on it, because a read-only token states no
            issue time of its own and this cannot be checked.
          example: '2026-07-22T12:00:00Z'
        deadline:
          type: integer
          format: int64
          description: >-
            Unix seconds, signed inside the EIP-712 message. Not checked against the clock: a device
            clock running behind would otherwise refuse every bind, and the signature binds nothing
            without the operation proof. Travels with signature: one without the other is a 400.
          example: 1755600000
        signature:
          type: string
          description: >-
            EIP-712 signature over LinkWallet(string walletId,uint64 deadline), under domain
            {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65
            bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form of a signature is refused
            so one proof has one encoding.

            Read only while the wallet has proved no L1 address yet, which for most callers happened
            before their first deposit, on POST /account/bind. Send it when you can: the client cannot tell when it is needed, and
            missing when it is answers 400 address_proof_required.
          pattern: '^0x[0-9a-fA-F]{130}$'
          example: '0x4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c'
        proof:
          type: string
          pattern: '^[0-9a-fA-F]{130}$'
          description: >-
            The wallet's consent to storing this token, signed with its own root key: hex of a 65-byte
            recoverable secp256k1 signature (R | S | V) over
            LP("perps.rotoken.store.v1") | LP(wallet_id) | LP(l1_address) | LP(token_hash) | LP(name)
            | LP(issued_at), in the same length-prefixed framing custodial-battery uses for its send
            proof. token_hash is sha256 of the X-Lighter-Auth value in lowercase hex — the token is
            named by its hash, never signed as itself; name is what this body carries, empty string when
            omitted; issued_at is unix nanoseconds in decimal, because it is kept and forwarded at that
            precision; l1_address is lowercase with its 0x.

            Note that l1_address is named here and nowhere in the body. signature only proves that
            somebody holds the key to an address; this is the wallet saying which address is its own.
            Both are needed while the wallet has none recorded: without this one an EIP-712 signature
            captured anywhere could bind the wallet to a stranger's Lighter account.

            Required on every stored token, not only the first, and absent answers 401
            operation_proof_required. Requires a format 2 wallet_id, which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    TransactionType:
      type: string
      description: >-
        Business meaning of a submitted transaction. These values belong to the Argus event
        vocabulary shared with the poc service, which is why they are UPPER_SNAKE rather than
        following this API's other enums; they are matched byte for byte on the far side.

        Lighter's own numeric transaction type cannot stand in for this: closing a position
        is the same CreateOrder as opening one (reduce-only), and adding and removing margin
        share a single UpdateMargin. Only the caller knows which it meant.
      enum:
      - POSITION_CLOSE
      - POSITION_PARTIAL_CLOSE
      - POSITION_LIQUIDATION
      - POSITION_PARTIAL_LIQUIDATION
      - ORDER_CREATE
      - ORDER_CREATE_INTENT
      - ORDER_CANCEL
      - SET_LEVERAGE
      - MAIN_TO_SUB_TRANSFER
      - POSITION_MARGIN_ADD
      - POSITION_MARGIN_REMOVE
      - AUTO_CLOSE_TRIGGERED
      - AUTO_CLOSE_CANCELED
      - WITHDRAWAL
    ReportedTransaction:
      type: object
      description: One signed transaction that Lighter accepted.
      required:
      - type
      - tx_hash
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        tx_hash:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Lighter transaction hash, computed client-side from the signed transaction and
            therefore known before the venue replies. It becomes the event_id consumers
            deduplicate on, so the same submission must always be reported under the same hash.
          example: '0xdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd'
    ReportTransactionsRequest:
      type: object
      description: >-
        One user action, which may have taken more than one transaction: opening a position
        that also changes leverage is a SET_LEVERAGE followed by an ORDER_CREATE.
      required:
      - submitted_at
      - transactions
      - proof
      properties:
        operation_id:
          type: string
          maxLength: 128
          description: >-
            Opaque client-side identifier grouping the transactions of one action. Never parsed here
            and not forwarded — the event stream has no field for it — so it serves our own log lines
            and support: the same action retried should reuse the same value.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        submitted_at:
          type: string
          format: date-time
          description: When the client submitted the transactions to Lighter.
          example: '2026-07-29T10:00:00Z'
        transactions:
          type: array
          minItems: 1
          maxItems: 16
          description: >-
            In submission order. The order matters to consumers, which see one event per
            entry: a leverage change that preceded an order must precede it here too.
          items:
            $ref: '#/components/schemas/ReportedTransaction'
        deadline:
          type: integer
          format: int64
          description: >-
            Unix seconds, signed inside the EIP-712 message. Not checked against the clock: a device
            clock running behind would otherwise refuse every bind, and the signature binds nothing
            without the operation proof. Travels with signature: one without the other is a 400.
          example: 1755600000
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: >-
            EIP-712 signature proving this wallet's L1 address, over
            LinkWallet(string walletId,uint64 deadline) under domain
            {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65
            bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.

            Read only while the wallet has proved no address yet; sign it in the same vault unlock as
            the trade being reported, so the user confirms once. Missing when it is needed answers 400
            address_proof_required.
          example: '0x99ce24c2b78cd46c35a3608007ccece84254a4696045b7f5962a6e758ebeadcc250da971d87099ce2e03e429f0321c42ed4de6cd0c468507480a63b65e64ab801b'
        proof:
          type: string
          pattern: '^[0-9a-fA-F]{130}$'
          description: >-
            The wallet's consent to this report, signed with its own root key: hex of a 65-byte
            recoverable secp256k1 signature (R | S | V) over
            LP("perps.transactions.report.v1") | LP(wallet_id) | LP(l1_address) | LP(submitted_at)
            | LP(type) | LP(tx_hash) | ..., one length-prefixed pair per entry in the order they
            appear in transactions, and submitted_at as unix nanoseconds in decimal. The same
            length-prefixed framing custodial-battery uses for its send proof.

            Nanoseconds because that is the precision the events carry: submitted_at reaches consumers
            whole, as the event's timestamp and its event_time header, and a proof over whole seconds
            would leave the sub-second part free to change.

            Everything that reaches a consumer is inside it: the entries, their order, and the time the
            events carry. Nothing else in the body is signed -- operation_id never leaves this service.

            l1_address is named here and nowhere in the body, lowercase with its 0x, because a first
            report binds the wallet to an address exactly as POST /account/bind does. signature only proves
            that somebody holds the key to an address; this is the wallet saying which address is its
            own, without which a signature captured anywhere could attach a stranger's Lighter account
            to this wallet.

            Separate from signature, which proves an address; this proves an operation. It is what an
            access token cannot forge, since the key behind the wallet is not in it: a captured request
            cannot be turned into a report of different transactions.

            Required, and absent answers 401 operation_proof_required. Requires a format 2 wallet_id,
            which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    SignedTransaction:
      type: object
      description: One transaction as the client signed it.
      required:
      - tx_type
      - tx_info
      properties:
        tx_type:
          type: integer
          format: int32
          description: >-
            Lighter's transaction type, forwarded as given and not checked against a list here: which
            types it accepts, and which of them may share a batch, is Lighter's to answer. Today its
            batch endpoint takes 14 CreateOrder, 15 CancelOrder, 16 CancelAllOrders, 17 ModifyOrder
            and 28 CreateGroupedOrders, while 20 UpdateLeverage and 29 UpdateMargin have to be the
            only entry in the request.
          example: 14
        tx_info:
          type: string
          description: >-
            The signed payload, exactly as the signer produced it. Forwarded byte for byte: it is read
            only for the AccountIndex it names, and re-encoding it would break the signature over it.
          example: '{"AccountIndex":738887,"ApiKeyIndex":3,"MarketIndex":1,"Nonce":5,"Sig":"..."}'
    SendTransactionsRequest:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            In submission order. Lighter caps a batch at fifty and answers one as a whole, so a
            refusal refuses all of them. More than fifty is refused here as batch_not_accepted.
          items:
            $ref: '#/components/schemas/SignedTransaction'
    SentTransaction:
      type: object
      required:
      - tx_type
      - tx_hash
      properties:
        tx_type:
          type: integer
          format: int32
          description: Echoed from the request, so a result can be matched without counting positions.
          example: 14
        tx_hash:
          type: string
          description: Lighter's hash for the accepted transaction, and the event id it is reported under.
          example: f0c0cd6f3d9184eaca980b5036345426104bbcdf35b597f5c6019274dc266a82fd9d4fdea186c109
    SendTransactionsResponse:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          description: One result per submitted transaction, in the order they were sent.
          items:
            $ref: '#/components/schemas/SentTransaction'
        predicted_execution_time_ms:
          type: integer
          format: int64
          description: Lighter's estimate of how long until the batch executes.
          example: 214
    NextNonce:
      type: object
      description: The next nonce for one account and one API key slot.
      required:
      - account_index
      - nonce
      properties:
        account_index:
          type: integer
          format: int64
          description: The Lighter account the caller's proved address owns.
          example: 738887
        nonce:
          type: integer
          format: int64
          description: >-
            The nonce the next transaction on this slot must carry. Zero for a slot that has signed
            nothing yet, which is an answer and not an absence.
          example: 5
    ErrorResponse:
      type: object
      description: Uniform error envelope for every non-2xx response. The HTTP status code carries the
        status; this body carries the machine-readable details.
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code, from a flat catalog: validation_error,
            address_proof_required, token_expired, invalid_token, token_revoked, device_inactive,
            wallet_auth_required, wallet_auth_invalid, operation_proof_required,
            operation_proof_invalid, wallet_forbidden, not_found, conflict, upstream_unavailable,
            auth_unavailable, internal_error.
          example: wallet_auth_invalid
        message:
          type: string
          nullable: true
          description: Human-readable explanation, may be null. Fixed per code, not composed per
            request, so it is for logs rather than for showing to a user.
          example: wallet authorization is invalid
        retryable:
          type: boolean
          description: Whether the client may safely retry the same request.
          example: false
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional structured context about the error.
      example:
        code: conflict
        message: conflict
        retryable: false
        details:
          reason: deposit_amount_mismatch
    OrderSide:
      type: string
      description: UI/domain order side. The proxy maps this to Lighter is_ask internally.
      enum:
      - long
      - short
    OrderType:
      type: string
      description: Order execution type.
      enum:
      - market
      - limit
    PositionSide:
      type: string
      description: Direction of an open position.
      enum:
      - long
      - short
    MarginMode:
      type: string
      description: Margin mode for a position.
      enum:
      - cross
      - isolated
    TimeInForce:
      type: string
      description: Time-in-force policy for an order.
      enum:
      - ioc
      - gtt
      - post_only
    OrderStatus:
      type: string
      description: Collapsed public order status (Lighter internal sub-statuses are never leaked).
      enum:
      - new
      - open
      - filled
      - partially_filled
      - canceled
      - rejected
    OrderCategory:
      type: string
      description: Functional category of an order.
      enum:
      - open
      - close
      - take_profit
      - stop_loss
      - liquidation
    ActivityType:
      type: string
      description: Type of an account activity/history item.
      enum:
      - fill
      - deposit
      - withdrawal
      - liquidation
      - tp_executed
      - sl_executed
    AccountStatus:
      type: string
      description: >-
        Registration/activity status of the caller's Lighter account. not_registered is this service's
        own answer for a wallet with no account bound to it yet; active and inactive are Lighter's
        account status. None of the three is derived from has_l2_key.
      enum:
      - active
      - inactive
      - not_registered
    AssetDetailsType:
      type: string
      description: Asset details payload discriminator. More values can be added as asset details expands beyond perps.
      enum:
      - perps
      x-enum-varnames:
      - AssetDetailsTypePerps
    Account:
      type: object
      description: The caller's Lighter main account summary.
      properties:
        account_index:
          type: integer
        l1_address:
          type: string
          description: >-
            L1 (Ethereum) address keying this main account. Present whenever the wallet has proved
            one, status not_registered included: the address is never sent by the caller, so this is
            the only place to read back what the wallet is bound to. Absent only while it has proved
            nothing at all.

            Always lowercase, whatever case Lighter reports, because it is signed over verbatim: an
            operation proof is checked against the address in the form recorded here, and the same
            address in two casings is two different statements.
          example: '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984'
        status:
          $ref: '#/components/schemas/AccountStatus'
        has_l2_key:
          type: boolean
          description: >-
            Whether an L2 signing key is registered (ChangePubKey done). Independent of status: it
            comes from the account's API keys, not from the account record. True exactly when
            api_keys below is non-empty.
        has_ro_token:
          type: boolean
          description: >-
            Whether a usable read-only token is in place for the account -- one stored here, not
            expired and not superseded, that Argus also holds unexpired. It is read from our own
            database and from Argus, not from Lighter, so it says what this service can do on the
            account's behalf and nothing about what tokens exist elsewhere. A token saved here stays
            false until Argus has taken it in.

            False is the answer to poll on: while it stays false the client has to submit or mint a
            token (POST /account/ro-token/issue) before anything that needs one. It is false for an
            account that does not exist yet too, for want of anything to hold a token against.
        api_keys:
          type: array
          description: >-
            The L2 signing keys registered on this account, one entry per occupied slot. Only
            occupied slots are listed, so an index absent here is one a client may register into, and
            an empty array means the account has no signing key at all. Absent while the wallet has
            no account.
          items:
            $ref: '#/components/schemas/AccountAPIKey'
        collateral:
          type: string
          description: Total collateral, human-unit decimal string.
          example: '1762.09'
        equity:
          type: string
          description: >-
            What the account is worth: collateral plus the margin of isolated positions plus the
            unrealized PnL, human-unit decimal string. Lighter's own figure, the same as balance.equity in
            /portfolio, but read without a read-only token. This is the number to add to a wallet's
            total.
          example: '1865.89'
        available_balance:
          type: string
          description: >-
            Balance available for new orders, human-unit decimal string. Net of the margin that
            resting orders hold, the same figure as balance.available_balance in /portfolio. The
            field is absent when the orders could not be read, for example when no read-only token
            is stored. Absent means unknown, not zero.

            It does not follow has_ro_token. That flag also waits for Argus to take the token in,
            and reading orders does not need Argus. So right after a token is saved the field can
            be present while has_ro_token is still false.
          example: '980.15'
        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-14T09:32:11Z'
    AccountTier:
      type: object
      description: >-
        The account's Lighter tier, which sets its fees, latency and rate limits. Both values are
        Lighter's own, passed through unchanged.
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Lighter's id for the tier, passed through unchanged.
          example: std
        name:
          type: string
          description: Lighter's readable name for the tier, passed through unchanged.
          example: standard
    AccountAPIKey:
      type: object
      description: One L2 signing key registered on the account, as Lighter reports it.
      required:
      - api_key_index
      - public_key
      properties:
        api_key_index:
          type: integer
          description: >-
            The slot this key occupies. It is what a client names when it signs a transaction and
            when it reads a nonce from GET /transactions/next-nonce.
          example: 3
        public_key:
          type: string
          description: >-
            The key's public part. A client finds its own slot by comparing this against the key it
            holds, which is the only way to tell its key from another device's.
          example: '0x8e4ee0a2d3b1f2b9d1bb8a7ff2f3e4c6b5a49788c1d2e3f405162738495a6b7c'
    Integrator:
      type: object
      description: >-
        Partner attribution for one caller. Every field is an integer in Lighter's own units and is
        signed verbatim; nothing here is a display value.
      required:
      - integrator_account_index
      - integrator_taker_fee
      - integrator_maker_fee
      - max_perps_taker_fee
      - max_perps_maker_fee
      - max_spot_taker_fee
      - max_spot_maker_fee
      - approval_ttl_ms
      properties:
        integrator_account_index:
          type: integer
          format: int64
          description: Lighter account the fees accrue to. Zero means attribution is off.
          example: 745796
        integrator_taker_fee:
          type: integer
          description: Taker fee in millionths of the fill's notional. 900 is 9 basis points.
          example: 900
        integrator_maker_fee:
          type: integer
          description: Maker fee in millionths of the fill's notional.
          example: 900
        max_perps_taker_fee:
          type: integer
          description: >-
            Perpetual taker ceiling to sign into ApproveIntegrator. Never below integrator_taker_fee,
            and raising it later needs a fresh approval from the same wallet.
          example: 1000
        max_perps_maker_fee:
          type: integer
          description: Perpetual maker ceiling to sign into ApproveIntegrator.
          example: 1000
        max_spot_taker_fee:
          type: integer
          description: Always zero -- this service does not trade spot.
          example: 0
        max_spot_maker_fee:
          type: integer
          description: Always zero.
          example: 0
        approval_ttl_ms:
          type: integer
          format: int64
          description: >-
            How far ahead of now the approval_expiry signed into ApproveIntegrator should sit, in
            milliseconds. Zero alongside a zero account index means there is nothing to approve.
          example: 31536000000
    Market:
      type: object
      description: A perpetual market and its live stats. All monetary/price/size fields are human-unit
        decimal strings; the *_decimals fields tell the client how to scale those values back into integer
        units when building/signing a tx.
      properties:
        market_index:
          type: integer
        symbol:
          type: string
        base_asset:
          type: string
        quote_asset:
          type: string
        status:
          type: string
          description: Market trading status (e.g. active, paused).
        price_decimals:
          type: integer
          description: Number of decimal places used to scale prices for signing.
        size_decimals:
          type: integer
          description: Number of decimal places used to scale base sizes for signing.
        tick_size:
          type: string
          description: Minimum price increment, human-unit decimal string.
          example: '0.01'
        step_size:
          type: string
          description: Minimum base size increment, human-unit decimal string.
          example: '0.0001'
        min_size_base:
          type: string
          description: Minimum order size in base units.
          example: '0.0010'
        max_size_base:
          type: string
          description: Maximum order size in base units.
          example: '5000.0000'
        min_size_quote:
          type: string
          description: Minimum order notional in quote units.
          example: '10.00'
        max_size_quote:
          type: string
          description: Maximum order notional in quote units.
          example: '20000000.00'
        max_leverage:
          type: integer
        maker_fee_pct:
          type: string
          description: Maker fee as a percentage string.
          example: '0.02'
        taker_fee_pct:
          type: string
          description: Taker fee as a percentage string.
          example: '0.05'
        initial_margin_fraction:
          type: integer
          description: Initial margin fraction in basis points (1/10000).
        maintenance_margin_fraction:
          type: integer
          description: Maintenance margin fraction in basis points (1/10000).
        closeout_margin_fraction:
          type: integer
          description: Closeout margin fraction in basis points (1/10000).
        funding_rate_hourly:
          type: string
          description: Current hourly funding rate, decimal string.
          example: '0.0000125'
        next_funding_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-04T13:00:00Z'
        open_interest_usd:
          type: string
          description: |
            Open interest in USD, human-unit decimal string. Both sides (longs plus shorts), valued
            at the mark price, as Lighter's own UI shows it. Empty when the mark is missing.
          example: '48213900.00'
        volume_24h_usd:
          type: string
          example: '1023874500.00'
        last_price:
          type: string
          example: '3421.55'
        index_price:
          type: string
          example: '3421.10'
        mark_price:
          type: string
          example: '3421.72'
        price_change_24h:
          type: string
          description: 24h price change (percentage or absolute per client convention).
          example: '-1.84'
        high_24h:
          type: string
          example: '3502.10'
        low_24h:
          type: string
          example: '3380.00'
    AutoCloseLeg:
      type: object
      description: A single take-profit or stop-loss leg of an auto-close configuration.
      properties:
        trigger_price:
          type: string
          description: Price that triggers the leg, human-unit decimal string.
          example: '3600.00'
        price:
          type: string
          description: Limit price used once triggered, human-unit decimal string.
          example: '3595.00'
        order_type:
          type: string
          enum:
          - market
          - limit
        valid_to:
          type: integer
          format: int64
          nullable: true
          description: Expiry as a unix timestamp in seconds; null means good-till-cancel.
          example: 1780000000
    AutoCloseConfig:
      type: object
      description: Attached take-profit / stop-loss configuration for a position.
      properties:
        take_profit:
          allOf:
          - $ref: '#/components/schemas/AutoCloseLeg'
          nullable: true
          description: Take-profit leg, or null if none.
        stop_loss:
          allOf:
          - $ref: '#/components/schemas/AutoCloseLeg'
          nullable: true
          description: Stop-loss leg, or null if none.
    Venue:
      type: string
      description: The exchange a position lives on. One value today; the field exists so a position
        id stays unambiguous when a second venue appears.
      enum:
      - lighter
    PositionAutoCloseLeg:
      type: object
      description: >-
        One take-profit or stop-loss leg, with what it would do to the position if it fired. The
        projection is a property of the trigger price rather than of the leg's size: it says what the
        position is worth at that price, whether the leg closes all of it or part.
      properties:
        order_index:
          type: integer
          format: int64
          description: >-
            Lighter's own number for the order, assigned when it entered the book. A cancel or a
            modify is addressed by `market_index` plus this, so a client that edits the leg needs it.
          example: 281474976712114
        client_order_index:
          type: integer
          format: int64
          description: >-
            The number whoever created the order chose for it: Lighter stores and echoes it back,
            and never assigns one itself. Meaningful only to that creator -- nothing makes it unique
            between clients, and it cannot address the order. Match a leg to your own record of
            placing it, and treat it as opaque otherwise.
          example: 1756280400123
        trigger_price:
          type: string
          description: Price that fires the leg.
          example: '68141.70'
        price:
          type: string
          description: >-
            The price Lighter carries alongside the trigger. A leg of type market carries one too --
            a live take-profit triggering at 78030.7 came with 75765.6 -- so this is not empty just
            because the close is a market one.
          example: '75765.6'
        order_type:
          $ref: '#/components/schemas/OrderType'
        valid_to:
          type: integer
          format: int64
          nullable: true
          description: Expiry as a unix timestamp in seconds; null means good-till-cancel.
          example: 1780000000
        base_size:
          type: string
          description: How much of the traded asset the leg closes.
          example: '0.008164'
        share_pct:
          type: string
          description: The same size as a share of the position, in percentage points. Empty when the
            position size cannot be divided by.
          example: '100'
        projected_equity:
          type: string
          description: What the position would be worth at the trigger price, in quote units. Empty
            when the entry price or the size is missing.
          example: '32.24'
        projected_roi_pct:
          type: string
          description: The same outcome on the base of the position's roi_pct, the margin at entry,
            in percentage points cut toward zero. A trigger at the price the position is counted
            at projects its roi_pct. Empty when the leverage cannot be derived.
          example: '60.93'
    PositionAutoClose:
      type: object
      description: The take-profit and stop-loss legs attached to a position. A leg is null when the
        position has none of that kind.
      properties:
        take_profit:
          allOf:
          - $ref: '#/components/schemas/PositionAutoCloseLeg'
          nullable: true
        stop_loss:
          allOf:
          - $ref: '#/components/schemas/PositionAutoCloseLeg'
          nullable: true
    OpenPositionDetail:
      type: object
      description: One open position and the auto-close legs attached to it.
      properties:
        position:
          $ref: '#/components/schemas/OpenPosition'
        auto_close_known:
          type: boolean
          description: >-
            Whether the legs were read. False means they were not: the wallet has stored no read-only
            token, the stored one expired, or it could not be decrypted. A client must not read a
            null auto_close as "none" while this is false -- offering to set a take-profit over an
            existing one would replace it.
        auto_close:
          allOf:
          - $ref: '#/components/schemas/PositionAutoClose'
          nullable: true
          description: The legs, or null when there are none -- or when auto_close_known is false.
    OpenPositionsPage:
      type: object
      description: The caller's open positions. An object rather than a bare array so aggregates or
        a cursor can be added later without breaking clients.
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
    OpenPosition:
      type: object
      description: >-
        One open position, carrying the numbers a position card renders. Money is in quote units
        (USDC) and sizes are in the traded asset, both as human-unit decimal strings. Percentages
        are decimal strings in percentage points: "-3.02" means -3.02 %.
      properties:
        id:
          type: string
          description: >-
            Identifies the position for the detail endpoint. Opaque -- read it from here and hand it
            back, do not parse it. A position has no id of its own on Lighter: it is keyed by account
            and market, and the account is the one the wallet proved, so this is composed here. It
            names the slot rather than the episode: closing and reopening the same market returns
            the same id.
          example: lighter:1
        venue:
          $ref: '#/components/schemas/Venue'
        market_index:
          type: integer
          description: The venue's own market number. Redundant with part of `id`, and kept because
            the trading screen is addressed by it.
        symbol:
          type: string
          example: BTC
        side:
          $ref: '#/components/schemas/PositionSide'
        size:
          type: string
          description: Unsigned position size in the traded asset.
          example: '0.008164'
        position_value:
          type: string
          description: Notional value of the position in quote units.
          example: '540.00'
        avg_entry_price:
          type: string
          example: '66541.70'
        mark_price:
          type: string
          description: From the markets snapshot, not from the position -- a position carries no
            price of its own. Empty when that snapshot is unavailable.
          example: '66141.70'
        liquidation_price:
          type: string
          description: Zero on a position with no leverage, which is a value rather than a gap.
          example: '64141.75'
        liquidation_distance_pct:
          type: string
          description: How far the liquidation price sits from the mark price, in percentage points.
            Empty when either price is zero.
          example: '-3.02'
        margin:
          type: string
          description: >-
            Margin backing the position, in quote units. Lighter allocates margin per position only
            in isolated mode; in cross mode it reports zero there, and this is derived from the
            notional and the initial margin fraction instead.
          example: '19.98'
        equity:
          type: string
          description: Margin plus the unrealized result -- what the position is worth to the holder
            right now. Derived here so every client shows the same number.
          example: '16.71'
        unrealized_pnl:
          type: string
          description: >-
            Lighter's own, at the mark price, except on RWA markets. There it is counted here at
            the mid of the book, (entry - mid) x size for a short and the other way round for a
            long, as Lighter shows it: an RWA mark can sit away from the book. When the book is
            unavailable an RWA position falls back to Lighter's figure.
          example: '-3.27'
        realized_pnl:
          type: string
          description: Accumulated from partial closes on this position.
          example: '0.00'
        roi_pct:
          type: string
          description: >-
            unrealized_pnl against the margin at entry, size x avg_entry_price / leverage, in
            percentage points cut toward zero to two decimals, as Lighter shows it. Not against
            margin: that one moves with the mark price. Funding is not in the numerator: Lighter has
            already folded it into the margin balance. Empty when the leverage cannot be derived.
          example: '-16.25'
        leverage:
          type: integer
          description: Derived from the initial margin fraction. Zero means it could not be derived,
            never that the position is unleveraged -- no leverage is 1.
          example: 27
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        funding_paid:
          type: string
          nullable: true
          description: Funding accumulated over the life of the position, signed -- positive was received,
            negative was paid. Summed from this service's own record of the settlements, so one it never
            received is missing from it; null when there is no record of the position at all.
          example: '-0.000566'
        open_order_count:
          type: integer
          description: Orders resting on this market, take-profit and stop-loss legs among them. Zero
            means the detail endpoint has no orders to add.
          example: 2
    Position:
      type: object
      description: An open position in a single market.
      properties:
        market_index:
          type: integer
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/PositionSide'
        size:
          type: string
          description: Unsigned position size in base units, human-unit decimal string.
          example: '2.5000'
        avg_entry_price:
          type: string
          example: '3380.20'
        mark_price:
          type: string
          example: '3421.72'
        position_value:
          type: string
          description: Current notional value of the position in quote units.
          example: '8554.30'
        unrealized_pnl:
          type: string
          example: '103.80'
        realized_pnl:
          type: string
          example: '42.11'
        liquidation_price:
          type: string
          example: '2980.00'
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        allocated_margin:
          type: string
          description: Margin allocated to this position in quote units.
          example: '1710.86'
        leverage:
          type: integer
        funding_paid:
          type: string
          nullable: true
          description: Funding accumulated over the life of the position, signed -- positive was received,
            negative was paid. Summed from this service's own record of the settlements, so one it never
            received is missing from it; null when there is no record of the position at all.
          example: '-1.24'
        auto_close:
          allOf:
          - $ref: '#/components/schemas/AutoCloseConfig'
          nullable: true
          description: Attached TP/SL configuration, or null if none.
        open_order_count:
          type: integer
    PositionState:
      type: object
      description: >-
        The state of one market for the caller: the position it holds, the one that ended last, and
        what the venue said about the orders a client order index names.
      required:
      - market_index
      - open
      - last_closed
      - orders
      properties:
        market_index:
          type: integer
          description: >-
            The market the id named. No symbol here on purpose: naming it means reading the venue's
            market list, and this endpoint is meant to be polled without touching the venue at all.
          example: 1
        open:
          allOf:
          - $ref: '#/components/schemas/PositionEpisode'
          nullable: true
          description: >-
            The position this market holds now, or null when it holds none. There is no separate
            status field: null is the whole answer, and two ways to say it would let them disagree.
            Always present, null included, so a decoder that distinguishes an absent key from a null
            one does not have to.
        last_closed:
          allOf:
          - $ref: '#/components/schemas/PositionEpisode'
          nullable: true
          description: >-
            The episode that ended most recently, or null if none ever did. What tells a client that
            watched a position that it closed, rather than that it never existed.
        orders:
          type: array
          description: >-
            Newest first, and capped. Empty without the client_order_index parameter, and empty
            while no event has arrived for it yet.
          items:
            $ref: '#/components/schemas/PositionStateOrder'
    PositionEpisode:
      type: object
      description: One life of a position on one market, from the fill that opened it to the one that closed it.
      required:
      - episode_id
      - side
      - opened_at
      - open_seen
      - closed_at
      - close_reason
      properties:
        episode_id:
          type: string
          description: >-
            Lighter's trade id of the fill that opened the episode, which is also its identity.
            Opaque; a string because it is an identifier and not a number to do arithmetic on.
          example: '29800309063'
        side:
          $ref: '#/components/schemas/PositionSide'
        opened_at:
          type: string
          format: date-time
          description: When the opening fill traded, in the venue's own time.
          example: '2026-09-08T18:50:14Z'
        open_seen:
          type: boolean
          description: >-
            false when this service adopted the episode mid-flight: the first fill it saw already
            found a position, so opened_at is that fill's time and not when the position opened. A
            client should not present it as an opening time when this is false.
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the episode is open.
        close_reason:
          type: string
          nullable: true
          description: >-
            What ended it. `fill` is an ordinary close and `liquidation` a fill the venue marked as
            one. `event` is every close with no fill of ours behind it -- an auto-deleverage, or one
            whose fill this service never saw: the venue reported the position gone without saying
            why, and this does not claim to know either. Treat the set as open-ended; a later
            release may name a reason `event` covers today.
          enum:
          - fill
          - liquidation
          - event
    PositionStateOrder:
      type: object
      description: What the venue said about one order, as this service recorded it.
      required:
      - order_index
      - status
      properties:
        order_index:
          type: integer
          format: int64
          description: Lighter's own number for the order. A cancel or a modify is addressed by `market_index` plus this.
          example: 844421542005799
        kind:
          type: string
          description: The venue's own word for what kind of order it was, e.g. `market`, `take-profit`, `stop-loss`, `liquidation`.
          example: market
        status:
          type: string
          description: >-
            The venue's own word, passed through unmapped -- Lighter does not document the set of
            values it uses, and mapping them by guess would report a state nobody established. An
            order still working carries something other than `filled` or `canceled`.
          example: filled
        filled_base:
          type: string
          description: What the venue says was filled, in base units. Zero for an order still resting in the book.
          example: '0.00014'
        reduce_only:
          type: boolean
          description: True for a closing order, which is how a close is told from an open before any fill lands.
        recorded_at:
          type: string
          format: date-time
          description: >-
            This service's own clock: when the order was first written here, not when the venue
            created it. An order can rest in the book for twenty minutes before an event brings it.
          example: '2026-09-08T19:45:02Z'
    OrderFees:
      type: object
      description: Fee breakdown for an order, all human-unit decimal strings.
      properties:
        taker:
          type: string
          example: '0.42'
        integrator:
          type: string
          example: '0.10'
        total:
          type: string
          example: '0.52'
    Order:
      type: object
      description: A single order and its execution state.
      properties:
        id:
          type: string
          description: >-
            Identifies the order for the detail endpoint. Opaque -- read it from here and hand it
            back, do not parse it. It names the venue and the venue's own order number.
          example: lighter:281474976712112
        order_index:
          type: integer
          format: int64
          description: >-
            Lighter's own number for the order, assigned when it entered the book. A cancel or a
            modify is addressed by `market_index` plus this.
          example: 84512377281
        client_order_index:
          type: integer
          format: int64
          description: >-
            The number whoever created the order chose for it: Lighter stores and echoes it back,
            and never assigns one itself. Zero means nobody chose one -- it is a real value in the
            payload rather than an absent field. Match an order to your own record of placing it,
            and treat it as opaque otherwise.
          example: 1756280400123
        market_index:
          type: integer
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        category:
          $ref: '#/components/schemas/OrderCategory'
        base_size:
          type: string
          description: Order size in base units, human-unit decimal string.
          example: '2.5000'
        price:
          type: string
          description: Order limit price (empty/ignored for market orders).
          example: '3380.20'
        filled_base:
          type: string
          description: Filled amount in base units.
          example: '1.0000'
        filled_quote:
          type: string
          description: Filled amount in quote units.
          example: '3380.20'
        avg_fill_price:
          type: string
          nullable: true
          example: '3380.20'
        trigger_price:
          type: string
          nullable: true
          description: Trigger price for conditional orders, null otherwise.
          example: '3600.00'
        reduce_only:
          type: boolean
        time_in_force:
          $ref: '#/components/schemas/TimeInForce'
        created_at:
          type: string
          format: date-time
          example: '2026-07-04T12:20:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-04T12:41:03Z'
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-05T12:20:00Z'
        pnl:
          type: string
          nullable: true
          description: Realized PnL attributed to this order (close orders), null otherwise.
          example: '42.11'
        roi:
          type: string
          nullable: true
          description: Return on investment as a decimal string, null if not applicable.
          example: '0.0124'
        fees:
          allOf:
          - $ref: '#/components/schemas/OrderFees'
          nullable: true
          description: >-
            Fee breakdown, null if not yet known. Always null today: nothing populates it, so a client
            must not rely on it. Lighter reports per-order fees and this service does not map them yet.
        sort_ts:
          type: string
          format: date-time
          description: Sort timestamp used for keyset pagination and poll ranking.
          example: '2026-07-04T12:41:03Z'
    Balance:
      type: object
      description: Account-level balance summary, all human-unit decimal strings.
      properties:
        currency:
          type: string
        equity:
          type: string
          example: '1865.89'
        available_balance:
          type: string
          description: Collateral not used as margin by open positions and not reserved by resting
            orders.
          example: '980.15'
        transferable_balance:
          type: string
          description: What can be withdrawn. Lighter reports no separate figure, so it equals
            available_balance.
          example: '980.15'
        unrealized_pnl_total:
          type: string
          example: '103.80'
        collateral:
          type: string
          example: '1762.09'
    TradingFlags:
      type: object
      description: Per-account capability flags gating trading actions in the UI.
      properties:
        open_enabled:
          type: boolean
        close_enabled:
          type: boolean
        cancel_enabled:
          type: boolean
        add_margin_enabled:
          type: boolean
        remove_margin_enabled:
          type: boolean
        auto_close_enabled:
          type: boolean
    ActivityItem:
      type: object
      description: A single item in the account activity feed. Most fields are nullable because their
        relevance depends on the item type.
      properties:
        id:
          type: string
          description: Stable within the feed, not a resource id. For a deposit it is the lowercased
            Ethereum transaction hash, which is what keeps one deposit one item from pending through
            credited; other types carry Lighter's own id for the record behind them.
          example: act_9f1a2b3c
        type:
          $ref: '#/components/schemas/ActivityType'
        timestamp:
          type: string
          format: date-time
          description: When the event happened. A deposit is timestamped by when it was registered
            while this service is the only record of it, and by when the money landed once Lighter
            has it -- so a deposit item can move in the feed while keeping its id.
          example: '2026-07-04T12:41:03Z'
        market_index:
          type: integer
          nullable: true
        symbol:
          type: string
          nullable: true
        side:
          allOf:
          - $ref: '#/components/schemas/OrderSide'
          nullable: true
          description: Side for trade-like items, null otherwise.
        size:
          type: string
          nullable: true
          description: Base size for trade-like items.
          example: '1.0000'
        price:
          type: string
          nullable: true
          example: '3380.20'
        amount:
          type: string
          nullable: true
          description: Quote amount for deposit/withdrawal items.
          example: '500.00'
        realized_pnl:
          type: string
          nullable: true
          example: '42.11'
        fee:
          type: string
          nullable: true
          example: '0.52'
        tx_hash:
          type: string
          nullable: true
          example: '0x9a3f1c2b7e5d4a6f8c0b1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d'
        funding:
          type: string
          nullable: true
          description: >-
            The position's total funding from its opening up to this fill, signed: positive was
            received, negative was paid. Set only on the fill or liquidation that closed the position
            or flipped its side; null on every other item, a partial close among them, since the
            position is still open and its funding is on it. Also null when this service has no record
            of the position. Summed from this service's own record of the settlements, so one it never
            received is missing from it.
          example: '-1.24'
        status:
          type: string
          nullable: true
          description: Free-form status label appropriate to the item type. For a deposit it is this
            service's own pending or credited while it is the only record of it, and Lighter's own word
            for the deposit once Lighter has it. The two vocabularies are deliberately not merged --
            Lighter does not document the set of values it uses, and mapping them by guess would report
            a state nobody established.
        sort_ts:
          type: string
          format: date-time
          description: Sort timestamp used for keyset pagination and poll ranking.
          example: '2026-07-04T12:41:03Z'
    TradingScreen:
      type: object
      description: >-
        Perps asset details payload for a single market. Only open_orders needs a read-only token, and
        this service reads it from its own store rather than from the caller: the position, its PnL and
        the balance all come from the account snapshot, which Lighter serves by account index and which
        needs no token. Without a usable token open_orders is empty, and two fields derived from it go
        with it -- flags.cancel_enabled is false and position.auto_close is null, since the TP/SL legs
        are themselves open orders.
      properties:
        type:
          $ref: '#/components/schemas/AssetDetailsType'
        market:
          $ref: '#/components/schemas/Market'
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          nullable: true
          description: Caller's position in this market, or null if none.
        open_orders:
          type: array
          description: Caller's open orders in this market (empty without a usable stored token).
          items:
            $ref: '#/components/schemas/Order'
        balance:
          $ref: '#/components/schemas/Balance'
        leverage:
          type: integer
          description: >-
            Caller's leverage on this market, with or without a position. Lighter keeps it after a
            position closes. When the account never set it, and when there is no account, this is
            the market default.
          example: 20
        margin_mode:
          allOf:
          - $ref: '#/components/schemas/MarginMode'
          description: Caller's margin mode on this market, with the same fallback as leverage; the
            default is cross.
        flags:
          $ref: '#/components/schemas/TradingFlags'
    PortfolioScreen:
      type: object
      description: Payload for the portfolio screen.
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    Portfolio:
      type: object
      description: >-
        Balance, open positions and resting orders in one payload. The two sections are
        independent: a position is what the account holds, an order is what it is waiting for.
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
        open_orders:
          type: array
          description: >-
            Orders resting on the book, across every market. Take-profit and stop-loss legs are not
            among them.
          items:
            $ref: '#/components/schemas/Order'
    OpenOrdersPage:
      type: object
      description: The caller's resting orders. An object rather than a bare array so aggregates or
        a cursor can be added later without breaking clients.
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    OrderDetail:
      type: object
      description: One order and the trades it produced.
      properties:
        order:
          $ref: '#/components/schemas/Order'
        resting:
          type: boolean
          description: True when the order is still on the book, false when it was found in history.
          example: false
        fills:
          type: array
          description: The trades this order took part in, newest first. Empty when it never traded,
            and also when fills_known is false.
          items:
            $ref: '#/components/schemas/OrderFill'
        fills_known:
          type: boolean
          description: >-
            Whether the fills were read in full. False when the lookup failed and when its page cap
            ended it early; `fills` is then empty rather than partial. The order is the answer
            without them, so neither fails the request.
          example: true
    OrderFill:
      type: object
      description: One trade an order took part in. Money is in quote units, sizes in the traded asset.
      properties:
        trade_id:
          type: integer
          format: int64
          description: The venue's own number for the trade.
          example: 1043773
        size:
          type: string
          example: '0.00014'
        price:
          type: string
          example: '77771.30'
        quote_amount:
          type: string
          description: What the trade was worth in quote units.
          example: '10.89'
        is_maker:
          type: boolean
          description: True when this order sat in the book and the other side took it.
          example: false
        tx_hash:
          type: string
          description: >-
            The hash of the transaction that produced the trade, which is the taker's order
            submission. Occasionally a placeholder on the venue's side.
          example: '0x8f2c...'
        traded_at:
          type: string
          format: date-time
          example: '2026-09-18T12:41:03Z'
    ActivityPage:
      type: object
      description: A page of the account activity feed.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page.
          example: eyJvZmZzZXQiOjQwfQ==
        last_sort_ts:
          type: string
          format: date-time
          nullable: true
          description: Max sort timestamp across the filtered set, for poll ranking-shift detection.
          example: '2026-07-04T12:41:03Z'
    OpenDepositRequest:
      type: object
      required:
      - operation_id
      - asset_id
      - amount
      properties:
        operation_id:
          type: string
          maxLength: 128
          description: >-
            Opaque client-side identifier for this deposit attempt, never parsed here. Retrying the
            same attempt must reuse it — that is what makes this call idempotent — and a genuinely
            new deposit must carry a new one. Reusing it with a different amount is a conflict, not
            an update.

            A write key only. Progress is read by deposit_id, and this value is not a lookup key:
            recording the same transaction or the same execution_id under a second operation_id
            returns the record created under the first one, keeping the first one's value.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        asset_id:
          type: string
          maxLength: 128
          description: >-
            Where the funds started, in the swap backend's own asset id form. Opaque here: kept as a
            record and never resolved, because what arrives at Lighter is USDC on Ethereum whichever
            chain the money came from.
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: >-
            What was sent, as a decimal string, at most 6 decimal places and not below the gateway's
            1 USDC floor — less than that is accepted by the contract and then never credited. Kept
            as declared: Lighter records only what arrives, so this is the only copy of what was
            meant, and "expected N, got M" can be answered from nowhere else.
          example: '25'
        execution_id:
          type: string
          maxLength: 128
          description: >-
            The swap this deposit is funded by: tracking.execution_id from POST /funding/quote.
            Required when l1_tx_hash is absent. Send it before broadcasting the source transaction:
            this service follows the swap by it, takes the Ethereum hash once the aggregator delivers,
            and confirms the deposit by that hash from then on. A swap that fails, is refunded or is
            never paid closes the deposit as failed, refunded or expired. While this service cannot
            reach swaps-backend by configuration, a deposit named by execution_id alone is refused
            with 503 rather than recorded and left to expire.

            A `funxyz` quote's execution_id is followed at Lighter's bridge instead, and is accepted only
            as a quote handed it out, within a day, for the address this wallet bound -- anything else is
            400 invalid_execution_id. One transfer to the deposit address credits one deposit.

            One execution funds one deposit per address, so sending it again under another
            operation_id returns the deposit it already names.
          example: 26176e1a-d5aa-4b00-b4b3-4af2e1d904cc
        l1_tx_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          description: >-
            The Ethereum transaction that called Lighter's gateway. Required when execution_id is
            absent, which is a direct deposit: the wallet signs the gateway call itself and knows
            its hash before broadcasting. Lighter resolves it to the credit, the amount and the
            account index, without a read-only token, which a first deposit could not have anyway
            since the account does not exist yet.

            Only the Ethereum hash counts, never a source-chain one: Lighter has never seen those.
            A deposit paid from another chain sends execution_id instead and may leave this out.
            Omitting both is 400 deposit_reference_required.
          example: '0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380'
    Deposit:
      type: object
      description: One recorded deposit.
      properties:
        deposit_id:
          type: string
          description: >-
            Identifies this deposit when polling its progress. A random UUID, so it cannot be guessed
            from an address or a sequence, but it is not what authorises the poll -- that is the
            wallet the deposit belongs to, see the GET operation. Worth persisting alongside whatever
            the client calls the attempt, and not fatal to lose, since posting the same transaction
            again returns the same id rather than a second deposit.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        status:
          type: string
          enum: [pending, credited, unfunded, failed, refunded, expired]
          description: >-
            pending until the deposit ends; every other value is final.

            - credited: Lighter credited the funds.
            - unfunded: nothing was confirmed within the waiting window, or the transaction credited
              another address.
            - failed: a deposit recorded by execution whose swap failed.
            - refunded: a deposit recorded by execution whose swap the aggregator refunded to the
              sender. GET /funding/status/{execution_id} has the aggregator's own words.
            - expired: a deposit recorded by execution whose source transaction was never seen within
              ten minutes of recording, or whose execution swaps-backend closed unpaid.

            None of the final values but credited appears in /activity. unfunded means the deposit was not confirmed while it was being watched, which is not
            quite the same as the money never arriving: what arrives is Lighter's to say and this
            record only tracks it. A deposit credited after the window is not noticed, so an unfunded
            record is where such a deposit stays. Treat it as "we did not see it", not as proof of
            loss, and check the account balance before telling anyone their money is gone.
          example: pending
        asset_id:
          type: string
          description: The network and token the funds were sent as; echoed from the request.
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: What the caller declared, echoed back. Compare with credited_amount.
          example: '25'
        credited_amount:
          type: string
          description: >-
            What Lighter actually credited, once it has. Absent while the deposit is pending, and also
            on the rare credit confirmed without an amount — where the only signal was an account
            appearing, which proves an arrival but not its size.
          example: '24.970000'
        l1_tx_hash:
          type: string
          description: >-
            The Ethereum transaction this deposit is confirmed by. Echoed back when the request
            named it; for a deposit recorded by execution_id, absent until the aggregator delivers.
          example: '0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380'
        account_index:
          type: integer
          format: int64
          description: >-
            The Lighter account the deposit belongs to. Absent until the account exists, which for a
            first deposit is until it is credited — that deposit is what creates it.
          example: 736568
        created_at:
          type: string
          format: date-time
          description: When the deposit was recorded here.
        closed_at:
          type: string
          format: date-time
          description: When it stopped being pending. Absent while it still is.
    OrderBookLevel:
      type: object
      required:
      - price
      - size
      properties:
        price:
          type: string
          example: '65000.10'
        size:
          type: string
          description: Size in base units at that price.
          example: '0.5'
    TruncatedOrderBook:
      type: object
      required:
      - updated_at
      - truncated
      properties:
        updated_at:
          type: string
          format: date-time
          description: When the book this was cut from was last updated upstream.
        truncated:
          type: boolean
          description: >-
            Whether the notional was reached. False means the levels returned are the whole book and
            they still did not cover it.
        bids:
          type: array
          description: Present for side=sell. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        asks:
          type: array
          description: Present for side=buy. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'

    DepositQuoteRequest:
      type: object
      required:
      - source_asset
      - source_amount
      - sender_address
      - destination_address
      properties:
        source_asset:
          type: string
          maxLength: 128
          description: >-
            What the caller pays with, as `<chain>/mainnet/coin` for a chain's own coin or
            `<chain>/mainnet/erc20/<address>` for a token -- `bep20` in place of `erc20` on bsc, and
            `trc20/<base58 address>` on tron. Chains quoted today: ton, eth, bsc, base, arb, polygon, avax,
            robinhood, tron, and btc for its coin alone. Anything else answers 400 unsupported_source_asset.
          example: ton/mainnet/coin
        source_amount:
          type: string
          pattern: '^[1-9][0-9]{0,77}$'
          description: >-
            How much of source_asset the caller is willing to spend, in the asset's smallest unit
            (nanoton, wei, the token's own decimals). The payloads never ask for more than this.
          example: '25000000000'
        sender_address:
          type: string
          maxLength: 128
          description: >-
            The address on the source chain the payloads are sent from, in that chain's own form. It is
            also where a failed fill is refunded to.
          example: UQARERERERERERERERERERERERERERERERERERERERERERbvW
        destination_address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: >-
            The Ethereum address whose Lighter account is credited. Must be the L1 address this wallet has
            proved, once it has proved one; a first deposit is quoted for the address it names.
          example: '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984'
        change_pub_key:
          $ref: '#/components/schemas/ChangePubKey'
        operation:
          $ref: '#/components/schemas/SignedOperation'
    ChangePubKey:
      type: object
      description: >-
        Register the account's L2 signing key in the same cross-chain action as the deposit, so a
        wallet holding no ETH never pays for the call itself.

        Lighter's changePubKey takes the caller for the account owner, and the deposit is filled by
        the aggregator's own solver. EIP-7702 is what gets round that: an authorization delegates the
        owner's Ethereum address to a delegate contract for that one fill, the solver carries it in
        the fill transaction, and the last call goes into the owner's address, where changePubKey
        sees the owner as its caller. The solver is not the owner, so the delegate runs that call
        only with the owner's signature over it, an Execute. Nothing extra is broadcast by the
        client -- both signatures travel with the quote.

        On a route the aggregator fills, change_pub_key alone answers a preview whose operation is the
        two signatures to make; they come back as the request's signed `operation`, beside the same
        change_pub_key -- see POST /funding/quote. A source that is already USDC on Ethereum is sent by
        the wallet itself, which is the owner already: there the registration is the third call of the
        one EIP-7702 batch transaction -- approve, deposit, then changePubKey into the gateway -- run as
        sender_address calling itself, so it takes no signed `operation` (the batch's own
        `authorization`, signed when the transaction is sent, delegates the address), and the quote is
        the one to send at once. sender_address must then be destination_address, since changePubKey
        runs as the sender. Sending a signed operation there, or a sender that is not the destination,
        is 400; a sender that cannot run the batch -- a contract -- gets no quote rather than one
        without the key.

        Works for the deposit that creates the account too. Lighter's deposit assigns the account
        index on L1 as it runs, and account_index 281474976710655 (NIL_ACCOUNT_INDEX, 2^48 - 1) makes
        changePubKey resolve it to the caller's own account when the call runs -- so the first
        deposit and its key are one action, and the client never needs to know the index.

        Only the deposit that creates the account registers a key. On an account that exists --
        Lighter knows one for destination_address, or the wallet's binding names it -- change_pub_key
        is dropped, with any signed `operation` beside it, and the answer is the plain deposit's quote:
        `preview: false`, `account_uninitialized: false`. So a client may always send it; nothing is
        registered, signed or paid for on an account that has one. Whether the account exists is
        asked of Lighter before the aggregator, and a Lighter that does not answer makes the quote 503,
        to retry, rather than a guess either way.
      required:
      - account_index
      - api_key_index
      - pub_key
      properties:
        account_index:
          type: integer
          format: int64
          minimum: 1
          maximum: 281474976710655
          description: >-
            The Lighter account the key goes on. 281474976710655 (NIL_ACCOUNT_INDEX) is the caller's
            own account, resolved on chain -- the one to send, and the only one a first deposit can
            name. An explicit index names an account that exists, so the registration is dropped (see
            above); on an address with no account yet it is 400 change_pub_key_needs_account.
          example: 281474976710655
        api_key_index:
          type: integer
          minimum: 0
          maximum: 254
          description: The slot the key goes into. 255 is Lighter's "all keys" sentinel, not a slot.
          example: 1
        pub_key:
          type: string
          pattern: '^0x[0-9a-fA-F]{80}$'
          description: The L2 public key to register, 40 bytes.
          example: '0x11223344556677889900aabbccddeeff00112233445566778899aabbccddeeff0011223344556677'
    HermesExecuteTypedData:
      type: object
      description: >-
        The delegate's Execute as EIP-712 typed data, as the shared payload format writes it: `types`
        holds Call and Execute, the domain's own type being implied by `domain`'s fields (name,
        version, chainId, verifyingContract, salt). The one call is changePubKey(account_index,
        api_key_index, pub_key) into Lighter's gateway, with the request's values. uint256 values are
        decimal strings.
      required:
      - types
      - primaryType
      - domain
      - message
      properties:
        types:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/EIP712TypeField'
        primaryType:
          type: string
          example: Execute
        domain:
          $ref: '#/components/schemas/HermesExecuteDomain'
        message:
          $ref: '#/components/schemas/HermesExecuteMessage'
    EIP712TypeField:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
    HermesExecuteDomain:
      type: object
      required:
      - name
      - version
      - chainId
      - verifyingContract
      - salt
      properties:
        name:
          type: string
          example: Hermes
        version:
          type: string
          example: v1.0.0
        chainId:
          type: integer
          format: int64
          example: 1
        verifyingContract:
          type: string
          description: destination_address.
          example: '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984'
        salt:
          type: string
          description: The delegate, left-padded to 32 bytes.
          example: '0x00000000000000000000000024b576bc271823bf9c24be627b4363b9b00191e9'
    HermesExecuteMessage:
      type: object
      required:
      - mode
      - calls
      - nonce
      - deadline
      properties:
        mode:
          type: string
          example: '0x0100000000007821000100000000000000000000000000000000000000000000'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/HermesExecuteCall'
        nonce:
          type: string
          example: '0'
        deadline:
          type: string
          example: '1790000000'
    HermesExecuteCall:
      type: object
      required:
      - target
      - value
      - data
      properties:
        target:
          type: string
          example: '0x3b4d794a66304f130a4db8f2551b0070dfcf5ca7'
        value:
          type: string
          example: '0'
        data:
          type: string
          description: changePubKey(uint48,uint8,bytes) calldata.
    SignedOperation:
      x-operation-result: true
      type: object
      description: >-
        A change_pub_key preview's operation, signed, in the shared Response Signed Payloads format.
        Only with change_pub_key, and only on a route the aggregator fills. Every payload of the
        preview's operation comes back, each once: both, or the Execute alone from Ethereum.
      required:
      - id
      - payloads
      properties:
        id:
          type: string
          description: The preview operation's id, as it was given.
          example: 0c9b7f0a-4c3e-4a52-8f61-2d7c0a5e9b34
        payloads:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/SignedPayload'
    SignedPayload:
      type: object
      description: >-
        One payload, signed: `type` is the payload's own with `/signed` appended, `chain_id` and
        `version` the payload's, `payload_id` its id exactly as given.
      required:
      - type
      - chain_id
      - version
      - payload_id
      - meta
      properties:
        type:
          type: string
          enum: [eip7702/authorization/signed, eip7821/hermes/delegate/signed]
          example: eip7821/hermes/delegate/signed
        chain_id:
          type: string
          example: eth/mainnet
        version:
          type: integer
          example: 1
        payload_id:
          type: string
          example: 5b1f2c8e-7d4a-4e9b-9c3f-1a6e0d2b8f47.1790000000
        meta:
          $ref: '#/components/schemas/SignedPayloadMeta'
    SignedPayloadMeta:
      type: object
      required:
      - data
      properties:
        data:
          description: >-
            The signature: {y_parity, r, s} for `eip7702/authorization/signed`, r || s || v as 0x and
            130 hex characters for `eip7821/hermes/delegate/signed`.
          oneOf:
          - $ref: '#/components/schemas/AuthorizationSignature'
          - type: string
    AuthorizationSignature:
      type: object
      required:
      - y_parity
      - r
      - s
      properties:
        y_parity:
          type: integer
          minimum: 0
          maximum: 1
          example: 1
        r:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          example: '0xa6787cab3bf7675942f662114ca08898b266fc2eb562c4ab62aa4635aa4a256f'
        s:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          example: '0x47136f2b32ba8b9dcc391e5a2b3eb6409b906fe4587ec427f0e461a35078e7a5'
    DepositQuote:
      type: object
      required:
      - quote_id
      - provider
      - created_at
      - expires_at
      - input
      - output
      - operation
      - preview
      properties:
        quote_id:
          type: string
          description: Names this quote in logs and support. Not a lookup key.
          example: q_3f9c2b1e4a7d4f619c3a1b2d3e4f5a6b
        provider:
          type: string
          maxLength: 64
          description: >-
            Who fills the order. `relay` is the cross-chain aggregator; `direct` means the source asset
            is already USDC on Ethereum and the payloads call the gateway themselves; `funxyz` is
            Lighter's bridge, the payload a transfer to the destination's deposit address -- USDC on
            Arbitrum, Base or Polygon, and on Ethereum a top-up of an existing account of 5 USDC or more.

            Deliberately not an enum, and not to be switched on: a provider is added server-side without
            a spec change, and a client that has never heard of one still executes its quote, because
            what to sign is the payloads and each payload says its own kind. The value is for display,
            logs and support. Treat an unknown one as ordinary.
          example: relay
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Past this, ask again rather than sign.
        input:
          $ref: '#/components/schemas/DepositQuoteInput'
        output:
          $ref: '#/components/schemas/DepositQuoteOutput'
        slippage_bps:
          type: integer
          description: >-
            The slippage the quote allowed for, in basis points. It applies to the source side: the
            deposit itself is exact.
          example: 100
        operation:
          $ref: '#/components/schemas/DepositOperation'
        tracking:
          $ref: '#/components/schemas/QuoteTracking'
        preview:
          type: boolean
          description: >-
            True on a change_pub_key preview: the quote prices the deposit, and its operation is the two
            signatures to make (eip7702/authorization, eip7821/hermes/delegate) -- nothing to broadcast.
            They go back in change_pub_key of the same request, whose answer is the quote to send. False
            on every quote to send.
          example: false
        account_uninitialized:
          type: boolean
          description: >-
            True when Lighter knows no account for destination_address: this deposit is the one that
            creates it, and a key registered with it (change_pub_key, account_index
            281474976710655) is the account's first. False when the account exists -- and then a
            change_pub_key sent with the request was dropped. Absent when Lighter did not answer, or not
            in time -- a quote with change_pub_key is then 503 instead, since what is quoted depends on
            it.
        estimated_duration_seconds:
          type: integer
          format: int32
          minimum: 0
          description: >-
            About how long from sending the payloads until the money is on the Lighter account, in
            seconds. An estimate to show, not a deadline. Absent when there is none for this route.
          example: 120
    DepositQuoteInput:
      type: object
      description: >-
        What leaves, echoed from the request. Named like the output beside it -- the two sides of a
        quote describe the same three things, so they carry the same three field names.
      required:
      - asset_id
      - amount
      - address
      properties:
        asset_id:
          type: string
          description: What the caller pays with. The request's source_asset, echoed.
          example: ton/mainnet/coin
        amount:
          type: string
          description: >-
            The budget, in the source asset's smallest unit. The request's source_amount, echoed; the
            payloads never ask for more than this and rarely spend it to the last unit.
          example: '25000000000'
        address:
          type: string
          description: The address on the source chain the payloads are sent from, and where a failed fill is refunded.
          example: UQARERERERERERERERERERERERERERERERERERERERERERbvW
    DepositQuoteOutput:
      type: object
      description: What arrives, in the same three names the input uses, plus the floor under the amount.
      required:
      - asset_id
      - amount
      - min_amount
      - address
      properties:
        asset_id:
          type: string
          description: What arrives, always USDC on Ethereum.
          example: eth/mainnet/erc20/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        amount:
          type: string
          description: What is deposited, in USDC's smallest unit (6 decimals).
          example: '34746294'
        min_amount:
          type: string
          description: 'Equal to amount: the deposit is exact.'
          example: '34746294'
        address:
          type: string
          description: The Ethereum address whose Lighter account is credited. The request's destination_address, echoed.
          example: '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984'
    WithdrawQuoteRequest:
      type: object
      required:
      - destination_asset
      - amount
      - recipient_address
      properties:
        destination_asset:
          type: string
          maxLength: 128
          description: >-
            What the caller receives, as `<chain>/mainnet/coin` for a chain's own coin or
            `<chain>/mainnet/erc20/<address>` for a token -- `bep20` on bsc, `trc20/<base58 address>` on
            tron. Chains quoted today: ton, eth, bsc, base, arb, polygon, avax, robinhood, tron and btc.
            Anything else answers 400 unsupported_destination_asset.
          example: ton/mainnet/coin
        amount:
          type: string
          pattern: '^[1-9][0-9]{0,77}$'
          description: >-
            The budget in USDC's smallest unit (6 decimals): what leaves the Lighter account, Lighter's
            transfer fee included, is never more.
          example: '20000000'
        recipient_address:
          type: string
          maxLength: 128
          description: The wallet on destination_asset's chain that receives it.
          example: UQC1zHXDFDKegQmkRuPjT9G6mZ-9pDVp89zUWrXA3WfyqMJm
    WithdrawQuote:
      type: object
      required:
      - quote_id
      - provider
      - created_at
      - expires_at
      - input
      - output
      - operation
      properties:
        quote_id:
          type: string
          description: Names this quote in logs and support. Not a lookup key.
          example: q_3f9c2b1e4a7d4f619c3a1b2d3e4f5a6b
        provider:
          type: string
          maxLength: 64
          description: Who fills the order, for display and support; not to be switched on, as a deposit quote's is not.
          example: relay
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Past this, ask again rather than sign.
        input:
          $ref: '#/components/schemas/WithdrawQuoteInput'
        output:
          $ref: '#/components/schemas/WithdrawQuoteOutput'
        slippage_bps:
          type: integer
          description: The slippage the quote allowed for, in basis points; output.min_amount is what it leaves.
          example: 100
        operation:
          $ref: '#/components/schemas/DepositOperation'
        tracking:
          $ref: '#/components/schemas/QuoteTracking'
        estimated_duration_seconds:
          type: integer
          format: int32
          minimum: 0
          description: >-
            About how long from sending the Lighter transfer until the money is at output.address, in
            seconds. An estimate to show, not a deadline. Absent when there is none for this route.
          example: 60
    WithdrawQuoteInput:
      type: object
      description: What leaves the Lighter account, named as a deposit quote's input is.
      required:
      - asset_id
      - amount
      - account_index
      properties:
        asset_id:
          type: string
          description: The account's USDC collateral, named as USDC on Ethereum, as a deposit names what it credits.
          example: eth/mainnet/erc20/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        amount:
          type: string
          description: The budget, the request's amount echoed. The transfer plus Lighter's fee never exceed it.
          example: '20000000'
        account_index:
          type: integer
          format: int64
          description: The Lighter account the transfer is from -- the one the wallet's proved address owns.
          example: 744540
    WithdrawQuoteOutput:
      type: object
      description: What arrives, in the same names the input uses, plus the floor under the amount.
      required:
      - asset_id
      - amount
      - min_amount
      - address
      properties:
        asset_id:
          type: string
          description: The request's destination_asset, echoed.
          example: ton/mainnet/coin
        amount:
          type: string
          description: What is expected to arrive, in the destination asset's smallest unit.
          example: '13198411190'
        min_amount:
          type: string
          description: The least that arrives, the slippage allowed for taken off amount.
          example: '13066427078'
        address:
          type: string
          description: The wallet it arrives in. The request's recipient_address, echoed.
          example: UQC1zHXDFDKegQmkRuPjT9G6mZ-9pDVp89zUWrXA3WfyqMJm
    DepositOperation:
      x-operation: true
      type: object
      description: >-
        What the client signs to make a deposit or a withdrawal happen, as one operation: an id to
        refer to it by and the payloads in the order they are signed. On a change_pub_key preview
        (preview: true on the quote) the payloads are signatures only, nothing to broadcast.
      required:
      - id
      - payloads
      properties:
        id:
          type: string
          description: >-
            Names this operation. It is the id a later call refers the signed payloads back by, and it
            is this service's to mint -- not the operation_id a client sends to POST /funding/deposit,
            which is the client's own idempotency key for recording a deposit it has already sent.
          example: 0c9b7f0a-4c3e-4a52-8f61-2d7c0a5e9b34
        payloads:
          type: array
          description: What to sign and broadcast, in this order.
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotePayload'
    QuotePayload:
      type: object
      description: >-
        One thing to sign. `type` says what shape it is and `meta` carries that shape's fields; which
        shape to read is decided by `type` together with `chain_id`, because the same `main` means a
        TON message on ton/mainnet and a transaction on an EVM chain.

        `main` is what a deposit returns today, and `prebuild` on btc/mainnet. The wider vocabulary --
        `batch`, `eip7702/authorization`, `eip7821/hermes/delegate` -- belongs to the shared payload format,
        and a client that meets a type it does not know must refuse the operation rather than guess
        at its meta.
      required:
      - id
      - type
      - chain_id
      - version
      - meta
      properties:
        id:
          type: string
          description: >-
            Names this payload, a UUID minted per quote. It is what a signed payload is returned under;
            the order to sign in is the array's, not the id's.
          example: 5b1f2c8e-7d4a-4e9b-9c3f-1a6e0d2b8f47
        type:
          type: string
          description: >-
            The payload's shape. `main` is a plain transfer or call, the one a deposit is made of.
            `prebuild` is a transaction built here to be signed as it stands -- on btc/mainnet, a PSBT.
            `eip7702/authorization` is an EIP-7702 authorization to sign, and `eip7821/hermes/delegate`
            EIP-712 typed data to sign; both are signatures only, in a change_pub_key preview's
            operation.
          example: main
        chain_id:
          type: string
          description: The chain to broadcast on, as `<chain>/mainnet`. Read with `type` to know which meta this is.
          example: ton/mainnet
        version:
          type: integer
          description: >-
            The version of this type-and-chain pairing. It moves when the meta's fields change
            meaning, so a client can refuse a payload it was not built for instead of misreading it.
          example: 1
        fee:
          $ref: '#/components/schemas/PayloadFee'
        meta:
          description: >-
            The fields of the shape `type` and `chain_id` name: PayloadMetaTonMain for `main` on
            ton/mainnet, PayloadMetaEvmMain for `main` on an EVM chain, PayloadMetaTronMain on
            tron/mainnet, PayloadMetaBtcPrebuild for `prebuild` on btc/mainnet, PayloadMetaLighterTransfer on
            lighter/mainnet, PayloadMetaEip7702Authorization for `eip7702/authorization` and
            PayloadMetaHermesDelegate for `eip7821/hermes/delegate`.
          oneOf:
          - $ref: '#/components/schemas/PayloadMetaTonMain'
          - $ref: '#/components/schemas/PayloadMetaEvmMain'
          - $ref: '#/components/schemas/PayloadMetaTronMain'
          - $ref: '#/components/schemas/PayloadMetaBtcPrebuild'
          - $ref: '#/components/schemas/PayloadMetaLighterTransfer'
          - $ref: '#/components/schemas/PayloadMetaEip7702Authorization'
          - $ref: '#/components/schemas/PayloadMetaHermesDelegate'
    PayloadMetaEip7702Authorization:
      type: object
      description: >-
        An EIP-7702 authorization to sign, over keccak(0x05 | rlp([chainId, address, nonce])), with the
        key behind destination_address. Not a transaction, and not EIP-191 or EIP-712: a bare digest.
        `nonce` is the address's nonce on Ethereum when the preview was made -- the fill is the solver's
        transaction, so it is untouched by then, unless the owner sends one of its own in between. The
        delegation outlives the deposit: a client must say so before asking for the signature.
      required:
      - chainId
      - address
      - nonce
      properties:
        chainId:
          type: integer
          format: int64
          example: 1
        address:
          type: string
          description: The delegate, HermesDelegateV1.
          example: '0x24b576bc271823bf9c24be627b4363b9b00191e9'
        nonce:
          type: integer
          format: int64
          example: 0
    PayloadMetaHermesDelegate:
      type: object
      description: >-
        The delegate's Execute to sign as EIP-712 typed data with the key behind destination_address: it
        lets the solver run changePubKey through the delegated address. Its nonce is the owner's at the
        delegate's nonce manager, its deadline this service's.
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/HermesExecuteTypedData'
    PayloadMetaTonMain:
      type: object
      description: A TonConnect message. Sent as it stands; the send mode and bounce flag are part of what was quoted.
      required:
      - to
      - value
      properties:
        to:
          type: string
          description: The message's destination address.
          example: EQCrdGsDTqA2t6xRR4N6V4J705F7w_VQbUdHnofsh-8lVIPs
        value:
          type: string
          description: What the message carries, in nanoton.
          example: '25000000000'
        body:
          type: string
          description: The message body, a base64 BOC. Absent when the message carries none.
          example: te6cckEBAQEASAAAjAAAAAAweGYwNWExZmJj
        bounce:
          type: boolean
          example: false
        mode:
          type: integer
          description: >-
            The send mode to send with. Never one that spends more than value -- a quote whose mode
            carries the inbound message's value or the wallet's whole balance is refused here.
          example: 1
    PayloadMetaEvmMain:
      type: object
      description: >-
        One EVM transaction to sign and broadcast on the chain chain_id names.

        A token's approval and its payment come as one such transaction wherever they can be folded:
        on an EVM source chain where HermesDelegateV1 is deployed -- Ethereum, BSC, Arbitrum One, Base,
        Polygon and Robinhood Chain, at the one address 0x24b576bc271823bf9c24be627b4363b9b00191e9 -- for a sender_address
        that is an EOA -- a plain account, one already running HermesDelegateV1, or one delegated to
        any other delegate. `to` is then sender_address itself, and `data` is ERC-7821 execute() in
        the plain batch mode with the two calls, approve then pay, which the delegate runs only for
        a call the address makes to itself and all-or-nothing. With `authorization`, the address is
        not delegated to HermesDelegateV1 yet: send it as a type-4 transaction carrying that
        authorization, signed over keccak(0x05 | rlp([chainId, address, nonce])). For an address
        delegated elsewhere that authorization replaces its delegation, so a client must say so
        before asking for the signature. Elsewhere -- a chain outside those six, the coin, a route
        with no approval, a sender that is a contract, a chain whose node swaps-backend cannot read
        -- the approval and the payment are two `main` payloads, so a client reads both.
      required:
      - to
      - value
      properties:
        to:
          type: string
          description: The contract or address the transaction calls. On an approval, the token.
          example: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
        value:
          type: string
          description: The coin sent with the call, in wei. "0" on a token transfer.
          example: '0'
        data:
          type: string
          description: The calldata, 0x-prefixed. Absent when there is none.
          example: '0x095ea7b3000000000000000000000000'
        gas:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,19}$'
          description: >-
            The gas limit to sign with, in units of gas, as a decimal string -- not a fee: the price
            (maxFeePerGas, maxPriorityFeePerGas) is the client's to take from its own RPC. It already
            carries headroom, so it is used as given with nothing added: the aggregator's own figure
            where it states one, which has its headroom in it, and otherwise this service's estimate
            raised by 30%, which is about what the aggregator adds. Given for every step up front,
            the payment after an approval included -- that one is estimated as if the approval had
            been mined -- so the whole cost can be shown and every step signed before the approval is
            sent. Absent or null when there is no figure: no estimate exists (today, an EVM chain
            other than Ethereum where the aggregator states none), or the estimate reverted, which is
            never passed on as a number. Its absence is not an error: the client then estimates the
            limit itself with headroom of its own, and shows the fee as approximate.
          example: '73254'
        authorization:
          $ref: '#/components/schemas/EIP7702AuthorizationTemplate'
    EIP7702AuthorizationTemplate:
      type: object
      description: >-
        The EIP-7702 authorization the transaction carries, to sign: the address is delegated to
        `address` on `chainId`. `nonce` is sender_address's nonce at the quote plus one -- the
        transaction's own nonce plus one, since the sender sends it and its nonce has moved by the
        time the authorization is processed. A client whose next nonce plus one is not `nonce`
        quotes again: the chain skips a stale authorization, and the call into an address with no
        code then does nothing but spend the gas.

        The delegation outlives the deposit: the address keeps the delegate's code until it
        authorizes another one or address zero, and a client must say so before asking for the
        signature.
      required:
      - chainId
      - address
      - nonce
      properties:
        chainId:
          type: integer
          format: int64
          example: 1
        address:
          type: string
          description: The delegate, HermesDelegateV1.
          example: '0x24b576bc271823bf9c24be627b4363b9b00191e9'
        nonce:
          type: integer
          format: int64
          minimum: 1
          example: 12
    PayloadMetaTronMain:
      type: object
      description: >-
        One Tron TriggerSmartContract call, from sender_address, to build (e.g. TronWeb
        triggerSmartContract with this calldata as its raw parameter), sign and broadcast. On an
        approval, the call is the TRC-20's approve.
      required:
      - to
      - value
      - data
      properties:
        to:
          type: string
          description: The contract the call is made to, as a base58 address. On an approval, the token.
          example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        value:
          type: string
          description: The TRX sent with the call, in sun. "0" on a token.
          example: '0'
        data:
          type: string
          description: The calldata, selector included, as hex without 0x -- Tron's own spelling.
          example: 095ea7b3000000000000000000000000f0623e1012177482912fb057e44e1a9769b1f588
    PayloadMetaLighterTransfer:
      type: object
      description: >-
        One Lighter L2 transfer (tx type 12) out of the caller's account, on chain lighter/mainnet: sign
        it with the account's API key and the owner's L1 key over Lighter's transfer message, both from
        these fields and the account's next nonce, and send it through POST /transactions/send. Nothing
        is broadcast on a chain. amount plus usdc_fee is what leaves the account.
      required:
      - to_account_index
      - asset_index
      - from_route_type
      - to_route_type
      - amount
      - usdc_fee
      - memo
      properties:
        to_account_index:
          type: integer
          format: int64
          description: The receiving account, the aggregator's own on Lighter.
          example: 731033
        asset_index:
          type: integer
          description: What moves, in Lighter's asset table. Always 3, USDC.
          example: 3
        from_route_type:
          type: integer
          description: The balance it leaves. Always 0, perps collateral.
          example: 0
        to_route_type:
          type: integer
          description: The balance it lands in. Always 0, perps collateral.
          example: 0
        amount:
          type: string
          description: What is transferred, in USDC's smallest unit.
          example: '19000000'
        usdc_fee:
          type: string
          description: Lighter's fee on the transfer, in USDC's smallest unit, taken on top of amount.
          example: '1000000'
        memo:
          type: string
          description: 0x and 32 bytes of hex, signed as the transfer's memo -- what the aggregator matches it by.
          example: '0x3b2e8c0159af930542d411cbe1262b2dd9cd88c3313890a50cf29508407dd19e'
    PayloadMetaBtcPrebuild:
      type: object
      description: >-
        One Bitcoin transaction as a PSBT spending sender_address's own outputs: sign every input and
        broadcast it as it stands. It pays the aggregator's deposit address and carries a zero-value
        OP_RETURN the aggregator matches the deposit by, so it must not be rebuilt as a plain transfer
        -- one without that output is not credited.
      required:
      - data
      properties:
        data:
          type: string
          description: The PSBT, base64.
          example: cHNidP8BAL4CAAAAARp+to64b/gtfLBuI7rEL2YIKXSwIDQna3RBoh4r0B2H
    PayloadFee:
      description: >-
        The network fee the wallet should expect for this payload, with `type` saying how it is
        priced, `asset_id` what pays it, and `data` the numbers that pricing has. Absent when the
        quote knows no fee -- a direct quote, or a chain whose fee the wallet estimates itself.
      oneOf:
      - $ref: '#/components/schemas/PayloadFeeValue'
      - $ref: '#/components/schemas/PayloadFeeGas'
      - $ref: '#/components/schemas/PayloadFeeEip1559'
      discriminator:
        propertyName: type
        mapping:
          value: '#/components/schemas/PayloadFeeValue'
          gas: '#/components/schemas/PayloadFeeGas'
          eip1559: '#/components/schemas/PayloadFeeEip1559'
    PayloadFeeValue:
      type: object
      description: A flat amount, and nothing to price. What a TON quote states.
      required:
      - type
      - asset_id
      - data
      properties:
        type:
          type: string
          enum: [value]
          example: value
        asset_id:
          type: string
          description: What pays the fee, as an asset id.
          example: ton/mainnet/coin
        data:
          type: object
          required:
          - amount
          properties:
            amount:
              type: string
              description: The whole fee, in the asset's smallest unit.
              example: '1000000000000'
    PayloadFeeGas:
      type: object
      description: >-
        A transaction priced as gas times a single price -- a legacy EVM transaction, and what a chain
        that has not adopted EIP-1559 charges. Called gas rather than evm because the pricing is the
        chain's, not the virtual machine's.
      required:
      - type
      - asset_id
      - data
      properties:
        type:
          type: string
          enum: [gas]
          example: gas
        asset_id:
          type: string
          example: bsc/mainnet/coin
        data:
          type: object
          required:
          - limit
          - price
          properties:
            limit:
              type: string
              description: The gas the transaction reserves.
              example: '100000'
            price:
              type: string
              description: What one unit of gas costs.
              example: '10000000'
    PayloadFeeEip1559:
      type: object
      description: A transaction priced as EIP-1559, with a ceiling and a tip.
      required:
      - type
      - asset_id
      - data
      properties:
        type:
          type: string
          enum: [eip1559]
          example: eip1559
        asset_id:
          type: string
          example: eth/mainnet/coin
        data:
          type: object
          required:
          - limit
          - max_fee_per_gas
          - max_priority_fee_per_gas
          properties:
            limit:
              type: string
              description: The gas the transaction reserves.
              example: '100000'
            max_fee_per_gas:
              type: string
              description: The most the sender pays per unit of gas, base fee and tip together.
              example: '20000000'
            max_priority_fee_per_gas:
              type: string
              description: The tip per unit of gas.
              example: '0'
    QuoteTracking:
      type: object
      description: >-
        How to follow the fill. Absent when provider is direct: the client broadcast the gateway
        call itself and holds its hash.
      required:
      - execution_id
      - status_url
      properties:
        execution_id:
          type: string
          description: >-
            swaps-backend's execution id for the fill, or on a `funxyz` quote this service's own, which
            names the transfer to the deposit address. Opaque either way.
          example: 'a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b'
        status_url:
          type: string
          description: The path to poll, under this API's base path.
          example: /tk-perps/public-api/v1/funding/status/a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b
    FundingStatus:
      type: object
      required:
      - execution_id
      - status
      properties:
        execution_id:
          type: string
        status:
          type: string
          enum: [pending, success, failure, refund, unknown]
          description: >-
            pending until the aggregator settles it. success, failure and refund are final. unknown is
            an execution nobody has heard of, which is also what a quote nobody paid becomes once
            swaps-backend closes it out.
          example: pending
        details:
          type: string
          description: The aggregator's own words about a failure or refund, when it has any.
        tx_hashes:
          type: array
          description: >-
            The Ethereum transactions of the fill, once there are any. The first is the one that called
            the gateway, and what a deposit recorded by execution_id is confirmed by.
          items:
            type: string
        in_tx_hashes:
          type: array
          description: The source-chain transactions the aggregator saw.
          items:
            type: string

  responses:
    Unauthorized:
      description: >-
        Missing or invalid authentication. Code token_expired means the token's own life ended and a
        refresh answers it; wallet_auth_invalid and operation_proof_invalid mean the session is fine and
        a signature is not; invalid_token means none of these and the caller has to authenticate again.

        token_revoked (the sessions behind the token were reset, so a refresh answers it only while the
        device is still logged in) and device_inactive (the device is revoked or was never registered, so
        it has to register again) can only come from an endpoint that asks multichain-backend. None does
        today, so both are declared without being produced — see the deviceJWT scheme.
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: >-
        Invalid request. Code readonly_token_unavailable is the one that is not about the request's
        own shape: the wallet has no usable read-only token, so an endpoint that reads nothing
        without one cannot answer. Not retryable -- it is fixed by issuing a token through
        /account/ro-token/issue, not by waiting.
      content: *id001
    NotFound:
      description: Resource not found.
      content: *id001
    Forbidden:
      description: >-
        Authenticated, but not entitled to the wallet named in X-Wallet-ID: multichain-backend does not
        have it bound to the calling device. Apart from 401 because refreshing the token cannot help, and
        deliberately indistinguishable from a wallet that does not exist — telling those apart would
        report whether it does.

        Never produced today: no endpoint asks that registry, so nothing reaches this. A wallet nobody
        can sign for fails as 401 wallet_auth_invalid instead. Declared on every endpoint all the same,
        so that one starting to ask is not a change of contract — handle it.

        A device that is itself revoked or unregistered answers 401 device_inactive instead: that is
        about the caller and not about any wallet, so it can be named, and the client has to register
        again rather than show a wallet as unavailable.
      content: *id001
    Conflict:
      description: >-
        The request contradicts what is already recorded: a deposit under this operation_id, or the
        Lighter account a wallet is bound to. Not retryable -- repeating it reproduces the same
        disagreement.


      content: *id001
    ServiceUnavailable:
      description: >-
        A dependency this request needs is unavailable; the request may be retried. Code
        auth_unavailable means the token was never judged, because the issuer's key set could not be
        loaded — keep the token and back off rather than refreshing it. Code upstream_unavailable
        means Lighter did not answer.
      content: *id001
    InternalError:
      description: >-
        This service failed, and the caller cannot fix it by changing the request. Declared on every
        operation because any of them can reach it.
      content: *id001

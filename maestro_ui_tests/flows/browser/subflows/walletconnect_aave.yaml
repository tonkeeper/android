# WalletConnect end to end from the in-app browser: open Aave, pick Keeper in
# the dApp's wallet picker (ConnectKit "Other" → Reown "All Wallets" → search),
# approve in the native "Connect to Aave?" sheet, check the dApp shows the
# connected account, check Keeper's Connected tab lists Aave, then disconnect
# from that tab so the next run (and browser_tabs_smoke) starts clean.
#
# WebView notes: dApp texts/ids are exposed to accessibility (cookie banner
# ids too). The Reown search field is matched by its hint "Search wallet" (see
# below). The wallet tile is "Tonkeeper Tonkeeper" today and may
# become "Keeper Keeper" after the TK-3495 rebrand reaches the WalletConnect
# registry — the regex accepts both. `scroll` swipes the screen centre, which
# is inside the ConnectKit grid — that reveals the "More" tile, which otherwise
# sits under "Copy to Clipboard" and the tap lands on the button.
#
# Timing: the wc: pairing URI is minted when the dApp's picker opens and
# expires 5 minutes later (Reown proposal TTL); approving after that fails
# with ProposalDao getProposalByKey = null and the dApp never shows the
# account. Every hierarchy read on the Aave page is slow (huge WebView tree),
# so between the dApp's own Connect button and "Connect wallet" in the native
# sheet keep the command count minimal: tapOn waits for its element itself,
# and the sheet is verified with a few key strings only.
name: "Browser — WalletConnect Aave"
appId: com.ton_keeper.debug
---
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/browser/open_browser_tab.yaml"

# The Browser remembers its last tab; Aave must be tapped on Explore, not in
# the Connected list.
- tapOn:
    id: explore_tab
- extendedWaitUntil:
    visible:
      text: Aave
      id: name
    timeout: 15000
- tapOn:
    text: Aave
    id: name
- extendedWaitUntil:
    visible:
      text: "app.aave.com"
      id: host
    timeout: 30000
# Aave dashboard boot. Aave renamed the header button "Connect wallet" ->
# "Connect" (2026-09), so every dApp-side match accepts both.
- extendedWaitUntil:
    visible: "Connect|Connect wallet|avatar 0x.*"
    timeout: 30000
# Consent banner: "We value your privacy" sheet with Opt-out / Allow analytics
# (replaced the old react-cookie-consent rcc-decline-button in 2026-09). Only
# the current button is tried: an optional tap on a missing element still pays
# a full lookup on this huge WebView tree (9 min 40 s locally for the old id).
- tapOn:
    text: "^Opt-out$"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

# Precondition: a leftover session from an aborted run — disconnect on the
# dApp side first so the picker can be opened.
- runFlow:
    when:
      visible: "avatar 0x.*"
    commands:
      - tapOn: "avatar 0x.*"
      - extendedWaitUntil:
          visible: "Disconnect"
          timeout: 30000
      - tapOn: "Disconnect"
      - extendedWaitUntil:
          visible: "Connect|Connect wallet"
          timeout: 30000

# waitToSettleTimeoutMs caps Maestro's post-tap "did the UI change" hierarchy
# re-read. On the Aave page that read is the slowest step of the whole suite:
# measured locally, the settle check after tapping More alone ran 5 min 49 s
# (18:14:57 -> 18:20:46) while the Reown proposal expires after 5 min.
- tapOn:
    text: "^(Connect|Connect wallet)$"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "^Other$"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "^More$"
    waitToSettleTimeoutMs: 500
# Reown "All Wallets" sheet. Never tap it by coordinates: a tap fired while the
# sheet is still rendering lands on the ConnectKit grid underneath (Coinbase
# tile -> market:// -> Play Store, seen locally with a point tap 4 s after
# More). The search field is an EditText whose placeholder
# is exposed as hint "Search wallet" (26.09.3); Maestro matches hints by text.
# The old box-in locator (below title / above "<Name> <Name>" / right of Back /
# left of title) is geometrically dead: the input now spans the whole row.
# tapOn waits for the field itself, and the field only exists once the Reown
# sheet has rendered — no separate "All Wallets" assert (one lookup fewer).
- tapOn:
    text: "Search wallet"
    waitToSettleTimeoutMs: 500
- inputText: "keep"
# Fail here, not on the tile, if the field never took focus.
- extendedWaitUntil:
    visible: "^keep$"
    timeout: 10000
# Search results come from the WalletConnect explorer API — give them time.
# Tile text is "<Name> <Name>" today ("Tonkeeper Tonkeeper"); match any tile
# whose name contains Keeper so the registry rename does not break it.
# The tap waits for the tile itself (explorer API results). Settle cap: the
# uncapped post-tap check ran 27 min locally and the proposal had expired.
- tapOn:
    text: ".*(Tonkeeper|Keeper).*"
    below: "All Wallets"
    waitToSettleTimeoutMs: 500

# Native Keeper sheet: title, requester, permissions. Networks is covered by
# the tap anchor below.
- extendedWaitUntil:
    visible: "Connect to Aave?"
    timeout: 30000
- assertVisible: "app.aave.com is requesting access to your wallet:"
- assertVisible: "View your wallet balance and activity"
- assertVisible: "Request approval for transactions"
- assertVisible: "This signature won't transfer your assets"
# The dApp's own "Connect wallet" button is still in the hierarchy under the
# sheet — pin the native one below Networks.
- tapOn:
    text: "Connect wallet"
    below: "^Networks$"
    waitToSettleTimeoutMs: 500

# dApp side: header shows the connected account, its modal shows the address.
- extendedWaitUntil:
    visible: "avatar 0x.*"
    timeout: 30000
- tapOn: "avatar 0x.*"
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 30000
- assertVisible:
    text: "^Connected$"
    below: "avatar 0x.*"
- assertVisible: "^0x[0-9a-fA-F]{4}.{1,6}[0-9a-fA-F]{4}$"
- assertVisible: "^[0-9.,]+ ETH$"

# Keeper side: Connected tab lists the dApp.
- tapOn:
    id: "close"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: connected_tab
- extendedWaitUntil:
    visible:
      text: Aave
      id: name
    timeout: 15000

# Cleanup: long-press → "Disconnect Aave?" → empty Connected tab.
- longPressOn:
    text: Aave
    id: name
- extendedWaitUntil:
    visible: "Disconnect Aave?"
    timeout: 15000
- tapOn: "^Disconnect$"
- extendedWaitUntil:
    visible: "Connected apps will be shown here"
    timeout: 30000

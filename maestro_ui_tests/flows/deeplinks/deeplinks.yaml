name: "Deeplinks"
appId: com.ton_keeper.debug
---
- runFlow: "../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"

# browser: false keeps ton:// / tonkeeper:// in the app. Default openLink can
# hand the URI to Chrome Custom Tabs and never show the send sheet.
- openLink:
    link: 'ton://transfer/UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL'
    browser: false
    autoVerify: true
- runFlow: "../../steps/send/pick_gram_after_transfer_deeplink.yaml"
- assertVisible: UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL
- back

- openLink:
    link: 'ton://transfer/UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL?text=BibaBoba'
    browser: false
    autoVerify: true
- runFlow: "../../steps/send/pick_gram_after_transfer_deeplink.yaml"
- assertVisible: UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL
- assertVisible: BibaBoba
- back

- openLink:
    link: 'tonkeeper://transfer/UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL?amount=1'
    browser: false
    autoVerify: true
- runFlow: "../../steps/send/pick_gram_after_transfer_deeplink.yaml"
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - waitForAnimationToEnd:
          timeout: 3000
# BUG https://tonkeepertop.slack.com/archives/C0B00CJ6C3G/p1787305003229129
#- assertVisible: Confirm Action
#- assertVisible: UQCae11h9N5znylEPRjmuLYGvIwnxkcCw4zVW4BJjVASi5eL
#- assertVisible: "0.000000001 GRAM.*"

- openLink:
    link: 'tonkeeper://buy-ton'
    browser: false
    autoVerify: true
- assertVisible: Add Funds


# Hide/show BTC from Wallet → Manage. The details ellipsis has no testTag,
# so Android uses the Manage list (eye toggle) instead of the iOS overflow menu.
# Starts with launch_app_ensure (stopApp + unlock; no clearState).
#
# TK-3691: home shows only 7 asset rows, the rest sit behind "More assets"
# (WalletScreen.PreviewAssetsLimit) and the expansion resets after Manage.
# BTC on the Cloud wallet is past that limit, so every home lookup goes
# through steps/wallet/expand_home_assets.yaml + scrollUntilVisible.
#
# Scrolling back UP to the Crypto header is not reliable in Cloud
# (scrollUntilVisible "^Manage$" UP timed out — the text also exists in other
# tabs kept in the hierarchy), so every phase that needs the header starts
# from a relaunch: launch_app_ensure brings home back to the top and refetches
# the asset list, which also covers the async refetch after Save Changes.
name: "Multichain — hide and show BTC"
appId: com.ton_keeper.debug
---
# Precondition: BTC is in the list (possibly below the fold / behind More
# assets). A run that died between Hide and Show left it hidden for the whole
# wallet, so turn it back on instead of failing on someone else's leftover.
- runFlow: "../../../steps/wallet/ensure_btc_shown.yaml"

# Hide.
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/wallet/toggle_btc_in_manage.yaml"

# Hidden: fresh home, the row is gone from the expanded list. LazyColumn only
# exposes composed rows, so check the first screen and one scroll further down.
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/wallet/expand_home_assets.yaml"
- extendedWaitUntil:
    notVisible:
      text: "^BTC$"
    timeout: 30000
- scroll
- waitForAnimationToEnd:
    timeout: 1000
- assertNotVisible:
    text: "^BTC$"

# Show again.
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/wallet/toggle_btc_in_manage.yaml"

# Shown: fresh home, expand, scroll to the row, open it. centerElement keeps
# the row away from the bottom tab bar, otherwise the tap can land on Trade.
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/wallet/expand_home_assets.yaml"
- scrollUntilVisible:
    element:
      text: "^BTC$"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    text: "^BTC$"
- waitForAnimationToEnd:
    timeout: 5000

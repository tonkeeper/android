# Starts with launch_app_ensure (stopApp + unlock; no clearState).
name: "Multichain — trending network filters"
appId: com.ton_keeper.debug
---
- runFlow: "../../../steps/wallet/launch_app_ensure_multichain_wallet.yaml"

- runFlow: "../../../steps/trade/open_multichain_trade.yaml"

# 30 s, above the house default, for the same reason the other trade steps are:
# the shelves come from GET /api/v2/trading/shelves/config, and TradingRepository
# caches them (cache.getOrLoad). On a warm device the shelf is there in about
# 30 ms; on a freshly installed one the config has to be fetched first, and 10 s
# was not enough in Cloud — the flow failed on `"Trending" is visible` while the
# shelf was merely still on its way.
- extendedWaitUntil:
    visible: Trending
    timeout: 30000
- assertVisible: All

- tapOn:
    text: All
    rightOf: Trending
- tapOn: Ethereum
- assertVisible:
    text: Ethereum
    rightOf: Trending
- runFlow:
    file: "../../../steps/trade/assert_trending_network_headers.yaml"
    env:
      NETWORK_HEADER: "Ethereum"

- tapOn:
    text: Ethereum
    rightOf: Trending
- tapOn: Ton
- assertVisible:
    text: Ton
    rightOf: Trending
- runFlow:
    file: "../../../steps/trade/assert_trending_network_headers.yaml"
    env:
      NETWORK_HEADER: "TON"

- tapOn:
    text: Ton
    rightOf: Trending
- tapOn:
    text: All
    index: 0
- assertVisible:
    text: All
    rightOf: Trending

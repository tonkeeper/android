appId: com.ton_keeper.debug
---
# Wallet UI can lag behind API; refetch + assert up to 3 times (initial + 2 retries).
# API + formatter run in one JS file to avoid GraalVM "API object must not be garbage collected" crashes.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${need_first_screen == true}
          commands:
            - runFlow: ../../steps/wallet/relaunch_app_multichain.yaml

      - runScript:
          file: ../../scripts/api/compare_ton_balance.js
          env:
            addr: ${WALLET_WITH_MONEY_ADDR}
            auth_token: ${auth}

      # Compose home: native token amount sits under the GRAM row, not id: balance.
      - extendedWaitUntil:
          visible:
            text: ${output.screenTonValue}
            below: GRAM
          timeout: 6000

      - assertVisible:
          text: ${output.screenTonValue}
          below: GRAM

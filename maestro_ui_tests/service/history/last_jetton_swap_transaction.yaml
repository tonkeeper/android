appId: com.ton_keeper.debug
---
- runScript:
    file: ../../scripts/api/v2/accounts/getLastSwapEvent.js
    env:
      addr: ${output.walletAddress}
      auth_token: ${auth}

- assertTrue: ${output.jettonLastSwap.status == "ok"}
- assertTrue: ${String(output.jettonLastSwapJettonSwap.ton_in) == nanoTonToSwap}

- runScript: ../../scripts/utils/formatter.js
- evalScript: ${output.jettonLastSwapUsdtGot = output.formatter.formatJetton(output.jettonLastSwapJettonSwap.amount_out, output.jettonLastSwapJettonSwap.jetton_master_out.decimals)}
- assertVisible:
    text: ${output.jettonLastSwapUsdtGot}
    optional: true

- runScript: ../../scripts/utils/check_history_time.js

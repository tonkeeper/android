appId: com.ton_keeper.debug
---
# Digit text is a regex. "5" also matches wallet amounts ($55.61) that stay
# in the hierarchy under the lock overlay.
# Lock screen title is id: pin_title; Create/Re-enter passcode uses id: title
# and id: passcode. Both screens share id: num_pad — tap the digit there.
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "^${PASSWORD_KEY}$"
          childOf:
            id: num_pad

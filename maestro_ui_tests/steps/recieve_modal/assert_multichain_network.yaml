# Env: NETWORK_NAME, ADDRESS_TITLE, DISCLAIMER, PREV_NETWORK
# PREV_NETWORK is the row above this network (or the list subtitle for TON).
# Home badges (ARBITRUM, BASE) sit under the sheet and steal a bare tap.
# Do not default PREV_NETWORK here — Maestro env: in this file overrides the caller.
#
# TK-3667 put the wallet's own short address under the home balance
# ("UQAC...hZbe"). Home stays in the hierarchy under the sheet, so that label
# matches `.*\.\.\..*` too and — for TON and TRON — it also sits *below* the
# row anchor, which made the tap land on the next network's cell (the TON
# case opened "Your TRON address"). Every address locator here is therefore
# scoped to `childOf: id: sheet_content`, the bottom sheet's container;
# home lives under root_container/child_fragment and is excluded.
appId: com.ton_keeper.debug
---
- assertVisible:
    text: ${NETWORK_NAME}
    below: ${PREV_NETWORK}
    childOf:
      id: "sheet_content"
- copyTextFrom:
    text: ".*\\.\\.\\..*"
    below:
      text: ${NETWORK_NAME}
      below: ${PREV_NETWORK}
    childOf:
      id: "sheet_content"
- tapOn:
    text: ".*\\.\\.\\..*"
    below:
      text: ${NETWORK_NAME}
      below: ${PREV_NETWORK}
    childOf:
      id: "sheet_content"

- evalScript: ${output.shortAddress = maestro.copiedText; output.addrPrefixRegex = output.shortAddress.split('...')[0] + '.*'}
- assertTrue:
    condition: ${output.shortAddress != null && output.shortAddress.indexOf('...') >= 0}
    label: ${NETWORK_NAME} short address visible
# The QR card slides in over the list; 150 ms was a coin flip on a loaded
# Cloud device. A generous timeout costs nothing on the happy path.
- extendedWaitUntil:
    visible: ${ADDRESS_TITLE}
    timeout: 15000
- assertVisible: ${DISCLAIMER}
- copyTextFrom:
    id: wallet_address_text
- evalScript: ${output.fullAddr = (maestro.copiedText || '').replace(/\n/g, ''); var parts = output.shortAddress.split('...'); output.addrOk = parts.length === 2 && output.fullAddr.startsWith(parts[0]) && output.fullAddr.endsWith(parts[1]);}
- assertTrue:
    condition: ${output.addrOk}
    label: ${NETWORK_NAME} full address matches short

- tapOn: Copy
- extendedWaitUntil:
    visible: Copied
    timeout: 3000
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

- tapOn: Navigation
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: Receiving address
    timeout: 15000

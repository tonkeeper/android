# Sends AMOUNT of an asset to the clipboard recipient (copied from Receive).
# Env: SEARCH_QUERY, TOKEN_SYMBOL, AMOUNT, CHAIN_NAME (optional)
appId: com.ton_keeper.debug
env:
  CHAIN_NAME: ""
---
- extendedWaitUntil:
    visible: Send
    timeout: 1500
- tapOn: Send
- waitForAnimationToEnd:
    timeout: 5000

- runFlow:
    when:
      notVisible: Choose asset
    commands:
      - extendedWaitUntil:
          visible: Amount
          timeout: 1000
      - tapOn: Amount
      - waitForAnimationToEnd:
          timeout: 3000

- extendedWaitUntil:
    visible: Choose asset
    timeout: 1500
- runFlow:
    file: ../token_picker/select_asset.yaml
    env:
      SEARCH_QUERY: ${SEARCH_QUERY}
      TOKEN_SYMBOL: ${TOKEN_SYMBOL}
      CHAIN_NAME: ${CHAIN_NAME}

- extendedWaitUntil:
    visible: Address
    timeout: 15000
- tapOn: Paste
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: Amount
- inputText: ${AMOUNT}

# Every send-to-self case sends the network's native coin, so the fee comes
# out of the same balance: it has to be above AMOUNT. Each run burns a fee, and
# the Cloud wallet ran out of BTC this way; say so instead of failing later on
# a disabled Continue or a failed broadcast.
- runFlow:
    when:
      visible: "Balance: .*"
    commands:
      - copyTextFrom:
          text: "Balance: .*"
      - evalScript: ${output.sendBalance = parseFloat(maestro.copiedText.replace(/[^0-9.]/g, ''))}
      - assertTrue:
          condition: ${output.sendBalance > parseFloat(AMOUNT)}
          label: "Enough ${TOKEN_SYMBOL} to send ${AMOUNT} plus the fee (if not: top up the test wallet)"

- extendedWaitUntil:
    visible:
      text: Continue
      enabled: true
    timeout: 15000
- tapOn: Continue

- assertVisible: ${AMOUNT + "[ \u2009]" + TOKEN_SYMBOL}

- runFlow: ../confirm/swipe_slide_to_confirm.yaml
- runFlow: ../wallet/unlock_passcode_if_needed.yaml

- extendedWaitUntil:
    visible: "Done|History"
    timeout: 180000

# Selects an asset in the Android token picker by searching for it.
# Env: SEARCH_QUERY, TOKEN_SYMBOL, CHAIN_NAME (optional chip under the search field)
appId: com.ton_keeper.debug
env:
  CHAIN_NAME: ""
---
- extendedWaitUntil:
    visible: "Search by ticker or name|Search"
    timeout: 15000
- tapOn: "Search by ticker or name|Search"

- runFlow:
    when:
      true: ${CHAIN_NAME !== ""}
    commands:
      - tapOn: ${CHAIN_NAME}
      - waitForAnimationToEnd:
          timeout: 600

- inputText: ${SEARCH_QUERY}
# The result row only: the search field above the chips reads the query too,
# and the IME suggestion strip offers it as a word. Matching either made this
# step pass on an empty "Can't find anything." list and tap the keyboard.
- extendedWaitUntil:
    visible:
      text: "^${TOKEN_SYMBOL}$"
      below: "^All$"
      childOf:
        id: sheet_content
    timeout: 15000
    label: "${TOKEN_SYMBOL} is listed in the token picker (if not: hidden in Manage or missing from the wallet)"
- tapOn:
    text: "^${TOKEN_SYMBOL}$"
    below: "^All$"
    childOf:
      id: sheet_content
- waitForAnimationToEnd:
    timeout: 1000

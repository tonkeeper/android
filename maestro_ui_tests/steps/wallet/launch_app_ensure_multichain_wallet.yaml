# Cold start to a funded multichain wallet home. Multichain has no feature
# flags anymore, so no launch extras are needed.
#
# Per-case recovery for shard subflows: stopApp + pin. Never
# clearState — a mid-shard relaunch must keep the already-imported wallet.
# Import runs only if the app is empty (import_wallet, no pin).
#
# Launcher label is "Keeper Dev" since the TK-3495 rebrand ("Tonkeeper Dev"
# before it); the regex accepts both so older builds still recover.
# Do not tap the bare label while the app is open: "Keeper" is also the
# start-screen title (id: title), not the launcher icon.
#
# Maestro launchApp can leave the start screen up even when a wallet exists.
# Wait for the pin first; only if it never appears, go Home, open the icon,
# then either unlock or import (empty app).
appId: com.ton_keeper.debug
---
- stopApp
# Local Maestro can fail launchApp (multiple LAUNCHER aliases). Cloud still
# starts the activity. optional + Home / launcher icon recovers locally.
#
# Optional FEATURE_FLAGS: a JSON object handed to FeatureManager's static
# overrides, e.g. '{"android_is_perps_enabled": true}'. Callers that do not set
# it get exactly the launch this step has always done. The branch exists only
# because launchApp cannot take a conditional `arguments` block; it replaces
# launch_app_ensure_perps.yaml, which was a 131-line copy of this file.
- runFlow:
    when:
      true: ${FEATURE_FLAGS == null || FEATURE_FLAGS == ''}
    commands:
      - launchApp:
          optional: true
          permissions:
            notifications: allow
- runFlow:
    when:
      true: ${FEATURE_FLAGS != null && FEATURE_FLAGS != ''}
    commands:
      - launchApp:
          optional: true
          permissions:
            notifications: allow
          arguments:
            featureFlags: ${FEATURE_FLAGS}

- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      id: pin_title
    timeout: 10000
    optional: true

# No pin yet — likely the launcher or a stuck start screen. Re-open from Home.
# Do not import here: a funded wallet can still flash Import Existing Wallet.
- runFlow:
    when:
      notVisible:
        id: pin_title
    commands:
      - pressKey: Home
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "^(Tonkeeper|Keeper) Dev$"
      - waitForAnimationToEnd:
          timeout: 4000

- extendedWaitUntil:
    visible:
      id: "pin_title$|import_wallet$"
    timeout: 30000

- runFlow:
    when:
      visible:
        id: pin_title
    commands:
      # The keypad animates in after pin_title appears; typing into the
      # half-built overlay drops digits and leaves "Enter passcode" with one dot
      # filled. This guard came from launch_app_ensure_perps.yaml, where a pack
      # run launches the app 15 times in a row and hit the race regularly — the
      # gap was always here too, it just surfaced less often.
      - extendedWaitUntil:
          visible:
            id: num_pad
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 4000
      - runFlow: ../password/enter_password.yaml
      # The keypad can be on screen but not yet interactive: every digit misses
      # and the overlay stays with no dots filled. One retry is enough.
      # Retry keys on num_pad, not pin_title: the title lingers through the
      # dismiss animation, and enter_password hard-fails ("Parent element not
      # found: num_pad") if the keypad has already gone.
      - runFlow:
          when:
            visible:
              id: num_pad
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - runFlow:
                when:
                  visible:
                    id: num_pad
                commands:
                  - runFlow: ../password/enter_password.yaml

- runFlow:
    when:
      visible:
        id: import_wallet
      notVisible:
        id: pin_title
    file: import_wallet.yaml

- tapOn:
    id: stories_close
    optional: true

- extendedWaitUntil:
    notVisible:
      id: pin_title
    timeout: 15000

# Last selected tab can be Trade/Browser. Header wallet switcher is also
# text "Wallet" — pin the bottom tab only.
- tapOn:
    id: title
    text: Wallet
    childOf:
      id: bottom_tabs
    optional: true
- waitForAnimationToEnd:
    timeout: 1500

- extendedWaitUntil:
    visible: Send
    timeout: 45000
# 10 s, not the 5 s this used to be: the pin overlay can outlive the Compose
# home by several seconds on a loaded host, and a pack run launches the app 15
# times in a row. A longer wait only costs time when something is already wrong.
- extendedWaitUntil:
    notVisible:
      id: pin_title
    timeout: 10000

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            required: [ error, code, request_id ]
            properties:
              error:
                type: string
                description: Human-readable message, safe to show the user
              code:
                type: string
                description: Stable machine-readable code — clients should branch on this
              request_id:
                type: string
                description: UUID v4 for correlating the response to server logs
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required: [ error, code, request_id ]
            properties:
              error:

  /v2/crosschain/routes/{route_id}:
    get:
      operationId: getCrossSwapStoredRoute
      summary: Read back a stored route
      description: |
        Returns a route as it was persisted when `POST /v2/crosschain/quotes`
        answered, together with the pair and amounts of the quote it belonged
        to. Lets a caller holding only a `route_id` recover what was swapped
        for what.

        Not every route is readable: a quote that produced no route at all was
        never stored, an unexecuted quote is deleted 30 days after it was
        created, and an expired route is dropped earlier unless a swap was
        executed on it. All of those answer 404.
      tags:
        - crosschain
      parameters:
        - $ref: '#/components/parameters/CrossSwapRouteIDPath'
      responses:
        '200':
          description: Stored route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossSwapStoredRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/crosschain/routes/{route_id}/prepare:
    post:
      operationId: prepareCrossSwapRoute
      summary: Prepare selected route
      description: |
        Builds the transaction for a quoted route. This is the call that
        commits: the aggregator allocates any deposit address, screens the
        wallets and mints its own id for the swap, which comes back as
        `provider_route_id`.

        Screening is why a route that quoted fine can fail here. A `400` with
        code `wallet_screened` means the aggregator's compliance check
        rejected the sender or the recipient — an AML block on the wallet
        itself, not a malformed address. It is final for that wallet: a retry,
        a fresh quote or another route will be refused the same way, and the
        user cannot fix it by correcting the address. swapsxyz raises it as
        `WALLET_SCREENED` with `details.riskLevel` and `details.screenedAt`,
        which our message carries verbatim. Treat it as a terminal state for
        the swap and route the user to support rather than to a retry.

        Other `400` codes: `invalid_address` when the address is genuinely
        malformed or the pair needs a receiver we do not have,
        `insufficient_balance` for an amount the aggregator refuses,
        `route_expired` once the quote is stale, `cannot_build_transaction`,
        and `provider_unavailable` for a rate limit or an upstream outage,
        which is the one worth retrying.
      tags:
        - crosschain
      parameters:
        - $ref: '#/components/parameters/CrossSwapRouteIDPath'
        - $ref: '#/components/parameters/WalletIdHeader'
        - $ref: '#/components/parameters/FirebaseUserHeader'
      requestBody:
        $ref: '#/components/requestBodies/CrossSwapPrepare'
      responses:
        '200':
          description: Prepared signing payloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossSwapPrepare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/crosschain/payloads/{payload_id}/submit:
    post:
      operationId: submitCrossSwapPayload
      summary: Submit signed payload
      tags:
        - crosschain
      parameters:
        - $ref: '#/components/parameters/CrossSwapPayloadIDPath'
      requestBody:
        $ref: '#/components/requestBodies/CrossSwapSubmit'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossSwapSubmit'

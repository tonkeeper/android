        destination_extra_id:
          type: string
          description: Memo / Destination Tag for chains that require it
        extra_id_name:
          type: string
        amount_in:
          type: string
        amount_out:
          type: string
        rate:
          type: string
        fees:
          $ref: '#/components/schemas/RampFees'
        destination_tx_hash:
          type: string
          description: Merchant payout tx, populated from `funds_sent`
        provider_order_id:
          type: string
          description: Merchant's native order id
        estimated_duration:
          type: integer
          description: Seconds (best-effort)
        date_create:
          type: string
          format: date-time
        date_update:
          type: string
          format: date-time
    OfframpAsset:
      type: object
      description: |

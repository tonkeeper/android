              language:
                type: string
                description: BCP-47 tag

  responses:
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            required: [ error, request_id ]
            properties:
              error:
                type: string
                description: Generic sanitised message, never reveals internal details
              code:
                type: string
              request_id:
                type: string
                description: UUID v4 for correlating the response to server logs
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            required: [ error, code, request_id ]
            properties:
              error:
                type: string
                description: Human-readable message, safe to show the user
              code:
                type: string
                description: Stable machine-readable code — clients should branch on this
              request_id:
                type: string
                description: UUID v4 for correlating the response to server logs
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required: [ error, code, request_id ]
            properties:
              error:
                type: string
                description: Human-readable message, safe to show the user
              code:
                type: string
                description: |
                  Stable machine-readable code — clients should branch on this.
                  `route_not_found` means the route id is gone, from this
                  service or from the aggregator; ask for a fresh quote.
              request_id:
                type: string
                description: UUID v4 for correlating the response to server logs
    AssetCapabilities:
      description: Capabilities for the requested assets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetCapabilitiesResponse'

  headers:
    ETag:
      schema:
        type: string


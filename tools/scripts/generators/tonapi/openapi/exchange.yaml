openapi: 3.0.3
info:
  title: Backend API
  version: 1.0.0

servers: [ ]

tags:
  - name: swap
    description: DEX swap operations
  - name: exchange
    description: Fiat-to-crypto and crypto-to-crypto exchange operations
  - name: onramp
    description: Multi-chain fiat-to-crypto on-ramp
  - name: offramp
    description: Multi-chain crypto-to-fiat off-ramp
  - name: p2p
    description: P2P exchange operations
  - name: crosschain
    description: Cross-chain swap operations (multi-provider)
  - name: system
    description: Operational endpoints (probes, etc.)

components:
  parameters:
    FromAssetQuery:
      name: fromAsset
      in: query
      required: true
      description: Source asset address (TON or jetton)
      schema:
        type: string
        pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
    ToAssetQuery:
      name: toAsset
      in: query
      required: true
      description: Target asset address (TON or jetton)
      schema:
        type: string
        pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
    FromAmountQuery:
      name: fromAmount
      in: query
      required: true
      description: Amount to swap (in minimal units)
      schema:
        type: string
        pattern: ^\d+$
    ProviderQuery:
      name: provider
      in: query
      required: true
      description: DEX provider
      schema:
        $ref: '#/components/schemas/Provider'
    CountryQuery:
      name: country
      in: query
      deprecated: true
      description: "User country code (ISO 3166-1 alpha-2). Deprecated: use device_country_code and store_country_code instead"
      schema:
        type: string
        pattern: ^[A-Z]{2}$
    LangQuery:
      name: lang
      in: query
      description: Language code
      schema:
        type: string
    StoreCountryCodeQuery:
      name: store_country_code
      in: query
      description: App Store country code (ISO 3166-1 alpha-2)
      schema:
        type: string
        pattern: ^[A-Z]{2}$
    DeviceCountryCodeQuery:
      name: device_country_code
      in: query
      description: Device country code (ISO 3166-1 alpha-2)
      schema:
        type: string
        pattern: ^[A-Z]{2}$
    BuildQuery:
      name: build
      in: query
      description: App build version
      schema:
        type: string
    PlatformQuery:
      name: platform
      in: query
      description: User device platform
      schema:
        $ref: '#/components/schemas/Platform'
    CurrencyQuery:
      name: currency
      in: query
      description: Fiat currency code (e.g. EUR, USD)
      schema:
        type: string
    DirectionQuery:
      name: direction
      in: query
      description: Trade direction
      schema:
        $ref: '#/components/schemas/ExchangeDirection'
    FiatQuery:
      name: fiat
      in: query
      description: Fiat currency filter (e.g. EUR, USD)
      schema:
        type: string
    CryptoQuery:
      name: crypto
      in: query
      description: Crypto currency filter (e.g. TON, USDT)
      schema:
        type: string
    NetworkQuery:
      name: network
      in: query
      description: Crypto network filter (e.g. native, jetton)
      schema:
        type: string
    SimCountryQuery:
      name: sim_country
      in: query
      description: SIM card country code (ISO 3166-1 alpha-2)
      schema:
        type: string
    TimezoneQuery:
      name: timezone
      in: query
      description: Device timezone (IANA format, e.g. Europe/Berlin)
      schema:
        type: string
    IsVpnActiveQuery:
      name: is_vpn_active
      in: query
      description: Whether VPN is currently active
      schema:
        type: boolean
    FlowQuery:
      name: flow
      in: query
      required: true
      description: "Flow type: deposit (buy crypto) or withdraw (sell crypto)"
      schema:
        $ref: '#/components/schemas/ExchangeFlow'
    CrossSwapRouteIDPath:
      name: route_id
      in: path
      required: true
      description: Route identifier
      schema:
        type: string
    CrossSwapPayloadIDPath:
      name: payload_id
      in: path
      required: true
      description: Signing payload identifier
      schema:
        type: string
    CrossSwapExecutionIDPath:
      name: execution_id
      in: path
      required: true
      description: Execution identifier
      schema:
        type: string
    AssetSearchQuery:
      name: q
      in: query
      required: false
      description: Free-text query matched against Symbol and Name (case-insensitive). Whitespace is trimmed. Empty/missing returns the full list
      schema:
        type: string
    AssetChainFilterQuery:
      name: chain
      in: query
      required: false
      description: Restrict results to a single chain
      schema:
        type: string
    AssetSearchLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of results per page. When `q` is set the server applies an internal default of 50 if omitted; when listing the full snapshot, omitting `limit` returns everything. Hard-capped at 1000. Use together with `cursor` to page through results; a `next_cursor` is returned while more results remain
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    CrossSwapAssetIDQuery:
      name: asset_id
      in: query
      required: true
      description: Internal asset_id, e.g. `ton/mainnet/coin` or `eth/mainnet/erc-20/0x...`
      schema:
        type: string
    OfframpSourceChainQuery:
      name: source_chain
      in: query
      required: false
      description: Internal chain id, e.g. `eth/mainnet`
      schema:
        type: string
    OfframpFiatQuery:
      name: fiat
      in: query
      required: false
      description: Target fiat (ISO 4217)
      schema:
        type: string
    OfframpPayoutMethodQuery:
      name: payout_method
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExchangePaymentMethodType'
    OfframpOrderIDPath:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID v4 for safe retry
      schema:
        type: string
        format: uuid
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a prior response
      schema:
        type: string
    OnrampDestinationChainQuery:
      name: destination_chain
      in: query
      required: false
      description: Internal chain id, e.g. `eth/mainnet`
      schema:
        type: string
    OnrampFiatQuery:
      name: fiat
      in: query
      required: false
      description: Source fiat (ISO 4217)
      schema:
        type: string
    OnrampPaymentMethodQuery:
      name: payment_method
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExchangePaymentMethodType'
    OnrampOrderIDPath:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    PaginationCursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a prior `next_cursor`. Omit for the first page.
      schema:
        type: string
    PaginationLimitQuery:
      name: limit
      in: query
      required: false
      description: Max items per page. Default 20, max 200.
      schema:
        type: integer
        minimum: 1
        default: 20
        maximum: 200
    FirebaseUserHeader:
      name: F
      in: header
      required: false
      description: "Firebase user id, sent by the mobile client. It decides which on-ramp providers the wallet is offered: a wallet that already bought through Mercuryo or Transak keeps them, a wallet we have not seen before is offered MoonPay. A request without it is left as it is today. Also recorded in the asset-search log."
      schema:
        type: string
        maxLength: 256
    SearchQuery:
      name: q
      in: query
      required: false
      description: Free-text search over `symbol`. Case-insensitive substring match.
      schema:
        type: string
    CrossSwapFromAssetIDQuery:
      name: from_asset_id
      in: query
      required: false
      description: Asset identifier for from_asset
      schema:
        type: string
    CrossSwapToAssetIDQuery:
      name: to_asset_id
      in: query
      required: false
      description: Asset identifier for to_asset
      schema:
        type: string
    OnrampAssetIDQuery:
      name: asset_id
      in: query
      required: true
      description: Asset identifier in the same format as `OnrampAsset.asset_id`.
      schema:
        type: string
    OfframpAssetIDQuery:
      name: asset_id
      in: query
      required: true
      description: Asset identifier in the same format as `OfframpAsset.asset_id`.
      schema:
        type: string
    AssetIDsQuery:
      name: asset_ids
      in: query
      required: true
      description: Comma-separated list of asset IDs
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 200
        items:
          type: string
    WalletIdHeader:
      name: X-Wallet-ID
      in: header
      required: false
      description: "Stable wallet identifier, the same header multichain-backend uses. Only a multichain wallet has one, so sending it marks the request as coming from that wallet, which decides which on-ramp providers are offered."
      schema:
        type: string
        minLength: 32
        maxLength: 64
        pattern: "^([a-f0-9]{64}|[a-z2-7]{32}|[a-z2-7]{36})$"
    WalletIdPath:
      name: wallet_id
      in: path
      required: true
      description: "Stable wallet identifier"
      schema:
        type: string
        minLength: 32
        maxLength: 64
        pattern: "^([a-f0-9]{64}|[a-z2-7]{32}|[a-z2-7]{36})$"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          type: string
          description: Human-readable message. Sanitised — never reveals internal details.
        code:
          type: string
          description: |
            Stable machine-readable error code. Optional on 5xx (server may not
            know the cause). Mandatory on 4xx where the client can act.
        request_id:
          type: string
          description: UUID v4 for correlating the response to server logs.
    Ok:
      type: object
      required: [ ok ]
      properties:
        ok:
          type: boolean
    Platform:
      type: string
      enum:
        - android
        - ios
        - desktop
        - web
    Provider:
      type: string
      enum:
        - stonfi
        - omni
    StonFiTrade:
      type: object
      required:
        - fromAsset
        - toAsset
        - fromAmount
        - toAmount
        - routerAddress
      properties:
        fromAsset:
          type: string
          pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        toAsset:
          type: string
          pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        fromAmount:
          type: string
          pattern: ^\d+$
        toAmount:
          type: string
          pattern: ^\d+$
        routerAddress:
          type: string
          pattern: ^(-1|0):[0-9a-fA-F]{64}$
    Trade:
      type: object
      required:
        - fromAsset
        - toAsset
        - fromAmount
        - toAmount
        - blockchainFee
        - path
      properties:
        fromAsset:
          type: string
          pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        toAsset:
          type: string
          pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        fromAmount:
          type: string
          pattern: ^\d+$
        toAmount:
          type: string
          pattern: ^\d+$
        blockchainFee:
          type: string
          pattern: ^\d+$
        path:
          type: array
          items:
            type: string
            pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        routerAddress:
          type: string
          pattern: ^(-1|0):[0-9a-fA-F]{64}$
        stonfiRawTrade:
          $ref: '#/components/schemas/StonFiTrade'
    SwapCalculation:
      type: object
      required:
        - provider
        - trades
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
    SwapGas:
      type: object
      required:
        - stonfi
        - omniston
      properties:
        stonfi:
          type: object
          required:
            - tonToJetton
            - jettonToTon
            - jettonToJetton
          properties:
            tonToJetton:
              type: string
            jettonToTon:
              type: string
            jettonToJetton:
              type: string
        omniston:
          type: object
          required:
            - tonToJetton
            - jettonToTon
            - jettonToJetton
          properties:
            tonToJetton:
              type: string
            jettonToTon:
              type: string
            jettonToJetton:
              type: string
    SwapAsset:
      type: object
      required:
        - symbol
        - name
        - decimals
        - address
        - image
      properties:
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
        address:
          type: string
          pattern: ^(ton|(-1|0):[0-9a-fA-F]{64}|[A-Za-z0-9_-]{48})$
        image:
          type: string
    SwapAssets:
      type: array
      items:
        $ref: '#/components/schemas/SwapAsset'
    TonMessage:
      type: object
      required:
        - targetAddress
        - sendAmount
        - payload
      properties:
        targetAddress:
          type: string
          pattern: ^(-1|0):[0-9a-fA-F]{64}$
        sendAmount:
          type: string
          pattern: ^\d+$
        payload:
          type: string
        jettonWalletStateInit:
          type: string
    OmnistonSwapMessages:
      type: object
      required:
        - messages
        - quoteId
        - resolverName
        - askUnits
        - bidUnits
        - protocolFeeUnits
        - tradeStartDeadline
        - gasBudget
        - estimatedGasConsumption
        - slippage
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TonMessage'
        quoteId:
          type: string
        resolverName:
          type: string
        askUnits:
          type: string
        bidUnits:
          type: string
          description: Amount of bid asset the trader must pay, including all fees
        protocolFeeUnits:
          type: string
          description: Amount of fees charged by the protocol
        tradeStartDeadline:
          type: string
          description: Max timestamp (UTC seconds) for trade start
        gasBudget:
          type: string
          description: Total gas budget required
        estimatedGasConsumption:
          type: string
          description: Estimated gas units to be spent
        slippage:
          type: integer
        valueDifferenceBps:
          type: integer
          description: |
            USD value difference between input and output, in basis points
            (1% = 100 bps, so -300 = -3%). Negative means the user receives
            less USD than they pay. Omitted when |bps| < 300 or USD prices
            are unavailable.
    ExchangeAssetType:
      type: string
      enum:
        - fiat
        - crypto
    ExchangeMethod:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        address:
          type: string
    ExchangeLimits:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
    ExchangeAsset:
      type: object
      required:
        - slug
        - type
        - input_methods
        - output_methods
      properties:
        slug:
          type: string
        type:
          $ref: '#/components/schemas/ExchangeAssetType'
        input_methods:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeMethod'
        output_methods:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeMethod'
        image:
          type: string
        decimals:
          type: integer
        stablecoin:
          type: boolean
    ExchangeSimpleMerchant:
      type: object
      required:
        - slug
      properties:
        slug:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        limits:
          $ref: '#/components/schemas/ExchangeLimits'
    ExchangeMerchant:
      type: object
      required:
        - name
        - slug
        - input_methods
        - output_methods
      properties:
        name:
          type: string
        slug:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        input_methods:
          type: array
          items:
            type: string
        output_methods:
          type: array
          items:
            type: string
    ExchangeMerchantInfoButton:
      type: object
      required:
        - title
        - url
      properties:
        title:
          type: string
        url:
          type: string
    ExchangeMerchantInfo:
      type: object
      required:
        - id
        - title
        - description
        - image
        - fee
        - buttons
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
        fee:
          type: number
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeMerchantInfoButton'
    ExchangeCurrencyInfo:
      type: object
      required:
        - symbol
      properties:
        symbol:
          type: string
        network:
          type: string
          description: Blockchain network (e.g. native, jetton, erc-20)
    ExchangePair:
      type: object
      required:
        - from
        - to
        - merchants
      properties:
        from:
          $ref: '#/components/schemas/ExchangeCurrencyInfo'
        to:
          $ref: '#/components/schemas/ExchangeCurrencyInfo'
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeSimpleMerchant'
    ExchangeMerchantSlug:
      type: string
      enum:
        - mercuryo
        - transak
        - moonpay
        - avanchange
        - changelly
        - wallet
    ExchangePaymentMethodType:
      type: string
      enum:
        - card
        - card_mir
        - apple_pay
        - google_pay
        - paypal
        - sepa
        - venmo
        - revolut
        - pix
        - volt
        - p2p
        - ach
    ExchangeCurrencies:
      type: object
      required:
        - assets
        - merchants
        - allowed_pairs
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeAsset'
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeMerchant'
        allowed_pairs:
          type: array
          items:
            $ref: '#/components/schemas/ExchangePair'
    ExchangeQuote:
      type: object
      required:
        - merchant
        - amount
        - merchant_transaction_id
      properties:
        merchant:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        amount:
          type: number
        from_amount:
          type: number
          description: Source amount the user needs to pay (present when reverse=true)
        widget_url:
          type: string
        min_amount:
          type: number
        max_amount:
          type: number
        merchant_transaction_id:
          type: string
    ExchangeCalculation:
      type: object
      required:
        - items
        - suggested
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeQuote'
        suggested:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeQuote'
    ExchangePaymentMethod:
      type: object
      required:
        - merchant
        - methods
      properties:
        merchant:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        methods:
          type: array
          items:
            type: object
            required:
              - type
              - image
            properties:
              type:
                $ref: '#/components/schemas/ExchangePaymentMethodType'
              image:
                type: string
    ExchangeDirection:
      type: string
      enum:
        - buy
        - sell
        - swap
    ExchangeAvailablePair:
      type: object
      required:
        - merchant
        - direction
        - crypto_currency
        - crypto_network
        - fiat_currency
      properties:
        merchant:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        direction:
          $ref: '#/components/schemas/ExchangeDirection'
        crypto_currency:
          type: string
        crypto_network:
          type: string
        fiat_currency:
          type: string
        limits:
          $ref: '#/components/schemas/ExchangeLimits'
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/ExchangePaymentMethodType'
    ExchangePairs:
      type: object
      required:
        - count
        - pairs
      properties:
        count:
          type: integer
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeAvailablePair'
    ExchangeFlow:
      type: string
      enum:
        - deposit
        - withdraw
    ExchangeLayoutCashMethod:
      type: object
      required:
        - type
        - name
        - image
        - providers
      properties:
        type:
          $ref: '#/components/schemas/ExchangePaymentMethodType'
        name:
          type: string
        image:
          type: string
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutProvider'
    ExchangeLayoutCryptoMethod:
      type: object
      required:
        - symbol
        - asset_id
        - network
        - network_name
        - network_image
        - image
        - decimals
        - stablecoin
        - providers
      properties:
        symbol:
          type: string
          description: Source crypto symbol (e.g. BTC, USDT)
        asset_id:
          type: string
          description: "Internal asset identifier (e.g. `ton/mainnet/coin`, `eth/mainnet/erc20/0xdc03...`, `ton/mainnet/jetton/0:b113...`)"
        network:
          type: string
        network_name:
          type: string
        network_image:
          type: string
        image:
          type: string
        address:
          type: string
        decimals:
          type: integer
        stablecoin:
          type: boolean
        fee:
          type: number
          description: Withdrawal fee in USD (for stablecoins)
        min_amount:
          type: number
          description: Minimum withdrawal amount in USD (for stablecoins)
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutProvider'
    ExchangeLayoutProvider:
      type: object
      required:
        - slug
      properties:
        slug:
          $ref: '#/components/schemas/ExchangeMerchantSlug'
        limits:
          $ref: '#/components/schemas/ExchangeLimits'
    ExchangeLayoutAsset:
      type: object
      required:
        - symbol
        - asset_id
        - network
        - network_name
        - network_image
        - image
        - decimals
        - stablecoin
        - cash_methods
        - crypto_methods
      properties:
        symbol:
          type: string
        asset_id:
          type: string
          description: "Internal asset identifier (e.g. `ton/mainnet/coin`, `eth/mainnet/erc20/0xdc03...`, `ton/mainnet/jetton/0:b113...`)"
        network:
          type: string
        network_name:
          type: string
        network_image:
          type: string
        image:
          type: string
        address:
          type: string
        decimals:
          type: integer
        stablecoin:
          type: boolean
        cash_methods:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutCashMethod'
        crypto_methods:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutCryptoMethod'
    ExchangeLayoutItemType:
      type: string
      enum:
        - fiat
        - crypto
        - stablecoin
    ExchangeLayoutItem:
      type: object
      required:
        - type
        - title
        - description
        - image
      properties:
        type:
          $ref: '#/components/schemas/ExchangeLayoutItemType'
        title:
          type: string
        description:
          type: string
        image:
          type: string
        preferred_currency:
          type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutAsset'
    ExchangeLayout:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutItem'
    ExchangeLayoutCard:
      type: object
      required:
        - title
        - description
        - image
      properties:
        title:
          type: string
        description:
          type: string
        image:
          type: string
        preferred_currency:
          type: string
          description: ISO 4217 fiat code suggested to the user
    ExchangeLayoutCards:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeLayoutCard'
    ExchangeResult:
      type: object
      required:

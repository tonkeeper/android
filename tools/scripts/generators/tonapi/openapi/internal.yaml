openapi: 3.0.1
info:
  title: "REST API to Ton Endpoint"
  version: 1.0.0
  contact:
    name: "Support"
    email: "contact@tonaps.org"

servers:
  - url: "http://localhost:8888"

paths:
  /ready:
    get:
      operationId: pingReadyGet
      summary: "Liveness probe"
      tags:
        - system
      responses:
        '200':
          description: "Ok"
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      operationId: pingReadyHead
      summary: "Liveness probe"
      tags:
        - system
      responses:
        '200':
          description: "Ok"
        '500':
          $ref: '#/components/responses/InternalError'

  /check-for-updates:
    get:
      operationId: checkForUpdates
      summary: "Latest mobile app version"
      tags:
        - system
      responses:
        '200':
          $ref: '#/components/responses/LatestVersion'
        '500':
          $ref: '#/components/responses/InternalError'
  
  /fiat/methods:
    get:
      operationId: getFiatMethods
      summary: "Fiat on/off-ramp methods available for the resolved country"
      tags:
        - fiat
      parameters:
        - $ref: '#/components/parameters/chainNameQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/countryCodeQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/FiatMethods'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  
  /keys:
    get:
      operationId: getKeys
      summary: "Config blob (mainnet/testnet/tetra)"
      deprecated: true
      tags:
        - keys
      parameters:
        - $ref: '#/components/parameters/chainNameQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/Keys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /keys/all:
    get:
      operationId: getAllKeys
      summary: "Full config blob across all chains"
      deprecated: true
      tags:
        - keys
      parameters:
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/AllKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  
  /apps/popular:
    get:
      operationId: getPopularApps
      summary: "Country and platform filtered list of popular apps grouped by category"
      tags:
        - content
      parameters:
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/withAdsQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/PopularApps'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sign/moonpay:
    get:
      operationId: signMoonpay
      summary: "Signed Moonpay deep-link redirect"
      tags:
        - fiat
      parameters:
        - $ref: '#/components/parameters/currencyCodeFromQuery'
        - $ref: '#/components/parameters/currencyCodeToQuery'
        - $ref: '#/components/parameters/walletAddressQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '302':
          description: "Redirect to Moonpay"
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications:
    get:
      operationId: getNotifications
      summary: "Platform/build gated user facing notifications"
      tags:
        - notifications
      parameters:
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/Notifications'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /widget/sell/rates:
    get:
      operationId: getSellRatesWidget
      summary: "Provider sell rates for the given currency"
      tags:
        - widget
      parameters:
        - $ref: '#/components/parameters/currencyQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/WidgetRates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /widget/buy/rates:
    get:
      operationId: getBuyRatesWidget
      summary: "Provider buy rates for the given currency"
      tags:
        - widget
      parameters:
        - $ref: '#/components/parameters/currencyQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/WidgetRates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /stories:
    get:
      operationId: getStoriesBatch
      summary: "Onboarding/feature stories by id list"
      tags:
        - stories
      parameters:
        - $ref: '#/components/parameters/storyIdsQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/StoriesPages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /stories/{story_id}:
    get:
      operationId: getStories
      summary: "Single story by id"
      deprecated: true
      tags:
        - stories
      parameters:
        - $ref: '#/components/parameters/storyId'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/StoryPages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /banners:
    get:
      operationId: getBanners
      summary: "Home-screen banner carousel"
      tags:
        - content
      parameters:
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/Banners'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /staking/ethena:
    get:
      operationId: getStakingEthenaMethods
      summary: "Ethena staking methods"
      tags:
        - ethena
      parameters:
        - $ref: '#/components/parameters/addressQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/StakingEthenaMethods'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /currencies:
    get:
      operationId: getCurrencies
      summary: "Available fiat currencies"
      tags:
        - content
      parameters:
        - $ref: '#/components/parameters/platformQuery'
        - $ref: '#/components/parameters/buildQuery'
        - $ref: '#/components/parameters/langQuery'
        - $ref: '#/components/parameters/storeCountyCodeQuery'
        - $ref: '#/components/parameters/deviceCountyCodeQuery'
        - $ref: '#/components/parameters/simCountryQuery'
        - $ref: '#/components/parameters/timezoneQuery'
        - $ref: '#/components/parameters/isVpnActiveQuery'
        - $ref: '#/components/parameters/walletIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/Currencies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /my/ip:
    get:
      operationId: myIp
      summary: "Client IP plus resolved country code"
      tags:
        - system
      responses:
        '200':
          $ref: '#/components/responses/MyIp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    chainNameQuery:
      description: Chain Name
      in: query
      name: chainName
      schema:
        $ref: '#/components/schemas/ChainName'
    langQuery:
      description: Language code
      in: query
      name: lang
      schema:
        type: string
        default: "en"
        example: "en"
    countryCodeQuery:
      description: Country Code
      in: query
      name: countryCode
      schema:
        type: string
        pattern: '^[A-Z]{2}$'
        example: "RU"
    buildQuery:
      description: Build Version
      in: query
      name: build
      schema:
        type: string
        example: "3.2.20"
    platformQuery:
      description: Platform
      in: query
      name: platform
      schema:
        $ref: '#/components/schemas/Platform'
    storeCountyCodeQuery:
      description: Store country code
      in: query
      name: store_country_code
      required: false
      schema:
        type: string
        #        pattern: '^[A-Z]{2}$'
        example: "UK"
    deviceCountyCodeQuery:
      description: Device country code
      in: query
      name: device_country_code
      required: false
      schema:
        type: string
        #        pattern: '^[A-Z]{2}$'
        example: "UK"
    simCountryQuery:
      description: SIM card country code
      in: query
      name: sim_country
      required: false
      schema:
        type: string
        example: "DE"
    timezoneQuery:
      description: Device timezone (IANA format)
      in: query
      name: timezone
      required: false
      schema:
        type: string
        example: "Europe/Berlin"
    isVpnActiveQuery:
      description: Whether VPN is currently active
      in: query
      name: is_vpn_active
      required: false
      schema:
        type: boolean
    withAdsQuery:
      description: Include ads in response
      in: query
      name: with_ads
      schema:
        type: boolean
        default: false
    currencyCodeFromQuery:
      description: Base currency code
      in: query
      name: baseCurrencyCode
      required: true
      schema:
        type: string
        #        pattern: '^[A-Z]{3,4}$'
        example: "USD"
    currencyCodeToQuery:
      description: Target currency code
      in: query
      name: currencyCode
      required: true
      schema:
        type: string
        #        pattern: '^[A-Z]{3,4}$'
        example: "TON"
    walletAddressQuery:
      description: Wallet address
      in: query
      name: walletAddress
      required: true
      schema:
        type: string
    addressQuery:
      description: Address
      in: query
      name: address
      required: true
      schema:
        type: string
    currencyQuery:
      description: Currency code
      in: query
      name: currency
      required: true
      schema:
        type: string
        pattern: '^[A-Z]{3}$'
        example: "USD"
    storyId:
      description: Story identifier
      in: path
      name: story_id
      required: true
      schema:
        type: string
        example: "hamster"
    storyIdsQuery:
      description: Story identifiers
      in: query
      name: ids
      required: true
      schema:
        type: string
        example: "hamster,usdt-trc20"
    walletIdQuery:
      description: "Stable wallet identifier"
      in: query
      name: wallet_id
      required: false
      schema:
        type: string
        minLength: 32
        maxLength: 64
        pattern: "^([a-f0-9]{64}|[a-z2-7]{32})$"

  schemas:
    ChainName:
      type: string
      enum:
        - mainnet
        - testnet
        - tetra
      example: "mainnet"
    Platform:

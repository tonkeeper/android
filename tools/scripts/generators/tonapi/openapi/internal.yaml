                items:
                  type: string
              assets:
                type: array
                items:
                  $ref: '#/components/schemas/AssetType'
              action_button:
                type: object
                required:
                  - title
                  - url
                properties:
                  title:
                    type: string
                    example: "Open Neocrypto"
                  url:
                    type: string
              successUrlPattern:
                type: object
                required:
                  - pattern
                properties:
                  pattern:
                    type: string
                    example: "&status=1"
                  purchaseIdIndex:
                    type: integer
                    example: 1
              info_buttons:
                type: array
                items:
                  type: object
                  required:
                    - title
                    - url
                  properties:
                    title:
                      type: string
                      example: "Terms of use"
                    url:
                      type: string
                      example: "https://neocrypto.net/policy/term-of-use.pdf"
    PopularCategory:
      type: object
      required:
        - id
        - title
        - apps
      properties:
        id:
          type: string
          enum:
            - featured
            - digital_nomads
            - exchanges
            - defi
            - nft
            - utils
            - games
            - ads
            - ai
            - lending
            - dex_lp
            - yield
            - staking_restaking
            - fun
        title:
          type: string
          example: "Test"
        apps:
          type: array
          items:
            $ref: '#/components/schemas/PopularApp'
    PopularApp:
      type: object
      required:
        - name
        - description
        - id
        - chains
      properties:
        id:
          type: string
          description: "App identifier for client purposes"
        banner_id:
          type: string
        name:
          type: string
          description: "Application name"
        description:
          type: string
          description: "Application description"
        icon:
          type: string
          description: "Icon URL"
        poster:
          type: string
          description: "Poster image URL"
        url:
          type: string
          description: "Application URL"
        chains:
          type: array
          description: "Blockchain identifiers the app targets (e.g. [\"ton\"] or [\"ton\", \"multi\"])"
          items:
            type: string
        excludeCountries:
          type: array
          description: "Countries where app is not available"
          items:
            type: string
            pattern: '^[A-Z]{2}$'
        includeCountries:
          type: array
          description: "Countries where app is available (ISO 3166-1)"
          items:
            type: string
            pattern: '^[A-Z]{2}$'
        textColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#000000"
        button:
          $ref: '#/components/schemas/Button'
    Notification:
      type: object
      required:
        - id
        - title
        - caption
        - mode
        - action
      properties:
        id:
          type: string
          example: "update-4.1.2"
        title:
          type: string
          example: "Update Tonkeeper"
        caption:
          type: string
          example: "A new version of Tonkeeper is available"
        mode:
          type: string
          enum:
            - warning
            - tertiary
          example: "warning"
        action:
          type: object
          required:
            - type
            - label
            - url
          properties:
            type:
              type: string
              enum:
                - open_link
              example: "open_link"
            label:
              type: string
              example: "Update"
            url:
              type: string
              example: "https://apps.apple.com/us/app/tonkeeper/id1587742107"
        isPersistenceHide:
          type: boolean
          default: false
    WidgetRate:
      type: object
      required:
        - id
        - name
        - rate
        - currency
        - logo
      properties:
        id:
          type: string
          example: "moonpay"
        name:
          type: string
          enum:
            - Mercuryo
            - Dreamalkers
            - Neocrypto
            - Moonpay
        rate:
          type: number
          minimum: 0
          example: 100.2
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: "USD"
        logo:
          type: string
        min_ton_buy_amount:
          type: integer
          format: int64
          minimum: 0
          example: 1000000000
        min_ton_sell_amount:
          type: integer
          format: int64
          minimum: 0
          example: 100000000
    Button:
      type: object
      required:
        - type
        - payload
        - title
      properties:
        type:
          type: string
          enum:
            - deeplink
            - link
        payload:
          type: string
        title:
          type: string
          example: "Open"
    Banner:
      type: object
      required:
        - id
        - title
        - description
        - chains
      properties:
        id:
          type: string
          description: "Banner identifier"
        title:
          type: string
          description: "Localized banner title"
        description:
          type: string
          description: "Localized banner description"
        image:
          type: string
          description: "Banner image URL"
        textColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#FFFFFF"
        backgroundColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#000000"
        chains:
          type: array
          description: "Blockchain identifiers the banner targets (optional, e.g. [\"ton\", \"multi\"]; the client decides whether to show the banner)"
          items:
            type: string
        button:
          $ref: '#/components/schemas/Button'
    StoryInfo:
      type: object
      required:
        - story_id
        - preview
        - main_screen
        - pages
      properties:
        story_id:
          type: string
        preview:
          type: string
        main_screen:
          $ref: '#/components/schemas/StoryMainScreen'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/StoryPage'
    StoryMainScreen:
      type: object
      required:
        - title
        - description
        - icon
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
    StoryPage:
      type: object
      required:
        - title
        - description
        - image
        - include_wallets
      properties:
        title:
          type: string
          example: "Hello world!"
        description:
          type: string
          example: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
        image:
          type: string
        include_wallets:
          type: array
          items:
            type: string
            enum:
              - ledger
              - keystone
              - signer
              - watch-only
              - imported
        button:
          deprecated: true
          $ref: '#/components/schemas/Button'
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/Button'
    StakingEthenaMethod:
      type: object
      required:
        - name
        - type
        - image
        - jetton_master
        - links
        - apy
        - apy_title
        - apy_description
        - apy_bonus_title
        - apy_bonus_description
        - deposit_url
        - withdrawal_url
        - eligible_bonus_url
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - stonfi
            - affluent
        image:
          type: string
        links:
          type: array
          items:
            type: string
        jetton_master:
          type: string
        apy:
          type: number
          format: double
          minimum: 0
          maximum: 100
        apy_title:
          type: string
        apy_description:
          type: string
        apy_bonus_title:
          type: string
        apy_bonus_description:
          type: string
        deposit_url:
          type: string
        withdrawal_url:
          type: string
        eligible_bonus_url:
          type: string
    Currency:
      type: object
      required:
        - code
        - name
        - image
        - type
      properties:
        code:
          type: string
          example: "USD"
        name:
          type: string
          example: "United States Dollar"
        image:
          type: string
          example: "https://tonkeeper.com/assets/currencies/usd.png"
        type:
          type: string
          enum:
            - fiat
            - crypto
          example: "fiat"
  
  responses:
    NotFound:
      description: "The specified resource was not found"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                description: "Error message"
    InternalError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                description: "Error message"
    BadRequest:
      description: "Bad request"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                description: "Error message"
    Keys:
      description: "Keys configuration"
      content:
        application/json:
          schema:
            additionalProperties: true
            example: { }
    AllKeys:
      description: "All keys configuration"
      content:
        application/json:
          schema:
            type: object
            required:
              - mainnet
              - testnet
              - tetra
            properties:
              mainnet:
                additionalProperties: true
                example: { }
              testnet:
                additionalProperties: true
                example: { }
              tetra:
                additionalProperties: true
                example: { }
    LatestVersion:
      description: "Latest version information"
      content:
        application/json:
          schema:
            type: object
            required:
              - version
              - size
            properties:
              version:
                type: string
                example: "4.1.2"
              size:
                type: number
                minimum: 0
    FiatMethods:
      description: "Available fiat payment methods"
      content:
        application/json:
          schema:
            type: object
            required:
              - success
            properties:
              success:
                type: boolean
              data:
                type: object
                required:
                  - layoutByCountry
                  - defaultLayout
                  - categories
                  - buy
                  - sell
                properties:
                  layoutByCountry:
                    type: array
                    items:
                      type: object
                      required:
                        - countryCode
                        - currency
                        - methods
                      properties:
                        countryCode:
                          $ref: '#/components/schemas/FiatMethodsCountryCode'
                        currency:
                          $ref: '#/components/schemas/FiatMethodsCurrency'
                        methods:
                          type: array
                          items:
                            $ref: '#/components/schemas/Method'
                  defaultLayout:
                    type: object
                    required:
                      - methods
                    properties:
                      methods:
                        type: array
                        items:
                          type: string
                          example: "mercuryo"
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/FiatCategory'
                  buy:
                    type: array
                    items:
                      $ref: '#/components/schemas/FiatCategory'
                  sell:
                    type: array
                    items:
                      $ref: '#/components/schemas/FiatCategory'
    PopularApps:
      description: "Popular applications"
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
            properties:
              success:
                type: boolean
              data:
                type: object
                required:
                  - categories
                  - apps
                  - moreEnabled
                properties:
                  moreEnabled:
                    type: boolean
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PopularCategory'
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/PopularApp'
    Notifications:
      description: "System notifications"
      content:
        application/json:
          schema:
            type: object
            required:
              - notifications
            properties:
              notifications:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
    WidgetRates:
      description: "Widget exchange rates"
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/WidgetRate'
    StoriesPages:
      description: "Stories with their pages"
      content:
        application/json:
          schema:
            type: object
            required:
              - stories
            properties:
              stories:
                type: array
                items:
                  $ref: '#/components/schemas/StoryInfo'
    Banners:
      description: "Home screen banners carousel"
      content:
        application/json:
          schema:
            type: object
            required:
              - banners
            properties:
              banners:
                type: array
                items:
                  $ref: '#/components/schemas/Banner'
    StoryPages:
      description: "Story pages"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoryInfo'
    MyIp:
      description: "Client IP information"
      content:
        application/json:
          schema:
            type: object
            required:
              - ip
              - country
            properties:
              ip:
                type: string
                example: "51.123.28.1"
              country:
                type: string
                pattern: '^[A-Z]{2}$'
                example: "ID"
    StakingEthenaMethods:
      description: "Ethena staking methods"
      content:
        application/json:
          schema:
            type: object
            required:
              - methods
              - about
            properties:
              methods:
                type: array
                items:
                  $ref: '#/components/schemas/StakingEthenaMethod'
              about:
                type: object
                required:
                  - description
                  - faq_url
                  - about_url
                  - tsusde_stake_title
                  - tsusde_stake_description
                  - tsusde_description
                properties:
                  description:
                    type: string
                  faq_url:
                    type: string
                  about_url:
                    type: string
                  tsusde_description:
                    type: string
                  tsusde_stake_title:
                    type: string
                  tsusde_stake_description:
                    type: string
    Currencies:
      description: "Currencies"
      content:
        application/json:
          schema:
            type: object
            required:
              - currencies
            properties:
              currencies:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
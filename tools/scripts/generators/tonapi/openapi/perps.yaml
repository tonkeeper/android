            $ref: '#/components/schemas/Market'
    TradingScreen:
      type: object
      description: >-
        Perps asset details payload for a single market. Only open_orders needs X-Lighter-Auth: the
        position, its PnL and the balance all come from the account snapshot, which Lighter serves by
        account index and which needs no token. Without the token open_orders is empty, and two fields
        derived from it go with it -- flags.cancel_enabled is false and position.auto_close is null,
        since the TP/SL legs are themselves open orders.
      properties:
        type:

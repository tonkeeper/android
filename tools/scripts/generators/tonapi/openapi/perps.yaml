          - $ref: '#/components/schemas/Position'
          nullable: true
          description: Caller's position in this market, or null if none.
        open_orders:
          type: array
          description: Caller's open orders in this market (empty without X-Lighter-Auth).
          items:
            $ref: '#/components/schemas/Order'
        balance:
          $ref: '#/components/schemas/Balance'
        flags:
          $ref: '#/components/schemas/TradingFlags'
    PortfolioScreen:
      type: object
      description: Payload for the portfolio screen.
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    ActivityPage:
      type: object
      description: A page of the account activity feed.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page.
          example: eyJvZmZzZXQiOjQwfQ==
        last_sort_ts:
          type: string
          format: date-time
          nullable: true
          description: Max sort timestamp across the filtered set, for poll ranking-shift detection.
          example: '2026-07-04T12:41:03Z'
    OpenDepositRequest:
      type: object
      required:
      - operation_id
      - asset_id
      - amount
      - l1_tx_hash
      - proof
      properties:
        operation_id:
          type: string
          maxLength: 128
          description: >-
            Opaque client-side identifier for this deposit attempt, never parsed here. Retrying the
            same attempt must reuse it — that is what makes this call idempotent — and a genuinely
            new deposit must carry a new one. Reusing it with a different amount is a conflict, not
            an update.

            A write key only. Progress is read by deposit_id, and this value is not a lookup key:
            recording the same transaction under a second operation_id returns the record created
            under the first one, keeping the first one's value.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        asset_id:
          type: string
          maxLength: 128
          description: >-
            Where the funds started, in the swap backend's own asset id form. Opaque here: kept as a
            record and never resolved, because what arrives at Lighter is USDC on Ethereum whichever
            chain the money came from.
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: >-
            What was sent, as a decimal string, at most 6 decimal places and not below the gateway's
            1 USDC floor — less than that is accepted by the contract and then never credited. Kept
            as declared: Lighter records only what arrives, so this is the only copy of what was
            meant, and "expected N, got M" can be answered from nowhere else.
          example: '25'
        execution_id:
          type: string
          maxLength: 128
          description: >-
            The swap this deposit is funded by, as the swap backend named it. Optional, kept for
            correlation and support: it is what a failed swap is told apart by, and what a
            server-side resolver will one day turn into the Ethereum hash so that l1_tx_hash stops
            being required. Nothing reads it yet.
          example: 26176e1a-d5aa-4b00-b4b3-4af2e1d904cc
        l1_tx_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
          description: >-
            The Ethereum transaction that called Lighter's gateway. Required: it is the only handle
            this service can confirm a deposit with — Lighter resolves it to the credit, the amount
            and the account index, and does so without a read-only token, which a first deposit
            could not have anyway since the account does not exist yet.

            Only the Ethereum hash counts. A caller that paid from another chain holds a
            source-chain hash, which Lighter has never seen; it has to wait for the aggregator to
            deliver and record the deposit then. That restriction is temporary and will be lifted
            once execution_id can be resolved to the delivered hash server-side.
          example: '0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380'
        deadline:
          type: integer
          format: int64
          description: >-
            Unix seconds past which the signature below is refused, capped by the service at ten
            minutes ahead. Travels with signature: one without the other is a 400, because a missing
            deadline would otherwise be reported as a signature that has expired.
          example: 1755600000
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: >-
            EIP-712 signature proving the caller holds the key to the L1 address this deposit is
            recorded against, over LinkWallet(string walletId,uint64 deadline) under domain
            {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65
            bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.

            Send it every time, signed in the same vault unlock as the deposit transaction: it is read
            only while the wallet has proved no address yet, and the client cannot tell when that is.
            Missing when it is needed answers 400 address_proof_required.
          example: '0x99ce24c2b78cd46c35a3608007ccece84254a4696045b7f5962a6e758ebeadcc250da971d87099ce2e03e429f0321c42ed4de6cd0c468507480a63b65e64ab801b'
        proof:
          type: string
          pattern: '^[0-9a-fA-F]{130}$'
          description: >-
            The wallet's consent to this deposit, signed with its own root key: hex of a 65-byte
            recoverable secp256k1 signature (R | S | V) over
            LP("perps.deposit.register.v1") | LP(wallet_id) | LP(l1_address) | LP(operation_id)
            | LP(amount) | LP(asset_id) | LP(l1_tx_hash) | LP(execution_id), in the same
            length-prefixed framing custodial-battery uses for its send proof. Every term as this
            service records it: as sent here with surrounding whitespace trimmed and l1_tx_hash
            lowercased, execution_id an empty string when omitted, l1_address lowercase with its 0x.

            Note that l1_address is named here and nowhere in the body. signature only proves that
            somebody holds the key to an address; this is the wallet saying which address is its own.
            Both are needed on a first deposit: without this one an EIP-712 signature captured
            anywhere could bind this wallet to a stranger's Lighter account.

            Required on every deposit, and absent answers 401 operation_proof_required. Requires a
            format 2 wallet_id, which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    Deposit:
      type: object
      description: One recorded deposit.
      properties:
        deposit_id:
          type: string
          description: >-
            Identifies this deposit when polling its progress. A random UUID, so it cannot be guessed
            from an address or a sequence, but it is not what authorises the poll -- that is the
            wallet the deposit belongs to, see the GET operation. Worth persisting alongside whatever
            the client calls the attempt, and not fatal to lose, since posting the same transaction
            again returns the same id rather than a second deposit.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        status:
          type: string
          enum: [pending, credited, unfunded]
          description: >-
            pending until Lighter credits the funds (credited) or nothing has arrived within the
            waiting window (unfunded).

            unfunded means the deposit was not confirmed while it was being watched, which is not
            quite the same as the money never arriving: what arrives is Lighter's to say and this
            record only tracks it. A deposit credited after the window is not noticed, so an unfunded
            record is where such a deposit stays. Treat it as "we did not see it", not as proof of
            loss, and check the account balance before telling anyone their money is gone.
          example: pending
        asset_id:
          type: string
          description: The network and token the funds were sent as; echoed from the request.
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: What the caller declared, echoed back. Compare with credited_amount.
          example: '25'
        credited_amount:
          type: string
          description: >-
            What Lighter actually credited, once it has. Absent while the deposit is pending, and also
            on the rare credit confirmed without an amount — where the only signal was an account
            appearing, which proves an arrival but not its size.
          example: '24.970000'
        l1_tx_hash:
          type: string
          description: The Ethereum transaction this deposit was recorded against, echoed back.
          example: '0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380'
        account_index:
          type: integer
          format: int64
          description: >-
            The Lighter account the deposit belongs to. Absent until the account exists, which for a
            first deposit is until it is credited — that deposit is what creates it.
          example: 736568
        created_at:
          type: string
          format: date-time
          description: When the deposit was recorded here.
        closed_at:
          type: string
          format: date-time
          description: When it stopped being pending. Absent while it still is.
    OrderBookLevel:
      type: object
      required:
      - price
      - size
      properties:
        price:
          type: string
          example: '65000.10'
        size:
          type: string
          description: Size in base units at that price.
          example: '0.5'
    TruncatedOrderBook:
      type: object
      required:
      - updated_at
      - truncated
      properties:
        updated_at:
          type: string
          format: date-time
          description: When the book this was cut from was last updated upstream.
        truncated:
          type: boolean
          description: >-
            Whether the notional was reached. False means the levels returned are the whole book and
            they still did not cover it.
        bids:
          type: array
          description: Present for side=sell. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        asks:
          type: array
          description: Present for side=buy. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'

  responses:
    Unauthorized:
      description: >-
        Missing or invalid authentication. Code token_expired means the token's own life ended and a
        refresh answers it; wallet_auth_invalid and operation_proof_invalid mean the session is fine and
        a signature is not; invalid_token means none of these and the caller has to authenticate again.

        token_revoked (the sessions behind the token were reset, so a refresh answers it only while the
        device is still logged in) and device_inactive (the device is revoked or was never registered, so
        it has to register again) can only come from an endpoint that asks multichain-backend. None does
        today, so both are declared without being produced — see the KeeperAuth scheme.
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request.
      content: *id001
    NotFound:
      description: Resource not found.
      content: *id001
    Forbidden:
      description: >-
        Authenticated, but not entitled to the wallet named in X-Wallet-Id: multichain-backend does not
        have it bound to the calling device. Apart from 401 because refreshing the token cannot help, and
        deliberately indistinguishable from a wallet that does not exist — telling those apart would
        report whether it does.

        Never produced today: no endpoint asks that registry, so nothing reaches this. A wallet nobody
        can sign for fails as 401 wallet_auth_invalid instead. Declared on every endpoint all the same,
        so that one starting to ask is not a change of contract — handle it.

        A device that is itself revoked or unregistered answers 401 device_inactive instead: that is
        about the caller and not about any wallet, so it can be named, and the client has to register
        again rather than show a wallet as unavailable.
      content: *id001
    Conflict:
      description: >-
        The request contradicts what is already recorded: a deposit under this operation_id, or the
        Lighter account a wallet is bound to. Not retryable -- repeating it reproduces the same
        disagreement.
      content: *id001
    ServiceUnavailable:
      description: >-
        A dependency this request needs is unavailable; the request may be retried. Code
        auth_unavailable means the token was never judged, because the issuer's key set could not be
        loaded — keep the token and back off rather than refreshing it. Code upstream_unavailable
        means Lighter did not answer.
      content: *id001
    InternalError:
      description: >-
        This service failed, and the caller cannot fix it by changing the request. Declared on every
        operation because any of them can reach it.
      content: *id001

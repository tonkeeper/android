components:
  parameters:
    storeCountyCodeQuery:
      description: >
        App-store storefront country, ISO 3166-1 alpha-2, case-insensitive
        (note: United Kingdom is GB, not UK). iOS: SKStorefront/Storefront
        countryCode. Android: Play Store account country. The client should
        ALWAYS send it — the server uses it (together with the other geo
        signals) to resolve the user's country for geo-gated features and asset
        capabilities; omit only if the storefront is genuinely unavailable.
      in: query
      name: store_country_code
      required: false
      schema:
        type: string
        #        pattern: '^[A-Za-z]{2}$'
        example: "GB"
    currency:
      description: >
        Display currency for prices and amounts (fiat ISO 4217 like usd/eur, or
        an asset id). Defaults to usd when omitted. Send the user's currency
        from app settings.
      in: query
      name: currency
      required: false
      schema:
        type: string
        example: "usd"
    deviceCountyCodeQuery:
      description: >
        Region from the device locale/settings, ISO 3166-1 alpha-2
        (note: United Kingdom is GB, not UK). iOS: Locale.current region.
        Android: device locale country. The client should ALWAYS send it —
        it is one of the geo signals the server combines to resolve the user's
        country.
      in: query
      name: device_country_code
      required: false
      schema:
        type: string
        #        pattern: '^[A-Za-z]{2}$'
        example: "GB"
    simCountryQuery:
      description: >
        Country of the SIM card (ISO 3166-1 alpha-2), from the carrier/MCC
        (iOS: CTCarrier isoCountryCode / carrier info; Android:
        TelephonyManager simCountryIso). Send it whenever a SIM is present;
        omit ONLY on devices without a SIM (e.g. Wi-Fi-only tablets). It is
        the strongest geo signal after IP, so missing it lowers country
        detection confidence.
      in: query
      name: sim_country
      required: false
      schema:
        type: string
        example: "DE"
    timezoneQuery:
      description: >
        Device timezone as an IANA name (e.g. Europe/Berlin), not an offset.
        iOS: TimeZone.current.identifier. Android: TimeZone.getDefault().getID().
        The client should ALWAYS send it — it is used as a supporting geo
        signal.
      in: query
      name: timezone
      required: false
      schema:
        type: string
        example: "Europe/Berlin"
    isVpnActiveQuery:
      description: >
        Whether a VPN tunnel is currently active on the device. The client
        should ALWAYS send an explicit true or false — an omitted value means
        "unknown" and lowers the confidence of IP-based country detection
        (true tells the server to distrust the IP country; false confirms it).
      in: query
      name: is_vpn_active
      required: false
      schema:
        type: boolean
        example: false
    XLang:
      name: X-Lang
      in: header
      required: false
      description: >
        Язык для локализуемых текстов (например about), ISO 639-1 (en, ru, ...).
        Клиент должен ВСЕГДА передавать язык интерфейса. Если не задан — дефолт en.
      schema:
        type: string
      example: ru
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: >
        Юзер агент (для совместимости и фичефлагов). Формат:
        "Tonkeeper/<app version> (<OS>; <OS version>; <device model>)".
        Должен передаваться как обычный текст, БЕЗ URL-кодирования
        (iOS-клиент сейчас шлет "Tonkeeper%2F26.07.1%20..." — так platform/build
        не распарсятся у downstream-сервисов, которым он форвардится).
      schema:
        type: string
      example: "Tonkeeper/4.9.0 (iOS; 17.2; iPhone15,3)"

  responses:
    BadRequest:
      description: "Invalid request"
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
                nullable: true
                description: Идентификатор запроса для саппорта/логов.
    Unauthorized:
      description: "Unauthorized"
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
                nullable: true
                description: Идентификатор запроса для саппорта/логов.
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
                nullable: true
                description: Идентификатор запроса для саппорта/логов.
    TooManyRequests:
      description: "Too many requests"
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
                nullable: true
                description: Идентификатор запроса для саппорта/логов.
    InternalError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
                nullable: true
                description: Идентификатор запроса для саппорта/логов.

  schemas:
    MarketListKey:
      type: string
      description: Ключ списка/полки.
      enum: [top_gainers, top_losers, most_traded, core, rwa, market_cap, volume, commodities, stocks, etfs]

    ShelfType:
      type: string
      description: Тип разметки полки.
      enum: [ grid, list ]

    AssetsTab:
      type: string
      description: >
        Табы на экране Assets. Актуальные значения: all, tokens, perpetuals.
        all — все активы (perp-рынки только при show_perps=true); tokens — все активы кроме
        perp-рынков; perpetuals — только perp-рынки (lighter/...).
        stocks/etfs/commodities оставлены для обратной совместимости и работают как раньше;
        новые клиенты вместо них используют tab=all|tokens вместе с filter.
      enum: [all, tokens, stocks, etfs, commodities, perpetuals]

    AssetsSort:
      type: string
      description: По чему сортировать каталог. По умолчанию market_cap. open_interest_usd доступен только при tab=perpetuals, иначе 400.
      enum: [volume_24h, market_cap, price_24h, volume, open_interest_usd]
      default: market_cap

    AssetsOrder:
      type: string
      description: В каком порядке сортировать каталог.
      enum: [desc, asc]
      default: desc

    AssetsFilter:
      type: string
      description: >
        Фильтр по типу актива внутри таба. all — без фильтра (по умолчанию); tokens — только
        крипто-токены (type=crypto); stocks — токенизированные акции; etfs — токенизированные ETF;
        commodities — активы с type=commodities (perp-рынки на золото, нефть и т.п.) плюс pin-лист
        секции commodities (спотовые токены на золото, серебро, нефть).
        Тип perp-рынков берётся из tokenlist Lighter, так что фильтры работают и на tab=perpetuals.
      # default intentionally dropped: the generator would turn it into a Kotlin default argument and every
      # catalog call that omits filter would start sending filter=all
      enum: [all, tokens, stocks, etfs, commodities]

    LinkType:
      type: string
      description: Типы ссылок у ассетов.
      enum: [unspecified, website, telegram, twitter, facebook, instagram, discord, github, getgems, other]

    ShelvesConfigResponse:
      type: object
      required: [groups, generated_at]
      properties:
        groups:
          type: array
          description: >
            Список групп полок в том порядке, в котором клиент должен их отрисовать.
            Полка может быть выключена сервером (enabled=false).
          items:
            $ref: "#/components/schemas/ShelfGroup"
        generated_at:
          type: string
          format: date-time
          description: Когда сервер сгенерировал конфиг.

    ShelvesConfigResponseV2:
      type: object
      required: [ groups, generated_at ]
      properties:
        groups:
          type: array
          description: >
            Список групп полок в том порядке, в котором клиент должен их отрисовать.
            Полка может быть выключена сервером (enabled=false).
          items:
            $ref: "#/components/schemas/MultichainShelfGroup"
        generated_at:
          type: string
          format: date-time
          description: Когда сервер сгенерировал конфиг.

    MultichainShelfGroup:
      type: object
      required: [ id, name, groups ]
      properties:
        id:
          type: string
          description: Айди группы.
        name:
          type: string
          description: Имя мультичейн группы.
        groups:
          type: array
          description: Группы мультичейна
          items:
            $ref: "#/components/schemas/ShelfGroup"

    ShelfGroup:
      type: object
      required: [name, items]
      properties:
        name:
          type: string
          description: Имя группы. (в контексте мультичейн группы - имя сети)
        items:
          type: array
          description: Элементы группы.
          items:
            $ref: "#/components/schemas/ShelfConfig"

    ShelfConfig:
      type: object
      required: [key, title, type, enabled, limit, source, see_all]
      properties:
        key:
          $ref: "#/components/schemas/MarketListKey"
        title:
          type: string
          description: Заголовок полки для UI (может быть локализуемым).
        type:
          $ref: "#/components/schemas/ShelfType"
        source:
          type: string
          description: Источник данных (например dyor/internal).
          example: dyor
        see_all:
          type: object
          required: [enabled, route]
          description: >
            Настройки перехода See all. Если enabled=false — клиент не показывает CTA "See all".
          properties:
            enabled:
              type: boolean
              default: true
            route:
              $ref: "#/components/schemas/AssetsTab"
        items:
          type: array
          description: Элементы полки.
          items:
            $ref: "#/components/schemas/MarketItem"

    AssetsCatalogResponse:
      type: object
      required: [items, data_freshness_sec]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketItem"
        next_cursor:
          type: string
          nullable: true
        data_freshness_sec:
          type: integer
          description: Приблизительная свежесть данных (секунды).
          minimum: 0
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    MarketItem:
      type: object
      required: [asset, metrics]
      properties:
        asset:
          $ref: "#/components/schemas/AssetRefSummary"
        metrics:
          $ref: "#/components/schemas/MarketMetricsSummary"

    AssetRef:
      type: object
      required: [asset_type, id, address, symbol, name, decimals, trust_score, image_url, is_scam, verification]
      properties:
        asset_type:
          $ref: "#/components/schemas/AssetType"
        id:
          type: string
          description: Айди ассета (ton/mainnet/jetton/0:b11...,ton/mainnet/stocks/0:abc...)
        symbol:
          type: string
          description: Тикер (display).
        name:
          type: string
          description: Название (display).
        decimals:
          type: integer
          description: Decimals для отображения и форматирования.
          minimum: 0
          maximum: 30
        trust_score:
          type: integer
          description: Trust score of the token
          minimum: 0
          maximum: 100
        image_url:
          type: string
          description: URL иконки/логотипа.
        is_scam:
          type: boolean
          deprecated: true
          description: Ассет скам или нет
        verification:
          type: string
          description: Усовершенствованная версия is_scam
          enum: [trusted, whitelist, none, blacklist]
        reference_id:
          type: string
          description: >
            Айди связанного spot-ассета, у которого заимствованы метаданные (например для perp-рынка
            lighter/... это ассет с тем же тикером). Отсутствует, если связи нет.
          example: btc/mainnet/coin
        perps:
          $ref: "#/components/schemas/PerpMarket"

    AssetRefSummary:
      type: object
      required: [ asset_type, id, address, symbol, name, decimals, trust_score, image_url, is_scam, verification ]
      properties:
        asset_type:
          $ref: "#/components/schemas/AssetType"
        id:
          type: string
          description: Айди ассета (ton/mainnet/jetton/0:b11...,ton/mainnet/stocks/0:abc...)
        symbol:
          type: string
          description: Тикер (display).
        name:
          type: string
          description: Название (display).
        decimals:
          type: integer
          description: Decimals для отображения и форматирования.
          minimum: 0
          maximum: 30
        trust_score:
          type: integer
          description: Trust score of the token
          minimum: 0
          maximum: 100
        image_url:
          type: string
          description: URL иконки/логотипа.
        is_scam:
          type: boolean
          deprecated: true
          description: Ассет скам или нет
        verification:
          type: string
          description: Усовершенствованная версия is_scam
          enum: [ trusted, whitelist, none, blacklist ]
        leverage:
          type: integer
          description: Leverage для отображения и плеча.

    AssetType:
      type: string
      description: Тип ассета. commodities сейчас выставляется только perp-рынкам (золото, нефть, ...), спотовые товарные токены остаются asset.
      enum: [ asset, stocks, etfs, commodities, perpetuals ]

    Link:
      type: object
      required: [name, url, type]
      description: >
        Ссылка на ресурсы ассета.
      properties:
        name:
          type: string
          description: Имя ссылки.
          example: "Community in Telegram"
        url:
          type: string
          description: Ссылка на ресурс.
          example: "https://www.google.com"
        type:
          $ref: "#/components/schemas/LinkType"

    MarketMetricsSummary:
      type: object
      required: [ price, volume, change_24h_percent, provider, as_of ]
      description: >
        Краткое описание рыночных метрик.
      properties:
        volume:
          type: string
          description: Объем торгов
          example: 10000000000
        market_cap:
          type: string
          description: Рыночная капитализация в USD (decimal string). Отсутствует, если неизвестна.
          example: "987654321.00"
        price:
          type: string
          description: Цена.
          example: "1.0002"
        change_24h_percent:
          type: string
          description: Изменение за 24ч в процентах.
          example: "-0.12"
        provider:
          type: string
          description: Какой провайдер отдал метрики (для дебага/наблюдаемости).
        as_of:
          type: string
          format: date-time
          description: Timestamp, когда метрика была актуальна у провайдера.

    AssetDetailsResponse:
      type: object
      required: [asset, sections, data_freshness_sec, info_source]
      properties:
        asset:
          $ref: "#/components/schemas/AssetRef"
        sections:
          $ref: "#/components/schemas/AssetSections"
        capabilities:
          $ref: "#/components/schemas/AssetCapabilities"
        data_freshness_sec:
          type: integer
        info_source:
          $ref: "#/components/schemas/AssetInfoSource"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    PerpMarket:
      type: object
      description: >
        Perpetual market data for p/<protocol>/... assets (Lighter), present only for them. Mirrors the
        tk-perps /screens/markets Market object field for field, served from a 2-second snapshot of the
        exchange. Monetary/price/size fields are human-unit decimal strings in USD (not converted to the
        requested currency); the *_decimals fields tell the client how to scale them back into integer
        units when building/signing a tx.
      required: [market_index, symbol, base_asset, quote_asset, status, price_decimals, size_decimals,
                 tick_size, step_size, min_size_base, max_size_base, min_size_quote, max_size_quote,
                 max_leverage, maker_fee_pct, taker_fee_pct, initial_margin_fraction,
                 maintenance_margin_fraction, closeout_margin_fraction, open_interest_usd, volume_24h_usd,
                 last_price, index_price, mark_price, price_change_24h, high_24h, low_24h]
      properties:
        market_index:
          type: integer
        symbol:
          type: string
        base_asset:
          type: string
        quote_asset:
          type: string
        status:
          type: string
          description: Market trading status (e.g. active, inactive).
        price_decimals:
          type: integer
          description: Number of decimal places used to scale prices for signing.
        size_decimals:
          type: integer
          description: Number of decimal places used to scale base sizes for signing.
        tick_size:
          type: string
          description: Minimum price increment, human-unit decimal string.
          example: '0.01'
        step_size:
          type: string
          description: Minimum base size increment, human-unit decimal string.
          example: '0.0001'
        min_size_base:
          type: string
          description: Minimum order size in base units.
        max_size_base:
          type: string
          description: Maximum order size in base units; empty when the exchange publishes none.
        min_size_quote:
          type: string
          description: Minimum order notional in quote units.
        max_size_quote:
          type: string
          description: Maximum order notional in quote units.
        max_leverage:
          type: integer
        maker_fee_pct:
          type: string
          description: Maker fee as a percentage string.
        taker_fee_pct:
          type: string
          description: Taker fee as a percentage string.
        initial_margin_fraction:
          type: integer
          description: Initial margin fraction in basis points (1/10000).
        maintenance_margin_fraction:
          type: integer
          description: Maintenance margin fraction in basis points (1/10000).
        closeout_margin_fraction:
          type: integer
          description: Closeout margin fraction in basis points (1/10000).
        funding_rate_hourly:
          type: string
          description: Current hourly funding rate, decimal string. Absent when the exchange reports none.
          example: '0.0000125'
        next_funding_at:
          type: string
          format: date-time
          nullable: true
        open_interest_usd:
          type: string
          description: Open interest as reported by the exchange, decimal string.
        volume_24h_usd:
          type: string
        last_price:
          type: string
        index_price:
          type: string
        mark_price:
          type: string
        price_change_24h:
          type: string
          description: 24h price change in percent.
        high_24h:
          type: string
        low_24h:
          type: string

    AssetInfoSource:
      type: object
      required: [ displayed_name, url ]
      properties:
        displayed_name:
          type: string
          description: Название источника для подписи под данными ассета.
          example: "dyor.io"
        url:
          type: string
          format: uri
          description: Ссылка на страницу .
          example: "https://dyor.io/"

    AssetSections:
      type: object
      description: >
        Секции экрана ассета. Важно: сервер определяет enabled/disabled для каждой секции
        в зависимости от типа ассета и правил (например stocks/RWA).
      required: [about, overview, trading_activity, links, chart, transaction_history]
      properties:
        about:
          $ref: "#/components/schemas/SectionAbout"
        overview:
          $ref: "#/components/schemas/SectionOverview"
        trading_activity:
          $ref: "#/components/schemas/SectionTradingActivity"
        links:
          $ref: "#/components/schemas/SectionLinks"

    SectionAbout:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          nullable: true
          description: Описание ассета/компании.
        source:
          type: string
          nullable: true
          description: Источник текста (local/dyor/...).
        note:
          type: string
          nullable: true
          description: Причина выключения (например для stocks).

    SectionOverview:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        market_cap:
          type: string
          nullable: true
        total_supply:
          type: string
          nullable: true
        circulating_supply:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
          description: Причина выключения (например для stocks).

    SectionTradingActivity:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        volume_change_24h:
          type: string
          nullable: true
          example: "-2.29"
        volume_24h:
          type: string
          nullable: true
          example: "12345678"
        buy_24h:
          type: string
          nullable: true
          example: "12345678"
        sell_24h:
          type: string
          nullable: true
          example: "12345678"
        note:
          type: string
          nullable: true

    SectionLinks:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        note:
          type: string
          nullable: true
          description: Причина выключения (например для stocks).

    ChartPoints:
      type: array
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
      description: |
        Each inner array is a pair [timestamp, price]:
          • index 0 — Unix timestamp (int64)  
          • index 1 — token price (decimal) in the requested currency.
      example: [ [ 1668436763, 97.21323234 ] ]

    AssetCapability:
      type: string
      description: Capability flag. Clients must tolerate unknown values added later
      enum:
        - onramp
        - offramp
        - swap
        - p2p
    AssetCapabilityMerchants:
      type: object
      properties:
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeMerchantSlug'
    ExchangeMerchantSlug:
      type: string
      enum:
        - mercuryo
        - transak
        - moonpay
        - avanchange
        - changelly
        - wallet
    AssetCapabilityAggregators:
      type: object
      properties:
        aggregators:
          type: array
          items:
            type: string
    AssetCapabilityP2PInfo:
      type: object
      properties:
        symbol:
          type: string
          description: P2P symbol matched against this asset (e.g. `TON`, `USDT`)
    AssetCapabilityDetails:
      type: object
      description: Per-capability extra info. Keys appear only when meaningful for the listed capability
      properties:
        onramp:
          $ref: '#/components/schemas/AssetCapabilityMerchants'
        offramp:
          $ref: '#/components/schemas/AssetCapabilityMerchants'
        swap:
          $ref: '#/components/schemas/AssetCapabilityAggregators'
        p2p:
          $ref: '#/components/schemas/AssetCapabilityP2PInfo'
    AssetCapabilities:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AssetCapability'
        details:
          $ref: '#/components/schemas/AssetCapabilityDetails'

    Warning:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Код предупреждения.
          enum: [STALE_DATA, PARTIAL_DATA, DEPENDENCY_FAILURE, FILTER_NOT_SUPPORTED]
        message:
          type: string
          nullable: true
          description: Человекочитаемое описание (для логов/дебага, UI обычно не показывает).
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Доп. контекст.
